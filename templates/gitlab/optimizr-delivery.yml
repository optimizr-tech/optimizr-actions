# Thin protected GitLab adapter for scripts/delivery/ci.py.
#
# The consumer must configure OPTIMIZR_DELIVERY_PROTECTED_RUNNER as a protected
# CI/CD variable with the literal value "true" and register the runner tag as
# protected in GitLab. The entrypoint must call execute_ci_delivery with the
# provider's fixed gate callback.
.optimizr-delivery:
  stage: deploy
  resource_group: "optimizr-delivery-${OPTIMIZR_DELIVERY_SERVICE}"
  tags:
    - "$OPTIMIZR_DELIVERY_RUNNER_TAG"
  variables:
    OPTIMIZR_DELIVERY_PROVIDER: gitlab-ci
    OPTIMIZR_DELIVERY_PROTECTED_REF: "true"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^deploy-/'
      when: manual
      allow_failure: false
    - when: never
  script:
    - |
      set -eu
      test -n "${OPTIMIZR_DELIVERY_SERVICE:-}"
      test -n "${OPTIMIZR_DELIVERY_RUNNER_TAG:-}"
      test "${OPTIMIZR_DELIVERY_PROTECTED_RUNNER:-}" = "true"
      entrypoint="${OPTIMIZR_DELIVERY_ENTRYPOINT:-}"
      test -n "$entrypoint"
      case "$entrypoint" in
        "$CI_PROJECT_DIR"/*)
          ;;
        *)
          echo "OPTIMIZR_DELIVERY_ENTRYPOINT must remain below CI_PROJECT_DIR" >&2
          exit 2
          ;;
      esac
      test -f "$entrypoint"
      python "$entrypoint"
