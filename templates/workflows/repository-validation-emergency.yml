name: Reviewed repository validation
on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Protected environment requiring reviewer approval
        type: environment
        required: true
      runner_json:
        description: JSON labels for the trusted self-hosted runner
        type: string
        required: true
        default: '["self-hosted","Linux","validation"]'
      candidate_sha:
        description: Exact trusted main commit SHA to validate
        type: string
        required: true
      script_path:
        description: Repository-owned executable path
        type: string
        required: true
      args_json:
        description: JSON array of literal arguments
        type: string
        required: false
        default: "[]"
      trusted_ref:
        description: Trusted full branch ref
        type: string
        required: false
        default: refs/heads/main
permissions:
  contents: read
jobs:
  validation:
    uses: optimizr-tech/optimizr-actions/.github/workflows/_repository-validation-emergency.yml@v1
    with:
      environment_name: ${{ inputs.environment_name }}
      runner_json: ${{ inputs.runner_json }}
      candidate_sha: ${{ inputs.candidate_sha }}
      script_path: ${{ inputs.script_path }}
      args_json: ${{ inputs.args_json }}
      trusted_ref: ${{ inputs.trusted_ref }}
