# Reusable: semantic-release with a dry-run and optional release badge update.
# Consume via: uses: optimizr-tech/optimizr-actions/.github/workflows/_semantic-release.yml@v1

name: _semantic-release

# Concurrency belongs to the caller release.yml. Repeating the same concurrency
# group in a reusable workflow can deadlock workflow_call executions.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Controlled Node.js version used by the release runtime"
        required: false
        type: string
        default: "24"
      npm_version:
        description: "Controlled npm version used before dependency installation"
        required: false
        type: string
        default: "12.0.2"
      install_command:
        description: "Node project dependency install command; skipped in package-less mode"
        required: false
        type: string
        default: "npm ci"
      package_mode:
        description: "node uses the caller's Node manifests; package-less installs only release tooling"
        required: false
        type: string
        default: "node"
      working_directory:
        description: "Release project directory under the checkout; Node mode is restricted to the repository root"
        required: false
        type: string
        default: "."
      semantic_release_version:
        description: "semantic-release version installed in the ephemeral runtime"
        required: false
        type: string
        default: "25.0.5"
      semantic_release_extra_packages:
        description: "Optional extra semantic-release runtime packages, separated by spaces"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner JSON array, for example ['self-hosted', 'Linux', 'service']"
        required: false
        type: string
        default: '["self-hosted"]'
      releaserc_source:
        description: "local uses the caller .releaserc.json; canonical downloads the optimizr-actions template"
        required: false
        type: string
        default: "local"
      actions_ref:
        description: "Governed v1 tag used for canonical assets in normal mode; protected mode uses the exact called workflow SHA"
        required: false
        type: string
        default: "v1"
      update_release_badge:
        description: "Update assets/badges/release.svg after semantic-release completes"
        required: false
        type: boolean
        default: false
      protected_main_mode:
        description: "Publish tag and GitHub Release without pushing generated commits to the protected branch"
        required: false
        type: boolean
        default: false
      skip:
        description: "Explicitly skip release by caller policy; [skip-tests] never controls releases"
        required: false
        type: boolean
        default: false
      validate_only:
        description: "Run setup and the semantic-release dry-run without publishing a release or badge"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    # Test bypass markers are intentionally ignored here. Release is a separate,
    # self-hosted stage and semantic-release decides whether a version is due.
    if: ${{ !inputs.skip }}
    name: Release
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    steps:
      - name: Validate protected-main inputs
        if: inputs.protected_main_mode
        shell: bash
        env:
          RELEASERC_SOURCE: ${{ inputs.releaserc_source }}
          UPDATE_RELEASE_BADGE: ${{ inputs.update_release_badge }}
        run: |
          set -euo pipefail
          if [[ "$RELEASERC_SOURCE" != "canonical" ]]; then
            echo "::error::protected_main_mode requires releaserc_source=canonical"
            exit 2
          fi
          if [[ "$UPDATE_RELEASE_BADGE" == "true" ]]; then
            echo "::error::protected_main_mode is incompatible with update_release_badge=true"
            exit 2
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: ${{ !inputs.validate_only }}

      - name: Validate package mode
        shell: bash
        env:
          PACKAGE_MODE: ${{ inputs.package_mode }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MODE" in
            node|package-less) ;;
            *)
              echo "::error::package_mode must be 'node' or 'package-less'"
              exit 2
              ;;
          esac

      - name: Validate release working directory
        shell: bash
        env:
          PACKAGE_MODE: ${{ inputs.package_mode }}
          RELEASE_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys

          raw_directory = os.environ["RELEASE_DIRECTORY"]
          if not raw_directory or any(ord(character) < 32 for character in raw_directory):
              print("::error::working_directory must be a non-empty path without control characters")
              raise SystemExit(2)

          configured_directory = Path(raw_directory)
          if configured_directory.is_absolute():
              print("::error::working_directory must be relative to the checkout")
              raise SystemExit(2)

          checkout_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          try:
              resolved_directory = (checkout_root / configured_directory).resolve(strict=True)
              resolved_directory.relative_to(checkout_root)
          except (OSError, RuntimeError, ValueError):
              print("::error::working_directory must resolve to a directory inside the checkout")
              raise SystemExit(2)

          if not resolved_directory.is_dir():
              print("::error::working_directory must resolve to an existing directory")
              raise SystemExit(2)
          if os.environ["PACKAGE_MODE"] == "node" and resolved_directory != checkout_root:
              print("::error::Node package mode requires working_directory='.'")
              raise SystemExit(2)
          PY

      - name: Validate package-less workflow identity
        if: inputs.package_mode == 'package-less'
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REPOSITORY" != "optimizr-tech/optimizr-actions" ]]; then
            echo "::error::package-less release workflow repository is not trusted"
            exit 2
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::package-less release workflow SHA is not immutable"
            exit 2
          fi

      - name: Guard shared action checkout path
        if: inputs.package_mode == 'package-less'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_PATH="$GITHUB_WORKSPACE/.optimizr-actions-release"
          if [[ -e "$TARGET_PATH" || -L "$TARGET_PATH" ]]; then
            echo "::error::shared release action checkout path already exists"
            exit 2
          fi

      - name: Checkout shared package-less validation action
        if: inputs.package_mode == 'package-less'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: optimizr-tech/optimizr-actions
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-release
          persist-credentials: false

      - name: Setup Node.js with project cache
        if: inputs.package_mode == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0  # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Setup controlled npm
        if: inputs.package_mode == 'node'
        shell: bash
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          case "$NPM_VERSION" in
            ""|*[!0-9A-Za-z._+-]*)
              echo "::error::npm_version contains unsupported characters"
              exit 2
              ;;
          esac
          npm install --global --no-audit --no-fund "npm@${NPM_VERSION}"
          node --version
          npm --version

      - name: Install dependencies
        if: inputs.package_mode == 'node'
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Resolve canonical release assets
        if: inputs.releaserc_source == 'canonical'
        working-directory: ${{ inputs.working_directory }}
        env:
          REQUESTED_REF: ${{ inputs.actions_ref }}
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          PROTECTED_MAIN_MODE: ${{ inputs.protected_main_mode }}
        run: |
          set -euo pipefail
          SOURCE_REPOSITORY="optimizr-tech/optimizr-actions"
          SOURCE_REF="$REQUESTED_REF"

          if [[ "$PROTECTED_MAIN_MODE" == "true" ]]; then
            readarray -t workflow_identity < <(
              python3 - <<'PY'
          import json
          import os

          job_context = json.loads(os.environ["JOB_CONTEXT_JSON"])
          print(job_context.get("workflow_repository", ""))
          print(job_context.get("workflow_sha", ""))
          PY
            )
            WORKFLOW_REPOSITORY="${workflow_identity[0]:-}"
            WORKFLOW_SHA="${workflow_identity[1]:-}"
            SOURCE_REPOSITORY="$WORKFLOW_REPOSITORY"
            SOURCE_REF="$WORKFLOW_SHA"
            if [[ "$SOURCE_REPOSITORY" != "optimizr-tech/optimizr-actions" ]]; then
              echo "::error::protected-main workflow repository is not trusted"
              exit 2
            fi
            if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::protected-main workflow SHA is not immutable"
              exit 2
            fi
          fi

          if [[ -z "$SOURCE_REF" ]]; then
            echo "::error::canonical assets require a non-empty source ref"
            exit 2
          fi

          fetch_asset() {
            local ASSET_PATH="$1"
            local DESTINATION="$2"
            curl --fail --silent --show-error --connect-timeout 15 --max-time 60 --get \
              --header "Accept: application/vnd.github.raw+json" \
              --data-urlencode "ref=${SOURCE_REF}" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/contents/${ASSET_PATH}" \
              --output "$DESTINATION"
          }

          DEST=".releaserc.json"
          fetch_asset "templates/.releaserc.json" "$DEST"
          echo "Using canonical releaserc from ${SOURCE_REPOSITORY}@${SOURCE_REF}"

          if [[ "$PROTECTED_MAIN_MODE" == "true" ]]; then
            TRANSFORMER="$RUNNER_TEMP/prepare_protected_releaserc.py"
            fetch_asset "scripts/release/prepare_protected_releaserc.py" "$TRANSFORMER"
            chmod 700 "$TRANSFORMER"
            echo "Using protected-main transformer from ${SOURCE_REPOSITORY}@${SOURCE_REF}"
          fi

      - name: Prepare protected-main release config
        if: inputs.protected_main_mode
        working-directory: ${{ inputs.working_directory }}
        run: python3 "$RUNNER_TEMP/prepare_protected_releaserc.py" .releaserc.json

      - name: Install semantic-release runtime
        if: inputs.package_mode == 'node'
        working-directory: ${{ inputs.working_directory }}
        env:
          SEMANTIC_RELEASE_VERSION: ${{ inputs.semantic_release_version }}
          SEMANTIC_RELEASE_EXTRA_PACKAGES: ${{ inputs.semantic_release_extra_packages }}
        run: |
          set -euo pipefail
          if [[ ! -f .releaserc.json ]]; then
            echo "::error::.releaserc.json not found"
            exit 1
          fi

          mapfile -t plugin_packages < <(
            node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('.releaserc.json','utf8')); const plugins=Array.isArray(cfg.plugins)?cfg.plugins:[]; const names=plugins.map((plugin)=>Array.isArray(plugin)?plugin[0]:plugin).filter((plugin)=>typeof plugin==='string').filter((plugin)=>!/^[./]/.test(plugin)); process.stdout.write([...new Set(names)].join('\\n'));"
          )

          install_packages=("semantic-release@${SEMANTIC_RELEASE_VERSION}")
          for pkg in "${plugin_packages[@]}"; do
            [[ -n "$pkg" ]] || continue
            case "$pkg" in
              "@semantic-release/commit-analyzer"|\
              "@semantic-release/release-notes-generator"|\
              "@semantic-release/npm"|\
              "@semantic-release/github")
                printf 'Using bundled semantic-release default plugin: %s\n' "$pkg"
                ;;
              *)
                install_packages+=("$pkg")
                ;;
            esac
          done

          if [[ -n "${SEMANTIC_RELEASE_EXTRA_PACKAGES}" ]]; then
            # shellcheck disable=SC2206
            extra_packages=(${SEMANTIC_RELEASE_EXTRA_PACKAGES})
            install_packages+=("${extra_packages[@]}")
          fi

          printf 'Installing semantic-release runtime packages:\n%s\n' "${install_packages[@]}"
          npm install --no-save --package-lock=false --no-audit --no-fund "${install_packages[@]}"

      - name: Validate Node changelog preset compatibility
        if: inputs.package_mode == 'node'
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const releaseConfig = JSON.parse(fs.readFileSync(".releaserc.json", "utf8"));
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const plugins = Array.isArray(releaseConfig.plugins) ? releaseConfig.plugins : [];
          const usesConventionalCommitsPreset = plugins.some((plugin) => {
            const options = Array.isArray(plugin) && plugin.length > 1 ? plugin[1] : null;
            return options && options.preset === "conventionalcommits";
          });

          if (!usesConventionalCommitsPreset) {
            console.log("No conventionalcommits preset selected; compatibility check is not required.");
            process.exit(0);
          }

          const dependencies = {
            ...(packageJson.dependencies || {}),
            ...(packageJson.devDependencies || {}),
          };
          const presetSpec = dependencies["conventional-changelog-conventionalcommits"];
          const writerSpec = dependencies["conventional-changelog-writer"];
          const lockedPreset = packageLock.packages?.[
            "node_modules/conventional-changelog-conventionalcommits"
          ]?.version;
          const lockedWriter = packageLock.packages?.[
            "node_modules/conventional-changelog-writer"
          ]?.version;
          const declaredPresetMajor = String(presetSpec || "").match(/(?:^|[^0-9])(\d+)/)?.[1];
          const lockedPresetMajor = String(lockedPreset || "").match(/^(\d+)/)?.[1];
          const declaredWriterMajor = String(writerSpec || "").match(/(?:^|[^0-9])(\d+)/)?.[1];
          const lockedWriterMajor = String(lockedWriter || "").match(/^(\d+)/)?.[1];
          const compatibleWriterByPreset = { "9": "8", "10": "9" };
          const requiredWriterMajor = compatibleWriterByPreset[lockedPresetMajor];
          const writerDeclarationMatches =
            declaredWriterMajor === requiredWriterMajor ||
            (lockedPresetMajor === "9" && !writerSpec);

          if (
            !requiredWriterMajor ||
            declaredPresetMajor !== lockedPresetMajor ||
            !writerDeclarationMatches ||
            lockedWriterMajor !== requiredWriterMajor
          ) {
            console.error(
              "::error::unsupported conventionalcommits compatibility pair. " +
                "Supported pairs are preset 9.x + writer 8.x, or preset 10.x + writer 9.x. " +
                `Found preset manifest=${presetSpec || "missing"}, preset lockfile=${lockedPreset || "missing"}, ` +
                `writer manifest=${writerSpec || "missing"}, writer lockfile=${lockedWriter || "missing"}.`
            );
            process.exit(1);
          }

          console.log(
            `Compatible conventionalcommits preset ${lockedPreset} + writer ${lockedWriter} selected.`
          );
          NODE

      - name: Validate package-less release plan
        if: inputs.package_mode == 'package-less'
        uses: ./.optimizr-actions-release/.github/actions/package-less-release-validation
        with:
          working-directory: ${{ inputs.working_directory }}
          node-version: ${{ inputs.node_version }}
          npm-version: ${{ inputs.npm_version }}
          semantic-release-version: ${{ inputs.semantic_release_version }}
          semantic-release-extra-packages: ${{ inputs.semantic_release_extra_packages }}
          github-token: ${{ github.token }}

      - name: Verify release plan with GitHub token
        if: inputs.package_mode == 'node'
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release --dry-run

      - name: Release
        if: ${{ !inputs.validate_only }}
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

  update-release-badge:
    name: Update release badge
    needs: release
    if: ${{ inputs.update_release_badge && !inputs.protected_main_mode && !inputs.validate_only && needs.release.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout released branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}

      - name: Sync branch after semantic-release
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Resolve latest semantic version tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          VERSION=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [[ -z "$VERSION" ]]; then
            echo "No semantic version tag found; badge update is a no-op"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update badge
        if: steps.tag.outputs.version != ''
        uses: optimizr-tech/optimizr-actions/.github/actions/update-release-badge@v1
        with:
          version: ${{ steps.tag.outputs.version }}
