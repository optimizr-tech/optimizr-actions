name: _supply-chain-evidence
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, or ephemeral-pr
        required: false
        type: string
        default: none
      image_refs:
        description: Whitespace or newline separated local image references or IDs
        required: true
        type: string
      trivy_version:
        description: Controlled Trivy release
        required: false
        type: string
        default: v0.74.0
      trivy_cache_scope:
        description: repository keeps isolated caches; shared reuses the versioned vulnerability DB on a persistent runner
        required: false
        type: string
        default: shared
      artifact_name:
        description: Evidence artifact name
        required: false
        type: string
        default: supply-chain-evidence
      retention_days:
        description: Evidence retention period
        required: false
        type: number
        default: 90
    outputs:
      result:
        description: Gate result, failed closed when evidence is unavailable
        value: ${{ jobs.supply-chain.outputs.result }}
      evidence_record:
        description: Compact JSON identity record for the evidence bundle
        value: ${{ jobs.supply-chain.outputs.evidence_record }}
      evidence_sha256:
        description: SHA-256 of the raw evidence manifest
        value: ${{ jobs.supply-chain.outputs.evidence_sha256 }}
      evidence_artifact_name:
        description: Uploaded evidence artifact name
        value: ${{ jobs.supply-chain.outputs.evidence_artifact_name }}
      evidence_artifact_id:
        description: Uploaded evidence artifact identifier
        value: ${{ jobs.supply-chain.outputs.evidence_artifact_id }}
      evidence_artifact_digest:
        description: Uploaded artifact archive SHA-256
        value: ${{ jobs.supply-chain.outputs.evidence_artifact_digest }}
permissions:
  contents: read
jobs:
  supply-chain:
    name: Image SBOM and provenance
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 30
    outputs:
      result: ${{ steps.bundle.outputs.result }}
      evidence_record: ${{ steps.bundle.outputs.evidence_record }}
      evidence_sha256: ${{ steps.bundle.outputs.evidence_sha256 }}
      evidence_artifact_name: ${{ steps.bundle.outputs.evidence_artifact_name }}
      evidence_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(
              not isinstance(value, str) or not value for value in labels
          ):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit(
                      'hosted validation must use ["ubuntu-latest"] with mode=none'
                  )
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if (
                  os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"}
                  or os.environ["EVENT_REF"] != "refs/heads/main"
              ):
                  raise SystemExit(
                      "trusted-main requires push/workflow_dispatch on refs/heads/main"
                  )
          elif mode == "ephemeral-pr":
              if (
                  os.environ["EVENT_NAME"] != "pull_request"
                  or "ephemeral" not in labels
              ):
                  raise SystemExit(
                      "ephemeral-pr requires pull_request and an ephemeral runner label"
                  )
          else:
              raise SystemExit(
                  "self-hosted validation requires mode trusted-main or ephemeral-pr"
              )
          PY

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - name: Verify checkout integrity
        uses: optimizr-tech/optimizr-actions/.github/actions/checkout-integrity@v1
        with:
          expected_sha: ${{ github.sha }}
      - name: Generate image evidence
        uses: optimizr-tech/optimizr-actions/.github/actions/supply-chain-evidence@v1
        with:
          image_refs: ${{ inputs.image_refs }}
          trivy_version: ${{ inputs.trivy_version }}
          cache_scope: ${{ inputs.self_hosted_mode == 'ephemeral-pr' && 'repository' || inputs.trivy_cache_scope }}
      - name: Checkout reusable evidence helper
        id: checkout_evidence
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-source
          persist-credentials: false
      - name: Write SHA-bound evidence bundle
        id: bundle
        if: ${{ always() && steps.checkout_evidence.outcome == 'success' }}
        uses: ./.optimizr-actions-source/.github/actions/security-evidence-bundle
        with:
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          producer_repository: ${{ job.workflow_repository }}
          producer_ref: ${{ job.workflow_ref }}
          producer_sha: ${{ job.workflow_sha }}
          producer_file: ${{ job.workflow_file_path }}
          source_sha: ${{ github.sha }}
          expected_source_sha: ${{ github.sha }}
          conclusion: ${{ job.status }}
          artifact_name: ${{ inputs.artifact_name }}
          evidence_directory: artifacts/supply-chain
      - name: Upload supply-chain evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/supply-chain
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
