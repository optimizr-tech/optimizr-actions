name: Organization Actions adoption audit
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: organization-actions-adoption-audit
  cancel-in-progress: true
jobs:
  public-report:
    name: Public redacted adoption report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_AUDIT_REPOSITORIES: ${{ secrets.ORG_AUDIT_REPOSITORIES }}
      ORG_AUDIT_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN }}
    steps:
      - name: Checkout audit implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public audit configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ORG_AUDIT_REPOSITORIES//[[:space:],]/}" ] || {
            echo "::error::ORG_AUDIT_REPOSITORIES is not configured" >&2
            exit 1
          }
          [ -n "${ORG_AUDIT_TOKEN//[[:space:]]/}" ] || {
            echo "::error::ORG_AUDIT_TOKEN is not configured" >&2
            exit 1
          }
      - name: Audit selected repositories through the contents API
        id: audit
        run: |
          python3 scripts/org_audit/combined.py \
            --repositories-env ORG_AUDIT_REPOSITORIES \
            --token-env ORG_AUDIT_TOKEN \
            --output-dir public-report \
            --public
      - name: Validate generated public audit reports
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s public-report/report.json || {
            echo "::error::public audit JSON report was not produced" >&2
            exit 1
          }
          test -s public-report/report.md || {
            echo "::error::public audit Markdown report was not produced" >&2
            exit 1
          }
      - name: Upload redacted public report
        id: upload_public_report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: organization-adoption-public-report
          path: |
            public-report/report.json
            public-report/report.md
          if-no-files-found: error
          retention-days: 30
      - name: Verify public audit artifact upload
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_public_report.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_public_report.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID" || {
            echo "::error::public audit artifact was not produced" >&2
            exit 1
          }
          test -n "$ARTIFACT_DIGEST" || {
            echo "::error::public audit artifact digest was not produced" >&2
            exit 1
          }

  private-issue-report:
    name: Update private central audit issue
    needs: [public-report]
    if: needs.public-report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_AUDIT_REPOSITORIES: ${{ secrets.ORG_AUDIT_REPOSITORIES }}
      ORG_AUDIT_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN }}
      ORG_AUDIT_ISSUE_REF: ${{ secrets.ORG_AUDIT_ISSUE_REF }}
      ORG_AUDIT_ISSUE_TOKEN: ${{ secrets.ORG_AUDIT_ISSUE_TOKEN }}
      ORG_AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout audit implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate private audit configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ORG_AUDIT_REPOSITORIES//[[:space:],]/}" ] || {
            echo "::error::ORG_AUDIT_REPOSITORIES is not configured" >&2
            exit 1
          }
          [ -n "${ORG_AUDIT_TOKEN//[[:space:]]/}" ] || {
            echo "::error::ORG_AUDIT_TOKEN is not configured" >&2
            exit 1
          }
          [ -n "${ORG_AUDIT_ISSUE_REF//[[:space:]]/}" ] || {
            echo "::error::ORG_AUDIT_ISSUE_REF is not configured" >&2
            exit 1
          }
          [ -n "${ORG_AUDIT_ISSUE_TOKEN//[[:space:]]/}" ] || {
            echo "::error::ORG_AUDIT_ISSUE_TOKEN is not configured" >&2
            exit 1
          }
      - name: Update private issue
        run: |
          private_dir="$RUNNER_TEMP/optimizr-private-audit"
          python3 scripts/org_audit/combined.py \
            --repositories-env ORG_AUDIT_REPOSITORIES \
            --token-env ORG_AUDIT_TOKEN \
            --output-dir "$private_dir" \
            --issue-ref-env ORG_AUDIT_ISSUE_REF \
            --issue-token-env ORG_AUDIT_ISSUE_TOKEN \
            --run-url-env ORG_AUDIT_RUN_URL
          rm -rf "$private_dir"
