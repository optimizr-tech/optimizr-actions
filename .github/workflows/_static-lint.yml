name: _static-lint
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, ephemeral-pr, or trusted-pr
        required: false
        type: string
        default: none
      shellcheck_severity:
        description: error, warning, info, or style
        required: false
        type: string
        default: warning
      exclusions:
        description: Newline-separated repository-relative exclusion globs
        required: false
        type: string
        default: ""
      artifact_name:
        description: Evidence artifact name
        required: false
        type: string
        default: static-lint-evidence
      retention_days:
        description: Evidence retention period
        required: false
        type: number
        default: 30
    outputs:
      result:
        description: Gate result, failed closed when evidence is unavailable
        value: ${{ jobs.static-lint.outputs.result }}
      evidence_record:
        description: Compact JSON identity record for the evidence bundle
        value: ${{ jobs.static-lint.outputs.evidence_record }}
      evidence_sha256:
        description: SHA-256 of the raw evidence manifest
        value: ${{ jobs.static-lint.outputs.evidence_sha256 }}
      evidence_artifact_name:
        description: Uploaded evidence artifact name
        value: ${{ jobs.static-lint.outputs.evidence_artifact_name }}
      evidence_artifact_id:
        description: Uploaded evidence artifact identifier
        value: ${{ jobs.static-lint.outputs.evidence_artifact_id }}
      evidence_artifact_digest:
        description: Uploaded artifact archive SHA-256
        value: ${{ jobs.static-lint.outputs.evidence_artifact_digest }}
permissions:
  contents: read
jobs:
  static-lint:
    name: Shell and Actions validation
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 20
    outputs:
      result: ${{ steps.bundle.outputs.result }}
      evidence_record: ${{ steps.bundle.outputs.evidence_record }}
      evidence_sha256: ${{ steps.bundle.outputs.evidence_sha256 }}
      evidence_artifact_name: ${{ steps.bundle.outputs.evidence_artifact_name }}
      evidence_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(
              not isinstance(value, str) or not value for value in labels
          ):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit(
                      'hosted validation must use ["ubuntu-latest"] with mode=none'
                  )
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if (
                  os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"}
                  or os.environ["EVENT_REF"] != "refs/heads/main"
              ):
                  raise SystemExit(
                      "trusted-main requires push/workflow_dispatch on refs/heads/main"
                  )
          elif mode == "trusted-pr":
              if os.environ["EVENT_NAME"] != "pull_request":
                  raise SystemExit(
                      "trusted-pr requires pull_request on an authorized persistent runner"
                  )
          elif mode == "ephemeral-pr":
              if (
                  os.environ["EVENT_NAME"] != "pull_request"
                  or "ephemeral" not in labels
              ):
                  raise SystemExit(
                      "ephemeral-pr requires pull_request and an ephemeral runner label"
                  )
          else:
              raise SystemExit(
                  "self-hosted validation requires mode trusted-main, ephemeral-pr, or trusted-pr"
              )
          PY

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Derive tracked lint paths
        id: checkout_paths
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], cwd=os.environ["WORKSPACE"]
          ).decode("utf-8").split("\0")
          required = sorted(
              path
              for path in tracked
              if path
              and (
                  PurePosixPath(path).suffix in {".sh", ".bash"}
                  or (
                      path.startswith(".github/workflows/")
                      and PurePosixPath(path).suffix in {".yml", ".yaml"}
                  )
                  or (
                      path.startswith(".github/actions/")
                      and PurePosixPath(path).name in {"action.yml", "action.yaml"}
                  )
              )
          )
          if len(required) > 256:
              raise SystemExit("static lint checkout path set exceeds the bounded limit of 256")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  "required_paths_json="
                  + json.dumps(required, separators=(",", ":"))
                  + "\n"
              )
          PY
      - name: Verify checkout integrity
        uses: optimizr-tech/optimizr-actions/.github/actions/checkout-integrity@v1
        with:
          expected_sha: ${{ github.sha }}
          required_paths_json: ${{ steps.checkout_paths.outputs.required_paths_json }}
      - name: Run portable static lint
        uses: optimizr-tech/optimizr-actions/.github/actions/static-lint@v1
        with:
          shellcheck_severity: ${{ inputs.shellcheck_severity }}
          exclusions: ${{ inputs.exclusions }}
      - name: Checkout reusable evidence helper
        id: checkout_evidence
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-source
          persist-credentials: false
      - name: Write SHA-bound evidence bundle
        id: bundle
        if: ${{ always() && steps.checkout_evidence.outcome == 'success' }}
        uses: ./.optimizr-actions-source/.github/actions/security-evidence-bundle
        with:
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          producer_repository: ${{ job.workflow_repository }}
          producer_ref: ${{ job.workflow_ref }}
          producer_sha: ${{ job.workflow_sha }}
          producer_file: ${{ job.workflow_file_path }}
          source_sha: ${{ github.sha }}
          expected_source_sha: ${{ github.sha }}
          conclusion: ${{ job.status }}
          artifact_name: ${{ inputs.artifact_name }}
          evidence_directory: artifacts/static-lint
      - name: Upload lint evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/static-lint
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
