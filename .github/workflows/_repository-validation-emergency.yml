name: _repository-validation-emergency
on:
  workflow_call:
    inputs:
      environment_name:
        description: Protected environment requiring reviewer approval
        type: string
        required: true
      runner_json:
        description: JSON labels for the reviewed self-hosted runner
        type: string
        required: true
      candidate_sha:
        description: Exact trusted commit SHA to validate
        type: string
        required: true
      script_path:
        description: Repository-owned executable path
        type: string
        required: true
      args_json:
        description: JSON array of literal arguments
        type: string
        required: false
        default: "[]"
      timeout_seconds:
        description: Command timeout
        type: number
        required: false
        default: 900
      trusted_ref:
        description: Trusted full branch ref
        type: string
        required: false
        default: refs/heads/main
      artifact_name:
        description: Evidence artifact name
        type: string
        required: false
        default: repository-validation-emergency
      retention_days:
        description: Evidence retention period
        type: number
        required: false
        default: 30
    outputs:
      result:
        description: passed when the reviewed command completed successfully
        value: ${{ jobs.validation.outputs.result }}
      validated_sha:
        description: Exact reviewed consumer commit
        value: ${{ jobs.validation.outputs.validated_sha }}
      evidence_path:
        description: Repository-relative evidence path
        value: ${{ jobs.validation.outputs.evidence_path }}
permissions:
  contents: read
jobs:
  validation:
    name: Reviewed billing-emergency validation
    environment: ${{ inputs.environment_name }}
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 65
    outputs:
      result: ${{ steps.contract.outputs.result }}
      validated_sha: ${{ inputs.candidate_sha }}
      evidence_path: ${{ steps.contract.outputs.evidence_path }}
    steps:
      - name: Require self-hosted reviewed path
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if "self-hosted" not in labels:
              raise SystemExit("billing-emergency validation must use a trusted self-hosted runner")
          PY
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run reviewed repository contract
        id: contract
        uses: optimizr-tech/optimizr-actions/.github/actions/repository-validation@v1
        with:
          script_path: ${{ inputs.script_path }}
          args_json: ${{ inputs.args_json }}
          head_sha: ${{ inputs.candidate_sha }}
          timeout_seconds: ${{ inputs.timeout_seconds }}
          require_trusted_ref: true
          trusted_ref: ${{ inputs.trusted_ref }}
      - name: Upload reviewed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}-${{ inputs.candidate_sha }}
          path: artifacts/repository-validation
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
