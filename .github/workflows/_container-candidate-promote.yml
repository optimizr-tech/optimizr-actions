name: _container-candidate-promote

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON labels for the trusted promotion runner
        required: false
        type: string
        default: '["ubuntu-latest"]'
      image_repository:
        description: Exact GHCR image repository without a tag or digest
        required: true
        type: string
      candidate_digest:
        description: Immutable sha256 digest of the quarantined image
        required: true
        type: string
      candidate_sha:
        description: Source commit recorded in the candidate provenance
        required: true
        type: string
      security_exceptions_file:
        description: Optional reviewed exception policy path in the protected caller revision
        required: false
        type: string
        default: ""
      security_severity:
        description: Blocking Trivy severities
        required: false
        type: string
        default: HIGH,CRITICAL
      security_trivy_version:
        description: Controlled Trivy release used before promotion
        required: false
        type: string
        default: v0.74.0
      security_db_max_age_hours:
        description: Maximum accepted age of the Trivy vulnerability database
        required: false
        type: string
        default: "30"
      artifact_retention_days:
        description: Retention for scan evidence and the release manifest
        required: false
        type: number
        default: 30
    secrets:
      registry_username:
        description: GHCR username used to read the candidate and promote its digest
        required: true
      registry_password:
        description: GHCR token with access only to the target package
        required: true
    outputs:
      image_ref:
        description: Promoted image reference pinned to the verified immutable digest
        value: ${{ jobs.promote.outputs.image_ref }}
      manifest_artifact:
        description: Name of the uploaded verified release manifest
        value: ${{ jobs.promote.outputs.manifest_artifact }}
      manifest_json:
        description: Compact verified release manifest
        value: ${{ jobs.promote.outputs.manifest_json }}

jobs:
  promote:
    name: Revalidate and promote quarantined image
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.manifest.outputs.image_ref }}
      manifest_artifact: ${{ steps.manifest.outputs.manifest_artifact }}
      manifest_json: ${{ steps.manifest.outputs.manifest_json }}
    steps:
      - name: Validate protected caller and immutable candidate inputs
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUNNER_JSON: ${{ inputs.runner_json }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SECURITY_EXCEPTIONS_FILE: ${{ inputs.security_exceptions_file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import json
          import re
          from pathlib import PurePosixPath

          if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"}:
              raise SystemExit("candidate promotion requires a trusted push or workflow_dispatch")
          if not os.environ["REF"].startswith("refs/heads/") or os.environ["REF_PROTECTED"] != "true":
              raise SystemExit("candidate promotion requires a protected branch")
          try:
              runner_labels = json.loads(os.environ["RUNNER_JSON"])
          except json.JSONDecodeError as error:
              raise SystemExit("runner_json must be a JSON string array") from error
          if not isinstance(runner_labels, list) or not runner_labels or any(
              not isinstance(label, str) or not label for label in runner_labels
          ):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          if "self-hosted" in runner_labels:
              if "Linux" not in runner_labels:
                  raise SystemExit("candidate promotion requires a Linux self-hosted runner")
          elif runner_labels != ["ubuntu-latest"]:
              raise SystemExit("hosted candidate promotion must use [\"ubuntu-latest\"]")
          image = os.environ["IMAGE_REPOSITORY"]
          if not re.fullmatch(r"ghcr\.io(?:/[a-z0-9]+(?:[._-][a-z0-9]+)*)+", image):
              raise SystemExit("image_repository must be a lowercase GHCR repository path")
          if len(image.removeprefix("ghcr.io/").split("/")) < 2:
              raise SystemExit("image_repository must include an owner namespace and image name")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["CANDIDATE_DIGEST"]):
              raise SystemExit("candidate_digest must be a full immutable sha256 digest")
          if not re.fullmatch(r"[0-9a-f]{40,64}", os.environ["CANDIDATE_SHA"]):
              raise SystemExit("candidate_sha must be a full hexadecimal commit SHA")
          policy = os.environ["SECURITY_EXCEPTIONS_FILE"]
          if policy:
              path = PurePosixPath(policy)
              if path.is_absolute() or ".." in path.parts or "\n" in policy or "\r" in policy:
                  raise SystemExit("security_exceptions_file must be a safe repository-relative path")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_image={image}@{os.environ['CANDIDATE_DIGEST']}\n")
              output.write(f"release_tag={image}:{os.environ['CANDIDATE_SHA']}\n")
              output.write(f"source_tag={image}:sha-{os.environ['CANDIDATE_SHA']}\n")
          PY

      - name: Checkout protected caller policy and source metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: .candidate-source
          persist-credentials: false

      - name: Checkout exact reusable implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-source
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Verify quarantined candidate SBOM, provenance, and source commit
        id: attestations
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.validate.outputs.candidate_image }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          index_file="$RUNNER_TEMP/optimizr-candidate-index.json"
          sbom_file="$RUNNER_TEMP/optimizr-candidate-sbom.json"
          provenance_file="$RUNNER_TEMP/optimizr-candidate-provenance.json"
          docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE" > "$index_file"
          docker buildx imagetools inspect "$CANDIDATE_IMAGE" \
            --format '{{ json .SBOM.SPDX }}' > "$sbom_file"
          docker buildx imagetools inspect "$CANDIDATE_IMAGE" \
            --format '{{ json .Provenance.SLSA }}' > "$provenance_file"
          python3 .optimizr-actions-source/scripts/container_release/verify_attestations.py \
            --input "$index_file" \
            --sbom-input "$sbom_file" \
            --provenance-input "$provenance_file" \
            --expected-source-repository "$SOURCE_REPOSITORY" \
            --expected-source-sha "$CANDIDATE_SHA"

      - name: Pull exact quarantined digest for local scan
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.validate.outputs.candidate_image }}
        run: docker pull "$CANDIDATE_IMAGE" >/dev/null

      - name: Validate candidate exception scopes
        id: exceptions
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.validate.outputs.candidate_image }}
          SECURITY_EXCEPTIONS_FILE: ${{ inputs.security_exceptions_file }}
        run: |
          set -euo pipefail
          if [ -z "$SECURITY_EXCEPTIONS_FILE" ]; then
            echo "No candidate exceptions supplied; standard blocking policy applies."
            exit 0
          fi
          python3 .optimizr-actions-source/scripts/container_release/validate_candidate_exceptions.py \
            --policy ".candidate-source/$SECURITY_EXCEPTIONS_FILE" \
            --candidate-image "$CANDIDATE_IMAGE"

      - name: Scan exact quarantined digest with governed policy
        id: security
        continue-on-error: true
        uses: ./.optimizr-actions-source/.github/actions/security-gate
        with:
          scan_type: image
          image_refs: ${{ steps.validate.outputs.candidate_image }}
          docker_mode: direct
          severity: ${{ inputs.security_severity }}
          exceptions_file: ${{ inputs.security_exceptions_file != '' && format('.candidate-source/{0}', inputs.security_exceptions_file) || '' }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/candidate

      - name: Promote candidate digest to source SHA tags
        id: promote
        if: >-
          steps.attestations.outcome == 'success' &&
          steps.exceptions.outcome == 'success' &&
          steps.security.outcome == 'success' &&
          steps.security.outputs.result == 'passed'
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.validate.outputs.candidate_image }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          SOURCE_TAG: ${{ steps.validate.outputs.source_tag }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$RELEASE_TAG" \
            --tag "$SOURCE_TAG" \
            "$CANDIDATE_IMAGE"
          python3 .optimizr-actions-source/scripts/container_release/verify_published_digest.py \
            --image-ref "$RELEASE_TAG" --expected-digest "$CANDIDATE_DIGEST"
          python3 .optimizr-actions-source/scripts/container_release/verify_published_digest.py \
            --image-ref "$SOURCE_TAG" --expected-digest "$CANDIDATE_DIGEST"

      - name: Create verified immutable release manifest
        id: manifest
        if: >-
          steps.attestations.outcome == 'success' &&
          steps.exceptions.outcome == 'success' &&
          steps.security.outcome == 'success' &&
          steps.security.outputs.result == 'passed' &&
          steps.promote.outcome == 'success'
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REPOSITORY: ${{ github.repository }}
          SECURITY_RESULT: ${{ steps.security.outputs.result }}
          SECURITY_CLASSIFICATION: ${{ steps.security.outputs.classification }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          image_repository = os.environ["IMAGE_REPOSITORY"]
          digest = os.environ["CANDIDATE_DIGEST"]
          source_sha = os.environ["CANDIDATE_SHA"]
          image_path = image_repository.removeprefix("ghcr.io/")
          image = {
              "service": image_path.rsplit("/", 1)[-1],
              "image": f"{image_repository}@{digest}",
              "tag": f"{image_repository}:{source_sha}",
              "digest": digest,
              "published": True,
              "attestation_verified": True,
              "security_gate_outcome": "success",
              "security_result": os.environ["SECURITY_RESULT"],
              "security_classification": os.environ["SECURITY_CLASSIFICATION"],
          }
          manifest = {
              "schema_version": "1.0",
              "repository": os.environ["REPOSITORY"],
              "commit_sha": source_sha,
              "registry": "ghcr.io",
              "image_namespace": image_path.rsplit("/", 1)[0],
              "published": True,
              "images": [image],
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          compact = json.dumps(manifest, separators=(",", ":"), sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"image_ref={image['image']}\n")
              output.write(f"manifest_artifact=release-manifest-{source_sha}\n")
              output.write(f"manifest_json={compact}\n")
          PY

      - name: Upload candidate scan evidence
        if: always() && steps.security.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-security-${{ github.run_id }}
          path: artifacts/security-gate
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload verified release manifest
        if: steps.manifest.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-manifest-${{ inputs.candidate_sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Require every candidate promotion gate
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          ATTESTATION_OUTCOME: ${{ steps.attestations.outcome }}
          EXCEPTION_OUTCOME: ${{ steps.exceptions.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          SECURITY_RESULT: ${{ steps.security.outputs.result }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$VALIDATE_OUTCOME" "$ATTESTATION_OUTCOME" "$EXCEPTION_OUTCOME" "$SECURITY_OUTCOME" "$PROMOTE_OUTCOME" "$MANIFEST_OUTCOME"; do
            if [ "$outcome" != success ]; then
              echo "::error::candidate promotion stopped because a required gate did not succeed" >&2
              exit 1
            fi
          done
          if [ "$SECURITY_RESULT" != passed ]; then
            echo "::error::candidate promotion requires a passing exact-digest security scan" >&2
            exit 1
          fi
