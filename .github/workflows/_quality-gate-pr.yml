name: _quality-gate-pr

# Compare PR artifacts against main baseline and post idempotent comment.

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none or ephemeral-pr
        required: false
        type: string
        default: none
      preset:
        description: "Artifact layout preset: python-backend | monorepo-serve"
        required: true
        type: string
      workflow_file:
        description: Caller workflow filename for baseline lookup (e.g. ci.yml)
        required: false
        type: string
        default: ci.yml
      infra_ops_ref:
        description: Deprecated compatibility input; quality-gate code is owned by optimizr-actions
        required: false
        type: string
        default: v1
      fail_on_red:
        description: Fail job when comparator returns red (exit 2)
        required: false
        type: boolean
        default: true
      post_comment:
        description: Upsert PR comment via GitHub API
        required: false
        type: boolean
        default: true
    secrets:
      OPTIMIZR_INFRA_OPS_READ_TOKEN:
        description: Deprecated compatibility secret; no longer read
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  quality-gate-pr:
    name: Quality gate (PR)
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 10
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode != "ephemeral-pr":
              raise SystemExit("self-hosted quality PR comparison requires ephemeral-pr")
          if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
              raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          PY
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact quality-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-source
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Download PR run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
        continue-on-error: true

      - name: Find latest main baseline run
        id: baseline-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/.optimizr-actions-source
        run: |
          set -euo pipefail
          payload="$(python -m scripts.quality_gate.collect_ci_run latest-main --workflow "${{ inputs.workflow_file }}" || echo null)"
          if [ "$payload" = "null" ] || [ -z "$payload" ]; then
            echo "no main baseline yet -- comparator will report unknown"
            echo "run-id=" >> "$GITHUB_OUTPUT"
          else
            run_id="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')"
            echo "found main baseline run $run_id"
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download main baseline artifact
        if: steps.baseline-run.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/baseline
          gh run download "${{ steps.baseline-run.outputs.run-id }}" \
            -n quality-gate-baseline \
            -D artifacts/baseline \
            || echo "baseline artifact missing or expired -- treating as first run"

      - name: Compare and post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/.optimizr-actions-source
        run: |
          set -euo pipefail
          case "${{ inputs.preset }}" in
            python-backend|monorepo-serve) ;;
            *) echo "unsupported quality-gate preset" >&2; exit 2 ;;
          esac
          baseline_args=()
          if [ -f artifacts/baseline/quality-gate-baseline.json ]; then
            baseline_args+=(--baseline "artifacts/baseline/quality-gate-baseline.json")
          fi
          post_args=()
          if [ "${{ inputs.post_comment }}" = "true" ]; then
            post_args+=(--post --repo "${{ github.repository }}")
          fi
          set +e
          python -m scripts.quality_gate.run \
            --artifacts-dir artifacts \
            --head-sha "${GITHUB_SHA}" \
            pr \
            --pr "${{ github.event.pull_request.number }}" \
            "${baseline_args[@]}" \
            "${post_args[@]}"
          verdict_rc=$?
          set -e
          echo "quality-gate verdict exit code: $verdict_rc (0=green, 1=yellow, 2=red, 3=unknown)"
          if [ "${{ inputs.fail_on_red }}" != "true" ]; then
            exit 0
          fi
          case "$verdict_rc" in
            0|1|3) ;;
            2) echo "::error::quality-gate verdict is RED" >&2; exit 1 ;;
            *) echo "::error::quality-gate unexpected exit $verdict_rc" >&2; exit 1 ;;
          esac
