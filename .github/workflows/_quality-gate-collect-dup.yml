name: _quality-gate-collect-dup

# jscpd duplication scans per scope for quality-gate metrics.

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, or ephemeral-pr
        required: false
        type: string
        default: none
      scopes:
        description: "Comma-separated scopes: backend,frontend-storefront,frontend-admin"
        required: false
        type: string
        default: "backend"
      scope_paths:
        description: "Optional CSV paths aligned with scopes (defaults per scope name)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan duplication matrix
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(not isinstance(value, str) or not value for value in labels):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
                  raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          elif mode == "ephemeral-pr":
              if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
                  raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          else:
              raise SystemExit("self-hosted validation requires mode trusted-main or ephemeral-pr")
          PY
      - id: build
        run: |
          set -euo pipefail
          matrix_json="$(python3 -c "
          import json, os
          defaults = {
              'backend': 'app/',
              'frontend-storefront': 'frontend/apps/storefront/src/',
              'frontend-admin': 'frontend/apps/admin/src/',
          }
          scopes = [s.strip() for s in os.environ.get('SCOPES', '').split(',') if s.strip()]
          paths = [p.strip() for p in os.environ.get('PATHS', '').split(',') if p.strip()]
          include = []
          for i, scope in enumerate(scopes):
              path = paths[i] if i < len(paths) else defaults.get(scope, '.')
              include.append({'scope': scope, 'paths': path})
          if not include:
              include.append({'scope': 'backend', 'paths': 'app/'})
          print(json.dumps({'include': include}))
          ")"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"
        env:
          SCOPES: ${{ inputs.scopes }}
          PATHS: ${{ inputs.scope_paths }}

  collect-dup:
    name: Quality gate dup (${{ matrix.scope }})
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 15
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js before pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - name: Run jscpd
        run: |
          set -euo pipefail
          mkdir -p .qg-dup
          pnpm dlx jscpd@4 \
            --reporters json \
            --output .qg-dup \
            --gitignore \
            --silent \
            --threshold 100 \
            ${{ matrix.paths }}
          test -s .qg-dup/jscpd-report.json

      - name: Upload dup report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dup-${{ matrix.scope }}
          path: .qg-dup/jscpd-report.json
          retention-days: 7
          if-no-files-found: warn
