name: Validate package-less semantic-release reusable

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_semantic-release.yml"
      - ".github/workflows/semantic-release-package-less-canary.yml"
      - "scripts/release/**"
      - "tests/fixtures/package-less-release/**"
      - "tests/test_semantic_release_package_less.py"
      - "tests/test_semantic_release_runtime_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-less-release-canary-${{ github.ref }}
  cancel-in-progress: true

# The caller's token is read-only. The reusable's validation-only path skips
# release/badge publishing, omits the token from semantic-release, and uses a
# local main branch only so this package-less fixture can exercise its setup.
jobs:
  package-less:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Package-less fixture without Node manifests
    permissions:
      contents: read
    uses: ./.github/workflows/_semantic-release.yml
    with:
      package_mode: package-less
      working_directory: tests/fixtures/package-less-release
      runs_on: '["ubuntu-latest"]'
      releaserc_source: local
      validate_only: true
      tokenless_dry_run: true
      simulate_default_branch_for_dry_run: true
