name: _repository-validation
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        type: string
        required: false
        default: '["ubuntu-latest"]'
      script_path:
        description: Repository-owned executable path
        type: string
        required: true
      args_json:
        description: JSON array of literal arguments
        type: string
        required: false
        default: "[]"
      node_version:
        description: Optional controlled Node.js version for repository-owned scripts
        type: string
        required: false
        default: ""
      npm_version:
        description: Optional controlled npm version for repository-owned scripts
        type: string
        required: false
        default: ""
      pnpm_version:
        description: Optional controlled pnpm version for repository-owned scripts
        type: string
        required: false
        default: ""
      candidate_sha:
        description: Exact candidate SHA; defaults to caller SHA
        type: string
        required: false
        default: ""
      base_sha:
        description: Optional base SHA for evidence
        type: string
        required: false
        default: ""
      image_refs_json:
        description: Optional JSON array of local image references for immutable evidence
        type: string
        required: false
        default: "[]"
      timeout_seconds:
        description: Command timeout
        type: number
        required: false
        default: 900
      require_trusted_ref:
        description: Require candidate reachable from trusted_ref
        type: boolean
        required: false
        default: true
      allow_ephemeral_pr:
        description: Allow untrusted-ref validation only on an isolated ephemeral pull-request runner
        type: boolean
        required: false
        default: false
      trusted_ref:
        description: Trusted full branch ref
        type: string
        required: false
        default: refs/heads/main
      artifact_name:
        description: Evidence artifact name
        type: string
        required: false
        default: repository-validation-evidence
      retention_days:
        description: Evidence retention period
        type: number
        required: false
        default: 30
    outputs:
      result:
        description: passed when the repository-owned command completed successfully
        value: ${{ jobs.validation.outputs.result }}
      validated_sha:
        description: Exact consumer commit evaluated by the validation command
        value: ${{ jobs.validation.outputs.validated_sha }}
      evidence_path:
        description: Repository-relative path uploaded as validation evidence
        value: ${{ jobs.validation.outputs.evidence_path }}
permissions:
  contents: read
jobs:
  validation:
    name: Repository validation
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 65
    outputs:
      result: ${{ steps.contract.outputs.result }}
      validated_sha: ${{ inputs.candidate_sha || github.sha }}
      evidence_path: ${{ steps.contract.outputs.evidence_path }}
    steps:
      - name: Reject unsafe persistent-runner override
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          REQUIRE_TRUSTED: ${{ inputs.require_trusted_ref }}
          ALLOW_EPHEMERAL_PR: ${{ inputs.allow_ephemeral_pr }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os

          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(
              not isinstance(value, str) or not value for value in labels
          ):
              raise SystemExit("runner_json must be a non-empty JSON string array")

          self_hosted = "self-hosted" in labels
          require_trusted = os.environ["REQUIRE_TRUSTED"] == "true"
          allow_ephemeral = os.environ["ALLOW_EPHEMERAL_PR"] == "true"

          if not self_hosted:
              if allow_ephemeral:
                  raise SystemExit(
                      "ephemeral self-hosted repository validation requires self-hosted labels"
                  )
              raise SystemExit(0)

          if "Linux" not in labels:
              raise SystemExit("self-hosted repository validation requires the Linux label")

          if require_trusted:
              if allow_ephemeral:
                  raise SystemExit(
                      "trusted-ref validation and ephemeral PR validation are mutually exclusive"
                  )
              raise SystemExit(0)

          if not allow_ephemeral:
              raise SystemExit(
                  "self-hosted repository validation must require a trusted ref or an ephemeral PR override"
              )
          if (
              os.environ["EVENT_NAME"] != "pull_request"
              or "ephemeral" not in labels
          ):
              raise SystemExit(
                  "ephemeral self-hosted repository validation requires pull_request and an ephemeral runner label"
              )
          PY
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate requested Node toolchain
        if: inputs.node_version != '' || inputs.npm_version != '' || inputs.pnpm_version != ''
        shell: bash
        env:
          NODE_VERSION: ${{ inputs.node_version }}
          NPM_VERSION: ${{ inputs.npm_version }}
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        run: |
          set -euo pipefail
          if [[ -z "$NODE_VERSION" && ( -n "$NPM_VERSION" || -n "$PNPM_VERSION" ) ]]; then
            echo "::error::node_version is required when npm_version or pnpm_version is set"
            exit 2
          fi
          case "$NPM_VERSION" in
            ""|*[!0-9A-Za-z._+-]*)
              echo "::error::npm_version contains unsupported characters"
              exit 2
              ;;
          esac
      - name: Setup Node.js for repository contract
        if: inputs.node_version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      - name: Setup npm for repository contract
        if: inputs.npm_version != ''
        shell: bash
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "npm@${NPM_VERSION}"
          node --version
          npm --version
      - name: Setup pnpm for repository contract
        if: inputs.pnpm_version != ''
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ inputs.pnpm_version }}
      - name: Run repository contract
        id: contract
        uses: optimizr-tech/optimizr-actions/.github/actions/repository-validation@v1
        with:
          script_path: ${{ inputs.script_path }}
          args_json: ${{ inputs.args_json }}
          head_sha: ${{ inputs.candidate_sha || github.sha }}
          base_sha: ${{ inputs.base_sha }}
          timeout_seconds: ${{ inputs.timeout_seconds }}
          image_refs_json: ${{ inputs.image_refs_json }}
          require_trusted_ref: ${{ inputs.require_trusted_ref }}
          trusted_ref: ${{ inputs.trusted_ref }}
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/repository-validation
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
