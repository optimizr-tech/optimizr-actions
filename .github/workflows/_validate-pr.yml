name: _validate-pr

# Explicit metadata inputs override the caller pull_request event when provided.

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels; self-hosted PR validation must be ephemeral
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none or ephemeral-pr
        required: false
        type: string
        default: none
      run_self_tests:
        description: "Run validator regression tests"
        required: false
        type: boolean
        default: true
      pr_title:
        description: "PR title (caller: github.event.pull_request.title)"
        required: false
        type: string
        default: ""
      pr_body:
        description: "PR body (caller: github.event.pull_request.body)"
        required: false
        type: string
        default: ""
      base_sha:
        description: "PR base SHA (caller: github.event.pull_request.base.sha)"
        required: false
        type: string
        default: ""
      head_sha:
        description: "PR head SHA (caller: github.event.pull_request.head.sha)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: PR title + commits
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 5
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          ALLOW_TRUSTED_MAIN: "false"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(not isinstance(v, str) or not v for v in labels):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if os.environ["ALLOW_TRUSTED_MAIN"] != "true":
                  raise SystemExit("trusted-main is not allowed for this workflow")
              if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
                  raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          elif mode == "ephemeral-pr":
              if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
                  raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          else:
              raise SystemExit("self-hosted validation requires mode ephemeral-pr")
          PY

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test validators
        if: inputs.run_self_tests
        run: |
          bash scripts/git-hooks/test_validate_subject.sh
          bash scripts/git-hooks/test_validate_commit_subject.sh
          bash scripts/git-hooks/test_validate_pr_body.sh

      - name: Validate PR title
        env:
          INPUT_PR_TITLE: ${{ inputs.pr_title }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          VALIDATE_SUBJECT_LABEL: PR title
        run: |
          PR_TITLE="${INPUT_PR_TITLE:-$EVENT_PR_TITLE}"
          if [ -z "$PR_TITLE" ]; then
            echo "Unable to resolve pull request title"
            exit 1
          fi
          bash scripts/git-hooks/validate-subject.sh "$PR_TITLE"

      - name: Validate PR body
        env:
          INPUT_PR_BODY: ${{ inputs.pr_body }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
          VALIDATE_PR_BODY_LABEL: PR body
        run: |
          PR_BODY="${INPUT_PR_BODY:-$EVENT_PR_BODY}"
          export PR_BODY
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["BODY_FILE"]).write_text(os.environ.get("PR_BODY") or "", encoding="utf-8")'
          bash scripts/git-hooks/validate-pr-body.sh "$BODY_FILE"

      - name: Validate PR commit subjects
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA="${INPUT_BASE_SHA:-$EVENT_BASE_SHA}"
          HEAD_SHA="${INPUT_HEAD_SHA:-$EVENT_HEAD_SHA}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Unable to resolve pull request base/head SHAs"
            exit 1
          fi
          bash scripts/git-hooks/validate-pr-commits.sh "$BASE_SHA" "$HEAD_SHA"
