name: Apply PR108 integration patch

on:
  push:
    branches:
      - codex/issue-106-remediation-window-evaluator
    paths:
      - ".github/workflows/_apply-pr108-integration.yml"
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/_apply-pr108-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    # Temporary same-repository PR workflow; removed immediately after the validated patch commit.
    if: >-
      github.actor == 'thalesfb' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'codex/issue-106-remediation-window-evaluator'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/issue-106-remediation-window-evaluator
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate bounded patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/maintenance/pr108_patch.b64.part* > /tmp/pr108_patch.b64
          sha256sum /tmp/pr108_patch.b64
          patch_script="$GITHUB_WORKSPACE/scripts/maintenance/_pr108_patch.py"
          base64 --decode /tmp/pr108_patch.b64 > "$patch_script"
          printf '%s  %s\n' \
            '1a1c3e0e35ee977faca3195e3db635bd37fda6af542fa91deeba313d4bcc9464' \
            "$patch_script" | sha256sum --check --strict
          python3 - "$patch_script" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          old = '''    stale_final_outputs = \'\'\'        echo "remediation_window_allowed=$remediation_window_allowed"\\n        echo "remediation_state=$remediation_state"\\n        echo "remediation_window_decision=$remediation_window_decision"\\n        echo "remediation_window_classification=$remediation_window_classification"\\n        echo "remediation_window_count=$remediation_window_count"\\n        echo "nearest_deadline=$remediation_window_nearest_deadline"\\n        echo "policy_digest=$remediation_window_policy_digest"\\n        echo "evaluator_version=$remediation_window_evaluator_version"\\n        echo "remediation_window_failure_reason=$remediation_window_failure_reason"\\n\'\'\'\n'''
          new = '''    stale_final_outputs = \'\'\'        echo "remediation_window_allowed=$remediation_window_allowed" >> "$GITHUB_OUTPUT"\\n        echo "remediation_state=$remediation_state" >> "$GITHUB_OUTPUT"\\n        echo "remediation_window_decision=$remediation_window_decision" >> "$GITHUB_OUTPUT"\\n        echo "remediation_window_classification=$remediation_window_classification" >> "$GITHUB_OUTPUT"\\n        echo "remediation_window_count=$remediation_window_count" >> "$GITHUB_OUTPUT"\\n        echo "nearest_deadline=$remediation_window_nearest_deadline" >> "$GITHUB_OUTPUT"\\n        echo "policy_digest=$remediation_window_policy_digest" >> "$GITHUB_OUTPUT"\\n        echo "evaluator_version=$remediation_window_evaluator_version" >> "$GITHUB_OUTPUT"\\n        echo "remediation_window_failure_reason=$remediation_window_failure_reason" >> "$GITHUB_OUTPUT"\\n\'\'\'\n'''
          if content.count(old) != 1:
              raise SystemExit(f"expected one stale-output matcher, found {content.count(old)}")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          printf '%s  %s\n' \
            '144df27d6ae21888c05596b3d7fadeea6b89370ba09fe926416c70350597e015' \
            "$patch_script" | sha256sum --check --strict
          python3 -m py_compile "$patch_script"
          python3 "$patch_script"
          rm -f "$patch_script"

      - name: Validate changed contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_security_gate_remediation_window.py \
            tests/test_remediation_window_workflow_contract.py -v
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              ".github/actions/security-gate/action.yml",
              ".github/actions/record-deploy-manifest/action.yml",
              ".github/workflows/_security-gate.yml",
              ".github/workflows/_vps-self-hosted-deploy.yml",
              ".github/workflows/_vps-monorepo-deploy.yml",
          ):
              yaml.safe_load(Path(path).read_text(encoding="utf-8"))
          PY
          python3 -m py_compile \
            scripts/security_gate/remediation_window.py \
            scripts/deploy_manifest/remediation.py
          git diff --check

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/actions/security-gate/action.yml \
            .github/actions/record-deploy-manifest/action.yml \
            .github/workflows/_security-gate.yml \
            .github/workflows/_vps-self-hosted-deploy.yml \
            .github/workflows/_vps-monorepo-deploy.yml \
            scripts/security_gate/remediation_window.py \
            tests/test_security_gate_contract.py \
            tests/test_security_gate_remediation_window.py \
            tests/test_remediation_window_workflow_contract.py
          if git diff --cached --quiet; then
            echo 'No integration changes were produced.'
            exit 0
          fi
          git commit -m 'fix(security): enforce complete remediation window coverage'
          git push origin HEAD:codex/issue-106-remediation-window-evaluator
