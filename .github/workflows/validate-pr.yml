name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portable action contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Show Python version
        run: python3 --version

      - name: Verify repository boundary
        run: python3 -m unittest tests.test_repository_boundary -v

      - name: Verify deploy manifest writer
        run: python3 -m unittest tests.test_deploy_manifest_writer -v

      - name: Verify deploy manifest action
        run: python3 -m unittest tests.test_deploy_manifest_action -v

      - name: Verify PR validation policy
        run: python3 -m unittest tests.test_pr_validation_workflow -v

      - name: Run full Python contract suite
        id: full-suite
        continue-on-error: true
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/optimizr-unittest.log"
          python3 -m unittest discover >"$test_log" 2>&1
          tail -n 8 "$test_log"
          python3 -m compileall -q scripts tests

      - name: Upload failed suite diagnostics
        if: steps.full-suite.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/optimizr-unittest.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce full suite result
        if: steps.full-suite.outcome == 'failure'
        run: exit 1

      - name: Check candidate diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD

      - name: Run actionlint
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Validate composite action metadata
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            mikefarah/yq@sha256:76def1f56f456ecc1c3173ea275218ee17139bc2018c5a07887b15afd88ec03e \
            eval 'true' .github/actions/*/action.yml

  apply-pr108-integration:
    name: Apply validated PR108 integration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 108 &&
      github.actor == 'thalesfb' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/issue-106-remediation-window-evaluator'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/issue-106-remediation-window-evaluator
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Reconstruct and validate bounded patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/maintenance/pr108_patch.b64.part* > /tmp/pr108_patch.b64
          printf '%s  %s\n' \
            '992aeedc1bf7367f98f79ba0f8974b433ecf5163f7f54302e1689146866d77fe' \
            '/tmp/pr108_patch.b64' | sha256sum --check --strict
          base64 --decode /tmp/pr108_patch.b64 > /tmp/pr108_patch.py
          printf '%s  %s\n' \
            '1a1c3e0e35ee977faca3195e3db635bd37fda6af542fa91deeba313d4bcc9464' \
            '/tmp/pr108_patch.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/pr108_patch.py
          python3 /tmp/pr108_patch.py

      - name: Validate changed contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/test_security_gate_remediation_window.py \
            tests/test_remediation_window_workflow_contract.py -v
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              ".github/actions/security-gate/action.yml",
              ".github/actions/record-deploy-manifest/action.yml",
              ".github/workflows/_security-gate.yml",
              ".github/workflows/_vps-self-hosted-deploy.yml",
              ".github/workflows/_vps-monorepo-deploy.yml",
          ):
              yaml.safe_load(Path(path).read_text(encoding="utf-8"))
          PY
          python3 -m py_compile \
            scripts/security_gate/remediation_window.py \
            scripts/deploy_manifest/remediation.py
          git diff --check

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/actions/security-gate/action.yml \
            .github/actions/record-deploy-manifest/action.yml \
            .github/workflows/_security-gate.yml \
            .github/workflows/_vps-self-hosted-deploy.yml \
            .github/workflows/_vps-monorepo-deploy.yml \
            scripts/security_gate/remediation_window.py \
            tests/test_security_gate_contract.py \
            tests/test_security_gate_remediation_window.py \
            tests/test_remediation_window_workflow_contract.py
          if git diff --cached --quiet; then
            echo 'No integration changes were produced.'
            exit 0
          fi
          git commit -m 'fix(security): enforce complete remediation window coverage'
          git push origin HEAD:codex/issue-106-remediation-window-evaluator
