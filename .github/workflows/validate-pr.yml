name: Validate pull request

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# PRs stay metadata-only. Validate candidate code locally before merge; the
# trusted-main move-v1 workflow runs the full suite before publishing v1.
jobs:
  # Metadata validation runs on the restricted owner runner group
  # (local-docker-owner). The published contract stays API-only: read-only
  # token, no candidate checkout, and it re-validates the self-hosted trust
  # contract before doing any work.
  validate:
    name: Validate PR metadata
    uses: optimizr-tech/optimizr-actions/.github/workflows/_pr-metadata.yml@v1
    with:
      runner_json: '["self-hosted","Linux","local-docker"]'
      self_hosted_mode: metadata-pr
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body || '' }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
