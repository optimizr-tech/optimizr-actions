name: Validate pull request

on:
  # Metadata-only validation must come from the trusted base branch. A
  # pull_request workflow is controlled by the candidate and can be changed
  # to execute arbitrary code on the persistent self-hosted runner.
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# PRs stay metadata-only. pull_request_target loads this caller from trusted
# main; the reusable workflow reads PR metadata through the API and never
# checks out or executes candidate code. Validate candidate code locally before
# merge; move-v1 validates trusted main before publishing v1.
jobs:
  # Metadata validation runs on the restricted owner runner group
  # (local-docker-owner). The published contract stays API-only: read-only
  # token, no candidate checkout, and it re-validates the self-hosted trust
  # contract before doing any work.
  validate:
    name: Validate PR metadata
    uses: optimizr-tech/optimizr-actions/.github/workflows/_pr-metadata.yml@v1
    with:
      runner_json: '["self-hosted","Linux","local-docker"]'
      self_hosted_mode: metadata-pr
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body || '' }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
