# Reusable deployment for one Compose stack on a trusted VPS runner.
name: _vps-self-hosted-deploy

concurrency:
  group: deploy-${{ inputs.service_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      service_name:
        description: Repository/deploy directory name under /opt/optimizr
        required: true
        type: string
      homologation_environment:
        description: Use the protected homologation Environment instead of production
        required: false
        type: boolean
        default: false
      container_name:
        description: Primary Docker container used for health verification
        required: true
        type: string
      runner_label:
        description: Short trusted self-hosted runner label
        required: true
        type: string
      compose_file:
        description: Compose file relative to the deployment directory
        required: false
        type: string
        default: docker-compose.yml
      deployment_mode:
        description: build keeps legacy VPS builds; prebuilt-images pulls immutable registry images
        required: false
        type: string
        default: build
      registry:
        description: OCI registry hostname used by prebuilt-images when credentials are supplied
        required: false
        type: string
        default: ghcr.io
      prebuilt_images_json:
        description: JSON array of service/image digest pairs for prebuilt-images
        required: false
        type: string
        default: ""
      prebuilt_compose_file:
        description: Generated Compose override filename used for immutable image references
        required: false
        type: string
        default: .optimizr-prebuilt-images.yml
      pre_deploy_validation:
        description: Run nginx -t before rollout
        required: false
        type: boolean
        default: false
      build_image:
        description: Build Compose images before rollout
        required: false
        type: boolean
        default: true
      build_no_cache:
        description: Build without cache when build_image is enabled (explicit rebuild)
        required: false
        type: boolean
        default: false
      recreate_services:
        description: Whitespace-separated Compose services to recreate after file synchronization
        required: false
        type: string
        default: ""
      health_timeout:
        description: Seconds to wait for the primary container to become healthy
        required: false
        type: number
        default: 120
      deploy_timeout_minutes:
        description: Maximum deployment job duration; allowed range is 30-120 minutes
        required: false
        type: number
        default: 30
      ensure_networks:
        description: Whitespace-separated Docker networks to ensure
        required: false
        type: string
        default: optimizr_infra
      ensure_volumes:
        description: Whitespace-separated Docker volumes that must already exist
        required: false
        type: string
        default: ""
      create_missing_volumes:
        description: Explicitly allow creating missing empty Docker volumes; keep false for production data volumes
        required: false
        type: boolean
        default: false
      run_prune:
        description: Run Docker and runner cleanup after deployment
        required: false
        type: boolean
        default: true
      image_age_threshold:
        description: Docker age filter used by image prune
        required: false
        type: string
        default: 24h
      security_require_image_scan:
        description: Require scanning built Compose images before rollout
        required: false
        type: boolean
        default: true
      docker_mode:
        description: Local Docker access mode for deployment, security gate, and manifest
        required: false
        type: string
        default: sudo
      security_severity:
        description: Blocking Trivy severities
        required: false
        type: string
        default: HIGH,CRITICAL
      security_ignore_unfixed:
        description: Deprecated compatibility input for unfixed vulnerabilities
        required: false
        type: boolean
        default: false
      security_exceptions_file:
        description: Reviewed expiring security exceptions JSON
        required: false
        type: string
        default: ""
      security_baseline_file:
        description: Reviewed expiring vulnerability baseline for immutable image IDs
        required: false
        type: string
        default: ""
      security_trivy_version:
        description: Controlled Trivy release
        required: false
        type: string
        default: v0.70.0
      security_db_max_age_hours:
        description: Maximum accepted vulnerability database age
        required: false
        type: number
        default: 30
      security_remediation_window_enabled:
        description: Enable governed remediation-window evaluation
        required: false
        type: boolean
        default: false
      security_remediation_window_policy_file:
        description: Repository-relative remediation-window policy JSON
        required: false
        type: string
        default: ""
      security_remediation_window_service_scope:
        description: Declared service scope for remediation-window evaluation
        required: false
        type: string
        default: ""
      security_remediation_window_exposure_criticality:
        description: Declared exposure/criticality for remediation-window evaluation
        required: false
        type: string
        default: ""
      security_rebuild_retry_enabled:
        description: Retry actionable image vulnerabilities with one pull and rebuild
        required: false
        type: boolean
        default: true
      security_rebuild_retry_no_cache:
        description: Disable cache during the bounded security rebuild
        required: false
        type: boolean
        default: true
      security_rebuild_services:
        description: Whitespace-separated required Compose services for the security rebuild; empty rebuilds all buildable services
        required: false
        type: string
        default: ""
      deploy_manifest_enabled:
        description: Record sanitized immutable success/failure manifests
        required: false
        type: boolean
        default: false
      deploy_manifest_retention:
        description: Immutable deploy manifests retained on the VPS
        required: false
        type: number
        default: 50
      deploy_manifest_migration_result:
        description: passed, failed, skipped or not-reported
        required: false
        type: string
        default: not-reported
      deploy_snapshot_enabled:
        description: Create a secret-free deploy snapshot before synchronization
        required: false
        type: boolean
        default: true
      deploy_snapshot_retention_count:
        description: Maximum deploy snapshots retained per service
        required: false
        type: number
        default: 10
      deploy_snapshot_retention_days:
        description: Maximum age in days for deploy snapshots
        required: false
        type: number
        default: 30
      deploy_snapshot_max_total_bytes:
        description: Maximum total bytes retained across deploy snapshots
        required: false
        type: number
        default: 2147483648
    secrets:
      registry_username:
        description: Optional read-only registry username used only by prebuilt-images
        required: false
      registry_password:
        description: Optional read-only registry token used only by prebuilt-images
        required: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - ${{ inputs.runner_label }}
    timeout-minutes: ${{ inputs.deploy_timeout_minutes }}
    environment:
      name: ${{ inputs.homologation_environment && 'homologation' || 'production' }}
    env:
      DEPLOY_PATH: /opt/optimizr/${{ inputs.service_name }}
      CONTAINER_NAME: ${{ inputs.container_name }}
      COMPOSE_FILE: ${{ inputs.compose_file }}
      HEALTH_TIMEOUT: ${{ inputs.health_timeout }}
      DEPLOY_TIMEOUT_MINUTES: ${{ inputs.deploy_timeout_minutes }}
      RECREATE_SERVICES: ${{ inputs.recreate_services }}
      DOCKER_MODE: ${{ inputs.docker_mode }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      REGISTRY: ${{ inputs.registry }}
      PREBUILT_COMPOSE_FILE: ${{ inputs.prebuilt_compose_file }}

    steps:
      - name: Validate effective deployment timeout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] || (( DEPLOY_TIMEOUT_MINUTES < 30 || DEPLOY_TIMEOUT_MINUTES > 120 )); then
            echo "::error::deploy_timeout_minutes allowed range is 30-120 minutes" >&2
            exit 2
          fi
          echo "::notice title=Effective deployment timeout::Effective deployment timeout: ${DEPLOY_TIMEOUT_MINUTES} minutes (allowed range is 30-120 minutes)."

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Docker access mode
        shell: bash
        run: |
          set -euo pipefail
          case "$DOCKER_MODE" in
            direct|sudo|auto) ;;
            *)
              echo "::error::Unsupported docker_mode: $DOCKER_MODE (expected direct, sudo, or auto)" >&2
              exit 2
              ;;
          esac
          docker_mode_file="$RUNNER_TEMP/optimizr-docker-mode.sh"
          cat > "$docker_mode_file" <<'EOF'
          docker_cmd() {
            case "${DOCKER_MODE:-sudo}" in
              direct) command docker "$@" ;;
              sudo|auto) command sudo docker "$@" ;;
              *)
                echo "Unsupported docker_mode: ${DOCKER_MODE:-}" >&2
                return 2
                ;;
            esac
          }
          compose_cmd() {
            local compose_args=(-f "$COMPOSE_FILE")
            if [ "${DEPLOYMENT_MODE:-build}" = prebuilt-images ]; then
              compose_args+=(-f "$PREBUILT_COMPOSE_FILE")
            fi
            docker_cmd compose "${compose_args[@]}" "$@"
          }
          EOF
          chmod 700 "$docker_mode_file"
          echo "BASH_ENV=$docker_mode_file" >> "$GITHUB_ENV"

      - name: Validate deployment mode
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            build|prebuilt-images) ;;
            *)
              echo "::error::Unsupported deployment_mode: $DEPLOYMENT_MODE (expected build or prebuilt-images)" >&2
              exit 2
              ;;
          esac

      - name: Prepare immutable registry images
        if: inputs.deployment_mode == 'prebuilt-images'
        shell: bash
        env:
          PREBUILT_IMAGES_JSON: ${{ inputs.prebuilt_images_json }}
          PREBUILT_TSV: ${{ runner.temp }}/optimizr-prebuilt-images.tsv
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        run: |
          set -euo pipefail
          [ -n "$PREBUILT_IMAGES_JSON" ] || {
            echo "::error::prebuilt-images mode requires prebuilt_images_json" >&2
            exit 2
          }
          if [ -n "$REGISTRY_USERNAME" ] || [ -n "$REGISTRY_PASSWORD" ]; then
            [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ] || {
              echo "::error::registry credentials must be supplied together" >&2
              exit 2
            }
            docker_cmd login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin <<< "$REGISTRY_PASSWORD"
          else
            echo "Using anonymous pulls for public prebuilt images"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          deploy_path = Path(os.environ["DEPLOY_PATH"]).resolve()
          relative = os.environ["PREBUILT_COMPOSE_FILE"]
          candidate = Path(relative)
          if not relative or candidate.is_absolute() or ".." in candidate.parts or "\\" in relative:
              raise SystemExit("prebuilt_compose_file must remain below the deployment directory")
          override = (deploy_path / candidate).resolve()
          if deploy_path not in override.parents:
              raise SystemExit("prebuilt_compose_file escaped the deployment directory")

          items = json.loads(os.environ["PREBUILT_IMAGES_JSON"])
          if not isinstance(items, list) or not items:
              raise SystemExit("prebuilt_images_json must be a non-empty JSON array")
          services = []
          names = set()
          for item in items:
              if not isinstance(item, dict):
                  raise SystemExit("prebuilt image entries must be objects")
              service = item.get("service")
              image = item.get("image")
              if not isinstance(service, str) or not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,62}", service):
                  raise SystemExit("prebuilt image service is invalid")
              if service in names:
                  raise SystemExit(f"duplicate prebuilt image service: {service}")
              if not isinstance(image, str) or not re.fullmatch(r"[A-Za-z0-9./:_-]+@sha256:[0-9a-f]{64}", image):
                  raise SystemExit("Refusing to deploy an image without an immutable digest")
              names.add(service)
              services.append((service, image))

          lines = ["services:"]
          for service, image in services:
              lines.extend([f"  {service}:", f"    image: {json.dumps(image)}"])
          override.parent.mkdir(parents=True, exist_ok=True)
          override.write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path(os.environ["PREBUILT_TSV"]).write_text(
              "".join(f"{service}\t{image}\n" for service, image in services),
              encoding="utf-8",
          )
          PY

          while IFS=$'\t' read -r service image_ref; do
            [ -n "$service" ] && [ -n "$image_ref" ] || continue
            docker_cmd pull "$image_ref" >/dev/null
            actual_repo_digest="$(docker_cmd image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_ref" 2>/dev/null | grep -Fx "$image_ref" || true)"
            [ "$actual_repo_digest" = "$image_ref" ] || {
              echo "::error::Pulled image digest does not match requested digest for $service" >&2
              exit 1
            }
          done < "$PREBUILT_TSV"

      - name: Security gate (filesystem)
        id: security-filesystem-gate
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: fs
          scan_ref: .
          severity: ${{ inputs.security_severity }}
          ignore_unfixed: ${{ inputs.security_ignore_unfixed }}
          exceptions_file: ${{ inputs.security_exceptions_file }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/filesystem


      - name: Require filesystem security result
        if: always() && steps.security-filesystem-gate.outcome != 'skipped'
        shell: bash
        env:
          FILESYSTEM_OUTCOME: ${{ steps.security-filesystem-gate.outcome }}
          SECURITY_CLASSIFICATION: ${{ steps.security-filesystem-gate.outputs.classification }}
          FIXABLE_COUNT: ${{ steps.security-filesystem-gate.outputs.fixable_vulnerability_count }}
          UNFIXED_COUNT: ${{ steps.security-filesystem-gate.outputs.unfixed_vulnerability_count }}
          MISCONFIGURATION_COUNT: ${{ steps.security-filesystem-gate.outputs.misconfiguration_count }}
          SECRET_COUNT: ${{ steps.security-filesystem-gate.outputs.secret_count }}
        run: |
          set -euo pipefail
          classification="${SECURITY_CLASSIFICATION:-gate_error}"
          fixable="${FIXABLE_COUNT:-0}"
          unfixed="${UNFIXED_COUNT:-0}"
          misconfigurations="${MISCONFIGURATION_COUNT:-0}"
          secrets="${SECRET_COUNT:-0}"
          if [ "$FILESYSTEM_OUTCOME" = success ] && {
            [ "$classification" = clean ] || [ "$classification" = unfixed_warning ];
          }; then
            echo "Filesystem security gate passed: classification=$classification fixable=$fixable unfixed=$unfixed."
          else
            echo "::error::Filesystem security gate blocked deployment: classification=$classification fixable=$fixable unfixed=$unfixed misconfigurations=$misconfigurations secrets=$secrets" >&2
            exit 1
          fi

      - name: Backup and synchronize files
        id: deploy-snapshot
        shell: bash
        env:
          SNAPSHOT_ENABLED: ${{ inputs.deploy_snapshot_enabled }}
          SNAPSHOT_RETENTION_COUNT: ${{ inputs.deploy_snapshot_retention_count }}
          SNAPSHOT_RETENTION_DAYS: ${{ inputs.deploy_snapshot_retention_days }}
          SNAPSHOT_MAX_TOTAL_BYTES: ${{ inputs.deploy_snapshot_max_total_bytes }}
        run: |
          set -euo pipefail
          BACKUP_ROOT="/opt/optimizr/backups/${{ inputs.service_name }}/deploys"
          if [ "$DOCKER_MODE" = direct ]; then
            mkdir -p "$DEPLOY_PATH" "$BACKUP_ROOT"
          else
            sudo mkdir -p "$DEPLOY_PATH" "$BACKUP_ROOT"
            sudo chown "$(id -un):$(id -gn)" "$DEPLOY_PATH" "$BACKUP_ROOT"
            while IFS= read -r -d '' path; do
              sudo chown -R "$(id -un):$(id -gn)" "$path"
            done < <(
              find "$DEPLOY_PATH" \
                -mindepth 1 \
                -maxdepth 1 \
                -not -name '.secrets' -print0
            )
          fi
          if [ "$DOCKER_MODE" = direct ]; then
            chmod 750 "$BACKUP_ROOT"
          else
            sudo chmod 750 "$BACKUP_ROOT"
          fi

          rsync_args=(
            -a --delete
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude='*.tar.gz'
            --exclude=backup/
          )
          if [ "$DEPLOYMENT_MODE" = prebuilt-images ]; then
            rsync_args+=(--exclude="$PREBUILT_COMPOSE_FILE")
          fi
          if [ -f "$GITHUB_WORKSPACE/.deployignore" ]; then
            rsync_args+=(--exclude-from="$GITHUB_WORKSPACE/.deployignore")
          fi
          dry_run_output="$(mktemp)"
          if ! rsync "${rsync_args[@]}" --dry-run --itemize-changes --out-format='%i' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_PATH/" >"$dry_run_output"; then
            rm -f "$dry_run_output"
            echo "::error::Deploy dry-run failed" >&2
            exit 1
          fi

          snapshot_created=false
          if [ -s "$dry_run_output" ]; then
            if [ "$SNAPSHOT_ENABLED" = true ]; then
              backup_file="${BACKUP_ROOT}/$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
              if (
                umask 077
                tar \
                  --exclude='.env' --exclude='*/.env' \
                  --exclude='.env.*' --exclude='*/.env.*' \
                  --exclude='.secrets' --exclude='*/.secrets' \
                  --exclude='.secrets/*' --exclude='*/.secrets/*' \
                  --exclude='*.pem' --exclude='*.key' \
                  --exclude='*.p12' --exclude='*.pfx' \
                  -czf "$backup_file" -C "$DEPLOY_PATH" . 2>/dev/null
              ); then
                chmod 600 "$backup_file"
                snapshot_created=true
                echo "Secret-free configuration snapshot created"
              else
                rm -f "$backup_file"
                echo "::warning::Configuration snapshot failed; deployment continues"
              fi
            else
              echo "Secret-free configuration snapshot disabled"
            fi
          else
            echo "No deployable changes detected; skipping snapshot"
          fi
          rm -f "$dry_run_output"

          rsync "${rsync_args[@]}" "$GITHUB_WORKSPACE/" "$DEPLOY_PATH/"
          find "$DEPLOY_PATH" -name '*.sh' -exec chmod +x {} \;
          echo "snapshot_created=$snapshot_created" >> "$GITHUB_OUTPUT"

      - name: Prune deploy snapshots
        if: success() && steps.deploy-snapshot.outputs.snapshot_created == 'true'
        uses: optimizr-tech/optimizr-actions/.github/actions/deploy-snapshot-retention@v1
        with:
          root: /opt/optimizr/backups/${{ inputs.service_name }}/deploys
          max_count: ${{ inputs.deploy_snapshot_retention_count }}
          max_age_days: ${{ inputs.deploy_snapshot_retention_days }}
          max_total_bytes: ${{ inputs.deploy_snapshot_max_total_bytes }}

      - name: Ensure networks and verify volumes
        if: inputs.ensure_networks != '' || inputs.ensure_volumes != ''
        shell: bash
        run: |
          set -euo pipefail
          for network in ${{ inputs.ensure_networks }}; do
            docker_cmd network inspect "$network" >/dev/null 2>&1 || docker_cmd network create "$network"
          done
          for volume in ${{ inputs.ensure_volumes }}; do
            if docker_cmd volume inspect "$volume" >/dev/null 2>&1; then
              continue
            fi
            if [ "${{ inputs.create_missing_volumes }}" = true ]; then
              echo "::warning::Creating explicitly authorized empty volume: $volume"
              docker_cmd volume create "$volume" >/dev/null
            else
              echo "::error::Required volume $volume is missing; refusing to create an empty replacement" >&2
              exit 1
            fi
          done

      - name: Build images
        if: inputs.build_image && inputs.deployment_mode != 'prebuilt-images'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ "${{ inputs.build_no_cache }}" = true ]; then
            compose_cmd build --no-cache
          else
            compose_cmd build
          fi

      - name: Pull declared runtime images
        if: inputs.security_require_image_scan
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          compose_cmd pull --ignore-buildable

      - name: Discover declarative Compose images
        id: security-images-initial
        if: inputs.security_require_image_scan
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          mapfile -t configured_images < <(
            compose_cmd config --images | sed '/^$/d' | sort -u
          )
          [ "${#configured_images[@]}" -gt 0 ] || {
            echo "::error::No Compose images available for required security scan" >&2
            exit 1
          }
          image_ids=()
          for image_ref in "${configured_images[@]}"; do
            image_id="$(docker_cmd image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null || true)"
            [ -n "$image_id" ] || {
              echo "::warning::Configured image unavailable after build: $image_ref" >&2
              continue
            }
            image_ids+=("$image_id")
          done
          [ "${#image_ids[@]}" -gt 0 ] || {
            echo "::error::No Compose images available for required security scan" >&2
            exit 1
          }
          mapfile -t image_ids < <(printf '%s\n' "${image_ids[@]}" | sort -u)
          {
            echo 'refs<<OPTIMIZR_IMAGES'
            printf '%s\n' "${image_ids[@]}"
            echo OPTIMIZR_IMAGES
          } >> "$GITHUB_OUTPUT"

      - name: Security gate (images, initial)
        id: security-images-initial-gate
        if: inputs.security_require_image_scan
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: image
          image_refs: ${{ steps.security-images-initial.outputs.refs }}
          docker_mode: ${{ inputs.docker_mode }}
          severity: ${{ inputs.security_severity }}
          ignore_unfixed: ${{ inputs.security_ignore_unfixed }}
          exceptions_file: ${{ inputs.security_exceptions_file }}
          baseline_file: ${{ inputs.security_baseline_file }}
          remediation_window_enabled: ${{ inputs.security_remediation_window_enabled }}
          remediation_window_policy_file: ${{ inputs.security_remediation_window_policy_file }}
          remediation_window_service_scope: ${{ inputs.security_remediation_window_service_scope }}
          remediation_window_exposure_criticality: ${{ inputs.security_remediation_window_exposure_criticality }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/images-initial

      - name: Rebuild actionable image vulnerabilities
        id: security-rebuild
        if: >-
          inputs.security_require_image_scan &&
          inputs.deployment_mode != 'prebuilt-images' &&
          inputs.security_rebuild_retry_enabled &&
          steps.security-images-initial-gate.outputs.classification == 'actionable_vulnerability'
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-rebuild@v1
        with:
          deploy_path: ${{ env.DEPLOY_PATH }}
          compose_file: ${{ inputs.compose_file }}
          docker_mode: ${{ inputs.docker_mode }}
          build_all: ${{ inputs.security_rebuild_services == '' }}
          required_services: ${{ inputs.security_rebuild_services }}
          no_cache: ${{ inputs.security_rebuild_retry_no_cache }}

      - name: Discover remediated Compose images
        id: security-images-remediated
        if: steps.security-rebuild.outcome == 'success' && inputs.deployment_mode != 'prebuilt-images'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          compose_cmd pull --ignore-buildable || true
          mapfile -t configured_images < <(
            compose_cmd config --images | sed '/^$/d' | sort -u
          )
          [ "${#configured_images[@]}" -gt 0 ] || {
            echo "::error::No Compose images available after security rebuild" >&2
            exit 1
          }
          image_ids=()
          for image_ref in "${configured_images[@]}"; do
            image_id="$(docker_cmd image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null || true)"
            [ -n "$image_id" ] || {
              echo "::error::Remediated image unavailable after build: $image_ref" >&2
              exit 1
            }
            image_ids+=("$image_id")
          done
          mapfile -t image_ids < <(printf '%s\n' "${image_ids[@]}" | sort -u)
          initial_refs="${{ steps.security-images-initial.outputs.refs }}"
          current_refs="$(printf '%s\n' "${image_ids[@]}")"
          if [ "$initial_refs" = "$current_refs" ]; then
            echo "::warning title=Security Rebuild::Unchanged image digests detected after rebuild attempt (no_change). Previous vulnerabilities remain."
            echo "rebuild_status=no_change" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild_status=rebuilt" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'refs<<OPTIMIZR_IMAGES'
            printf '%s\n' "${image_ids[@]}"
            echo OPTIMIZR_IMAGES
          } >> "$GITHUB_OUTPUT"

      - name: Security gate (images, remediated)
        id: security-images-final-gate
        if: steps.security-images-remediated.outcome == 'success'
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: image
          image_refs: ${{ steps.security-images-remediated.outputs.refs }}
          docker_mode: ${{ inputs.docker_mode }}
          severity: ${{ inputs.security_severity }}
          ignore_unfixed: ${{ inputs.security_ignore_unfixed }}
          exceptions_file: ${{ inputs.security_exceptions_file }}
          baseline_file: ${{ inputs.security_baseline_file }}
          remediation_window_enabled: ${{ inputs.security_remediation_window_enabled }}
          remediation_window_policy_file: ${{ inputs.security_remediation_window_policy_file }}
          remediation_window_service_scope: ${{ inputs.security_remediation_window_service_scope }}
          remediation_window_exposure_criticality: ${{ inputs.security_remediation_window_exposure_criticality }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/images-remediated

      - name: Enforce final image security result
        id: security-final
        if: inputs.security_require_image_scan
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-retry-result@v1
        with:
          initial_outcome: ${{ steps.security-images-initial-gate.outcome }}
          initial_classification: ${{ steps.security-images-initial-gate.outputs.classification }}
          initial_fixable_vulnerability_count: ${{ steps.security-images-initial-gate.outputs.fixable_vulnerability_count }}
          initial_unfixed_vulnerability_count: ${{ steps.security-images-initial-gate.outputs.unfixed_vulnerability_count }}
          initial_misconfiguration_count: ${{ steps.security-images-initial-gate.outputs.misconfiguration_count }}
          initial_secret_count: ${{ steps.security-images-initial-gate.outputs.secret_count }}
          rebuild_outcome: ${{ steps.security-rebuild.outcome }}
          final_outcome: ${{ steps.security-images-final-gate.outcome }}
          final_classification: ${{ steps.security-images-final-gate.outputs.classification }}
          final_fixable_vulnerability_count: ${{ steps.security-images-final-gate.outputs.fixable_vulnerability_count }}
          final_unfixed_vulnerability_count: ${{ steps.security-images-final-gate.outputs.unfixed_vulnerability_count }}
          final_misconfiguration_count: ${{ steps.security-images-final-gate.outputs.misconfiguration_count }}
          final_secret_count: ${{ steps.security-images-final-gate.outputs.secret_count }}
          retry_enabled: ${{ inputs.security_rebuild_retry_enabled }}
          initial_refs: ${{ steps.security-images-initial.outputs.refs }}
          remediated_refs: ${{ steps.security-images-remediated.outputs.refs }}

      - name: Require effective security remediation
        if: inputs.security_require_image_scan
        shell: bash
        env:
          RETRY_PASSED: ${{ steps.security-final.outputs.passed }}
          COMPATIBILITY_ALLOWED: ${{ steps.security-final.outputs.compatibility_allowed }}
          SECURITY_CLASSIFICATION: ${{ steps.security-final.outputs.final_result }}
          REMEDIATION_WINDOW_ALLOWED: ${{ steps.security-images-final-gate.outputs.remediation_window_allowed }}
          REMEDIATION_WINDOW_UNCOVERED: ${{ steps.security-images-final-gate.outputs.remediation_window_uncovered }}
          REMEDIATION_WINDOW_STATE: ${{ steps.security-images-final-gate.outputs.remediation_state }}
          REMEDIATION_WINDOW_FAILURE_REASON: ${{ steps.security-images-final-gate.outputs.remediation_window_failure_reason }}
          FIXABLE_COUNT: ${{ steps.security-final.outputs.fixable_vulnerability_count }}
          UNFIXED_COUNT: ${{ steps.security-final.outputs.unfixed_vulnerability_count }}
          MISCONFIGURATION_COUNT: ${{ steps.security-final.outputs.misconfiguration_count }}
          SECRET_COUNT: ${{ steps.security-final.outputs.secret_count }}
          INITIAL_FAILURE_REASON: ${{ steps.security-images-initial-gate.outputs.failure_reason }}
          FINAL_FAILURE_REASON: ${{ steps.security-images-final-gate.outputs.failure_reason }}
          REBUILD_FAILURE_REASON: ${{ steps.security-rebuild.outputs.failure_reason }}
          REBUILD_RESULT: ${{ steps.security-final.outputs.rebuild_result }}
          IGNORE_UNFIXED: ${{ inputs.security_ignore_unfixed }}
        run: |
          set -euo pipefail
          if [ "$RETRY_PASSED" = true ]; then
            echo "Security remediation check passed."
          elif [ "$SECURITY_CLASSIFICATION" = actionable_vulnerability ] && \
               [ "$REMEDIATION_WINDOW_ALLOWED" = true ] && \
               [ "${REMEDIATION_WINDOW_UNCOVERED:-1}" = 0 ] && \
               [ "${MISCONFIGURATION_COUNT:-0}" = 0 ] && [ "${SECRET_COUNT:-0}" = 0 ]; then
            echo "::warning title=Governed remediation window::Proceeding with every blocking finding covered by an active reviewed window; state=${REMEDIATION_WINDOW_STATE:-active}."
          elif [ "$IGNORE_UNFIXED" = true ] && [ "$COMPATIBILITY_ALLOWED" = true ]; then
            echo "::warning title=Unremediated Base Image::Proceeding under the narrow ignore_unfixed compatibility policy for classification=$SECURITY_CLASSIFICATION rebuild=$REBUILD_RESULT."
          else
            failure_reason="${REMEDIATION_WINDOW_FAILURE_REASON:-${FINAL_FAILURE_REASON:-${INITIAL_FAILURE_REASON:-${REBUILD_FAILURE_REASON:-${REBUILD_RESULT:-none}}}}}"
            echo "::error::Image security gate blocked deployment: classification=${SECURITY_CLASSIFICATION} failure_reason=${failure_reason} rebuild=${REBUILD_RESULT} fixable=${FIXABLE_COUNT} unfixed=${UNFIXED_COUNT} misconfigurations=${MISCONFIGURATION_COUNT} secrets=${SECRET_COUNT}" >&2
            exit 1
          fi

      - name: Pre-deploy validation (nginx -t)
        if: inputs.pre_deploy_validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          compose_cmd run --rm --no-deps --entrypoint '' nginx nginx -t

      - name: Roll out and verify primary container
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set +e
          compose_cmd up -d --remove-orphans ${{ inputs.deployment_mode == 'prebuilt-images' && '--no-build' || '' }}
          compose_status=$?
          set -e
          if [ "$compose_status" -ne 0 ]; then
            compose_cmd ps -a >&2 || true
            mapfile -t exited_services < <(
              compose_cmd ps -a --status exited --services 2>/dev/null
            )
            for service in "${exited_services[@]}"; do
              container_id="$(compose_cmd ps -a -q "$service" 2>/dev/null || true)"
              [ -n "$container_id" ] || continue
              service_exit="$(docker_cmd inspect -f '{{.State.ExitCode}}' "$container_id" 2>/dev/null || echo unknown)"
              [ "$service_exit" != 0 ] || continue
              compose_cmd logs --no-color --tail=200 "$service" >&2 || true
            done
            exit "$compose_status"
          fi

          recreate_services=()
          if [ -n "${RECREATE_SERVICES//[[:space:]]/}" ]; then
            mapfile -t declared_services < <(
              compose_cmd config --services
            )
            for service in $RECREATE_SERVICES; do
              if ! [[ "$service" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
                echo "::error::Service name contains unsupported characters: $service" >&2
                exit 2
              fi
              if ! printf '%s\n' "${declared_services[@]}" | grep -Fxq -- "$service"; then
                echo "::error::Requested Compose service is not declared: $service" >&2
                exit 2
              fi
              recreate_services+=("$service")
            done
          fi
          if [ "${#recreate_services[@]}" -gt 0 ]; then
            echo "Recreating explicitly declared Compose services: ${recreate_services[*]}"
            compose_cmd up -d --no-deps --force-recreate --no-build "${recreate_services[@]}"
          fi

          elapsed=0
          while [ "$elapsed" -lt "$HEALTH_TIMEOUT" ]; do
            status="$(docker_cmd inspect -f '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo 'not found')"
            if [ "$status" = healthy ]; then
              echo "$CONTAINER_NAME is healthy"
              exit 0
            fi
            if [ "$status" = 'not found' ] || [ -z "$status" ]; then
              compose_cmd logs --tail=50 >&2 || true
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          compose_cmd logs --tail=50 >&2 || true
          exit 1

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-gate-${{ inputs.service_name }}-${{ github.run_id }}
          path: artifacts/security-gate
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup runner and Docker leftovers
        if: always() && inputs.run_prune
        uses: optimizr-tech/optimizr-actions/.github/actions/docker-prune-safe@v1
        with:
          image_age_threshold: ${{ inputs.image_age_threshold }}
          docker_mode: ${{ inputs.docker_mode }}

      - name: Clean runner workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          workspace="${workspace%/}"
          if [ -z "$workspace" ] || [ "$workspace" = "/" ]; then
            echo "::error::Refusing to clean an empty or root workspace" >&2
            exit 1
          fi
          case "$workspace" in
            /*) ;;
            *)
              echo "::error::Refusing to clean a non-absolute workspace: $workspace" >&2
              exit 1
              ;;
          esac
          if [ ! -d "$workspace" ]; then
            echo "::warning::Workspace does not exist; skipping cleanup: $workspace"
            exit 0
          fi
          if ! workspace_real="$(realpath -e -- "$workspace")"; then
            echo "::error::Unable to resolve workspace safely: $workspace" >&2
            exit 1
          fi
          if [ "$workspace_real" = "/" ] || [ "$workspace_real" != "$workspace" ]; then
            echo "::error::Refusing to clean a root or symlinked workspace: $workspace" >&2
            exit 1
          fi
          path_depth="$(awk -F/ '{print NF - 1}' <<< "$workspace_real")"
          if [ "$path_depth" -lt 4 ]; then
            echo "::error::Refusing to clean an unexpectedly shallow workspace: $workspace" >&2
            exit 1
          fi
          if ! find -- "$workspace_real" -mindepth 1 -delete; then
            echo "::warning::Workspace cleanup needs elevated permissions; retrying non-interactively"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              if ! sudo -n find -- "$workspace_real" -mindepth 1 -delete; then
                echo "::warning::Non-interactive workspace cleanup could not remove protected files"
              fi
            else
              echo "::warning::Non-interactive sudo is unavailable; protected workspace files may remain"
            fi
          fi

      - name: Checkout coherent deploy-manifest recorder
        if: always() && inputs.deploy_manifest_enabled
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-manifest
          persist-credentials: false

      - name: Record sanitized deployment manifest
        if: always() && inputs.deploy_manifest_enabled
        uses: ./.optimizr-actions-manifest/.github/actions/record-deploy-manifest
        with:
          deploy_path: ${{ env.DEPLOY_PATH }}
          compose_file: ${{ inputs.compose_file }}
          compose_override_file: ${{ inputs.deployment_mode == 'prebuilt-images' && inputs.prebuilt_compose_file || '' }}
          container_name: ${{ inputs.container_name }}
          docker_mode: ${{ inputs.docker_mode }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          migration_result: ${{ inputs.deploy_manifest_migration_result }}
          optional_build_result: not-reported
          security_initial_result: ${{ steps.security-final.outputs.initial_result || 'not-run' }}
          security_rebuild_attempted: ${{ steps.security-final.outputs.rebuild_attempted || 'false' }}
          security_rebuild_result: ${{ steps.security-final.outputs.rebuild_result || 'skipped' }}
          security_final_result: ${{ steps.security-final.outputs.final_result || 'not-run' }}
          security_remediation_window_state: ${{ steps.security-images-final-gate.outputs.remediation_state || 'not_applicable' }}
          retention: ${{ inputs.deploy_manifest_retention }}
