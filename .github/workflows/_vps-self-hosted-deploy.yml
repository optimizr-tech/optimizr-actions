# Reusable deployment for one Compose stack on a trusted VPS runner.
name: _vps-self-hosted-deploy

concurrency:
  group: deploy-${{ inputs.service_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      service_name:
        description: Repository/deploy directory name under /opt/optimizr
        required: true
        type: string
      container_name:
        description: Primary Docker container used for health verification
        required: true
        type: string
      runner_label:
        description: Short trusted self-hosted runner label
        required: true
        type: string
      compose_file:
        description: Compose file relative to the deployment directory
        required: false
        type: string
        default: docker-compose.yml
      pre_deploy_validation:
        description: Run nginx -t before rollout
        required: false
        type: boolean
        default: false
      build_image:
        description: Build Compose images before rollout
        required: false
        type: boolean
        default: true
      build_no_cache:
        description: Build without cache when build_image is enabled
        required: false
        type: boolean
        default: true
      health_timeout:
        description: Seconds to wait for the primary container to become healthy
        required: false
        type: number
        default: 120
      deploy_timeout_minutes:
        description: Maximum deployment job duration; allowed range is 30-120 minutes
        required: false
        type: number
        default: 30
      ensure_networks:
        description: Whitespace-separated Docker networks to ensure
        required: false
        type: string
        default: optimizr_infra
      ensure_volumes:
        description: Whitespace-separated Docker volumes to ensure
        required: false
        type: string
        default: ""
      run_prune:
        description: Run Docker and runner cleanup after deployment
        required: false
        type: boolean
        default: true
      image_age_threshold:
        description: Docker age filter used by image prune
        required: false
        type: string
        default: 24h
      security_require_image_scan:
        description: Require scanning built Compose images before rollout
        required: false
        type: boolean
        default: true
      docker_mode:
        description: Local image access mode for the security gate and manifest
        required: false
        type: string
        default: sudo
      security_severity:
        description: Blocking Trivy severities
        required: false
        type: string
        default: HIGH,CRITICAL
      security_ignore_unfixed:
        description: Deprecated compatibility input for unfixed vulnerabilities
        required: false
        type: boolean
        default: false
      security_exceptions_file:
        description: Reviewed expiring security exceptions JSON
        required: false
        type: string
        default: ""
      security_baseline_file:
        description: Reviewed expiring vulnerability baseline for immutable image IDs
        required: false
        type: string
        default: ""
      security_trivy_version:
        description: Controlled Trivy release
        required: false
        type: string
        default: v0.70.0
      security_db_max_age_hours:
        description: Maximum accepted vulnerability database age
        required: false
        type: number
        default: 30
      security_rebuild_retry_enabled:
        description: Retry actionable image vulnerabilities with one pull and rebuild
        required: false
        type: boolean
        default: true
      security_rebuild_retry_no_cache:
        description: Disable cache during the bounded security rebuild
        required: false
        type: boolean
        default: true
      security_rebuild_services:
        description: Whitespace-separated required Compose services for the security rebuild; empty rebuilds all buildable services
        required: false
        type: string
        default: ""
      deploy_manifest_enabled:
        description: Record sanitized immutable success/failure manifests
        required: false
        type: boolean
        default: false
      deploy_manifest_retention:
        description: Immutable deploy manifests retained on the VPS
        required: false
        type: number
        default: 50
      deploy_manifest_migration_result:
        description: passed, failed, skipped or not-reported
        required: false
        type: string
        default: not-reported

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - ${{ inputs.runner_label }}
    timeout-minutes: ${{ inputs.deploy_timeout_minutes }}
    environment:
      name: production
    env:
      DEPLOY_PATH: /opt/optimizr/${{ inputs.service_name }}
      CONTAINER_NAME: ${{ inputs.container_name }}
      COMPOSE_FILE: ${{ inputs.compose_file }}
      HEALTH_TIMEOUT: ${{ inputs.health_timeout }}
      DEPLOY_TIMEOUT_MINUTES: ${{ inputs.deploy_timeout_minutes }}

    steps:
      - name: Validate effective deployment timeout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] || (( DEPLOY_TIMEOUT_MINUTES < 30 || DEPLOY_TIMEOUT_MINUTES > 120 )); then
            echo "::error::deploy_timeout_minutes allowed range is 30-120 minutes" >&2
            exit 2
          fi
          echo "::notice title=Effective deployment timeout::Effective deployment timeout: ${DEPLOY_TIMEOUT_MINUTES} minutes (allowed range is 30-120 minutes)."

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Security gate (filesystem)
        id: security-filesystem-gate
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: fs
          scan_ref: .
          severity: ${{ inputs.security_severity }}
          ignore_unfixed: ${{ inputs.security_ignore_unfixed }}
          exceptions_file: ${{ inputs.security_exceptions_file }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/filesystem


      - name: Require filesystem security result
        if: always() && steps.security-filesystem-gate.outcome != 'skipped'
        shell: bash
        env:
          FILESYSTEM_OUTCOME: ${{ steps.security-filesystem-gate.outcome }}
          SECURITY_CLASSIFICATION: ${{ steps.security-filesystem-gate.outputs.classification }}
          FIXABLE_COUNT: ${{ steps.security-filesystem-gate.outputs.fixable_vulnerability_count }}
          UNFIXED_COUNT: ${{ steps.security-filesystem-gate.outputs.unfixed_vulnerability_count }}
          MISCONFIGURATION_COUNT: ${{ steps.security-filesystem-gate.outputs.misconfiguration_count }}
          SECRET_COUNT: ${{ steps.security-filesystem-gate.outputs.secret_count }}
        run: |
          set -euo pipefail
          classification="${SECURITY_CLASSIFICATION:-gate_error}"
          fixable="${FIXABLE_COUNT:-0}"
          unfixed="${UNFIXED_COUNT:-0}"
          misconfigurations="${MISCONFIGURATION_COUNT:-0}"
          secrets="${SECRET_COUNT:-0}"
          if [ "$FILESYSTEM_OUTCOME" = success ] && {
            [ "$classification" = clean ] || [ "$classification" = unfixed_warning ];
          }; then
            echo "Filesystem security gate passed: classification=$classification fixable=$fixable unfixed=$unfixed."
          else
            echo "::error::Filesystem security gate blocked deployment: classification=$classification fixable=$fixable unfixed=$unfixed misconfigurations=$misconfigurations secrets=$secrets" >&2
            exit 1
          fi

      - name: Backup and synchronize files
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_ROOT="/opt/optimizr/backups/${{ inputs.service_name }}/deploys"
          sudo mkdir -p "$DEPLOY_PATH" "$BACKUP_ROOT"
          sudo chown "$(id -un):$(id -gn)" "$DEPLOY_PATH" "$BACKUP_ROOT"
          while IFS= read -r -d '' path; do
            sudo chown -R "$(id -un):$(id -gn)" "$path"
          done < <(
            find "$DEPLOY_PATH" \
              -mindepth 1 \
              -maxdepth 1 \
              -not -name '.secrets' -print0
          )
          sudo chmod 750 "$BACKUP_ROOT"

          if [ -d "$DEPLOY_PATH" ] && [ "$(ls -A "$DEPLOY_PATH" 2>/dev/null)" ]; then
            backup_file="${BACKUP_ROOT}/$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            if (
              umask 077
              tar \
                --exclude='.env' --exclude='*/.env' \
                --exclude='.env.*' --exclude='*/.env.*' \
                --exclude='.secrets' --exclude='*/.secrets' \
                --exclude='.secrets/*' --exclude='*/.secrets/*' \
                --exclude='*.pem' --exclude='*.key' \
                --exclude='*.p12' --exclude='*.pfx' \
                -czf "$backup_file" -C "$DEPLOY_PATH" . 2>/dev/null
            ); then
              chmod 600 "$backup_file"
              echo "Secret-free configuration backup created"
            else
              rm -f "$backup_file"
              echo "::warning::Configuration backup failed; deployment continues"
            fi
          fi

          rsync_args=(
            -a --delete
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude='*.tar.gz'
            --exclude=backup/
          )
          if [ -f "$GITHUB_WORKSPACE/.deployignore" ]; then
            rsync_args+=(--exclude-from="$GITHUB_WORKSPACE/.deployignore")
          fi
          rsync "${rsync_args[@]}" "$GITHUB_WORKSPACE/" "$DEPLOY_PATH/"
          find "$DEPLOY_PATH" -name '*.sh' -exec chmod +x {} \;

      - name: Ensure networks and volumes exist
        if: inputs.ensure_networks != '' || inputs.ensure_volumes != ''
        shell: bash
        run: |
          set -euo pipefail
          for network in ${{ inputs.ensure_networks }}; do
            sudo docker network inspect "$network" >/dev/null 2>&1 || sudo docker network create "$network"
          done
          for volume in ${{ inputs.ensure_volumes }}; do
            sudo docker volume inspect "$volume" >/dev/null 2>&1 || sudo docker volume create "$volume"
          done

      - name: Build images
        if: inputs.build_image
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ "${{ inputs.build_no_cache }}" = true ]; then
            sudo docker compose -f "$COMPOSE_FILE" build --no-cache
          else
            sudo docker compose -f "$COMPOSE_FILE" build
          fi

      - name: Pull declared runtime images
        if: inputs.security_require_image_scan
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          sudo docker compose -f "$COMPOSE_FILE" pull --ignore-buildable

      - name: Discover declarative Compose images
        id: security-images-initial
        if: inputs.security_require_image_scan
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          mapfile -t configured_images < <(
            sudo docker compose -f "$COMPOSE_FILE" config --images | sed '/^$/d' | sort -u
          )
          [ "${#configured_images[@]}" -gt 0 ] || {
            echo "::error::No Compose images available for required security scan" >&2
            exit 1
          }
          image_ids=()
          for image_ref in "${configured_images[@]}"; do
            image_id="$(sudo docker image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null || true)"
            [ -n "$image_id" ] || {
              echo "::warning::Configured image unavailable after build: $image_ref" >&2
              continue
            }
            image_ids+=("$image_id")
          done
          [ "${#image_ids[@]}" -gt 0 ] || {
            echo "::error::No Compose images available for required security scan" >&2
            exit 1
          }
          mapfile -t image_ids < <(printf '%s\n' "${image_ids[@]}" | sort -u)
          {
            echo 'refs<<OPTIMIZR_IMAGES'
            printf '%s\n' "${image_ids[@]}"
            echo OPTIMIZR_IMAGES
          } >> "$GITHUB_OUTPUT"

      - name: Security gate (images, initial)
        id: security-images-initial-gate
        if: inputs.security_require_image_scan
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: image
          image_refs: ${{ steps.security-images-initial.outputs.refs }}
          docker_mode: ${{ inputs.docker_mode }}
          severity: ${{ inputs.security_severity }}
          ignore_unfixed: ${{ inputs.security_ignore_unfixed }}
          exceptions_file: ${{ inputs.security_exceptions_file }}
          baseline_file: ${{ inputs.security_baseline_file }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/images-initial

      - name: Rebuild actionable image vulnerabilities
        id: security-rebuild
        if: >-
          inputs.security_require_image_scan &&
          inputs.security_rebuild_retry_enabled &&
          steps.security-images-initial-gate.outcome == 'failure' &&
          steps.security-images-initial-gate.outputs.classification == 'actionable_vulnerability'
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-rebuild@v1
        with:
          deploy_path: ${{ env.DEPLOY_PATH }}
          compose_file: ${{ inputs.compose_file }}
          build_all: ${{ inputs.security_rebuild_services == '' }}
          required_services: ${{ inputs.security_rebuild_services }}
          no_cache: ${{ inputs.security_rebuild_retry_no_cache }}

      - name: Discover remediated Compose images
        id: security-images-remediated
        if: steps.security-rebuild.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          sudo docker compose -f "$COMPOSE_FILE" pull --ignore-buildable || true
          mapfile -t configured_images < <(
            sudo docker compose -f "$COMPOSE_FILE" config --images | sed '/^$/d' | sort -u
          )
          [ "${#configured_images[@]}" -gt 0 ] || {
            echo "::error::No Compose images available after security rebuild" >&2
            exit 1
          }
          image_ids=()
          for image_ref in "${configured_images[@]}"; do
            image_id="$(sudo docker image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null || true)"
            [ -n "$image_id" ] || {
              echo "::error::Remediated image unavailable after build: $image_ref" >&2
              exit 1
            }
            image_ids+=("$image_id")
          done
          mapfile -t image_ids < <(printf '%s\n' "${image_ids[@]}" | sort -u)
          initial_refs="${{ steps.security-images-initial.outputs.refs }}"
          current_refs="$(printf '%s\n' "${image_ids[@]}")"
          if [ "$initial_refs" = "$current_refs" ]; then
            echo "::warning title=Security Rebuild::Unchanged image digests detected after rebuild attempt (no_change). Previous vulnerabilities remain."
            echo "rebuild_status=no_change" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild_status=rebuilt" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'refs<<OPTIMIZR_IMAGES'
            printf '%s\n' "${image_ids[@]}"
            echo OPTIMIZR_IMAGES
          } >> "$GITHUB_OUTPUT"

      - name: Security gate (images, remediated)
        id: security-images-final-gate
        if: steps.security-images-remediated.outcome == 'success'
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: image
          image_refs: ${{ steps.security-images-remediated.outputs.refs }}
          docker_mode: ${{ inputs.docker_mode }}
          severity: ${{ inputs.security_severity }}
          ignore_unfixed: ${{ inputs.security_ignore_unfixed }}
          exceptions_file: ${{ inputs.security_exceptions_file }}
          baseline_file: ${{ inputs.security_baseline_file }}
          trivy_version: ${{ inputs.security_trivy_version }}
          db_max_age_hours: ${{ inputs.security_db_max_age_hours }}
          evidence_dir: artifacts/security-gate/images-remediated

      - name: Enforce final image security result
        id: security-final
        if: inputs.security_require_image_scan
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-retry-result@v1
        with:
          initial_outcome: ${{ steps.security-images-initial-gate.outcome }}
          initial_classification: ${{ steps.security-images-initial-gate.outputs.classification }}
          initial_fixable_vulnerability_count: ${{ steps.security-images-initial-gate.outputs.fixable_vulnerability_count }}
          initial_unfixed_vulnerability_count: ${{ steps.security-images-initial-gate.outputs.unfixed_vulnerability_count }}
          initial_misconfiguration_count: ${{ steps.security-images-initial-gate.outputs.misconfiguration_count }}
          initial_secret_count: ${{ steps.security-images-initial-gate.outputs.secret_count }}
          rebuild_outcome: ${{ steps.security-rebuild.outcome }}
          final_outcome: ${{ steps.security-images-final-gate.outcome }}
          final_classification: ${{ steps.security-images-final-gate.outputs.classification }}
          final_fixable_vulnerability_count: ${{ steps.security-images-final-gate.outputs.fixable_vulnerability_count }}
          final_unfixed_vulnerability_count: ${{ steps.security-images-final-gate.outputs.unfixed_vulnerability_count }}
          final_misconfiguration_count: ${{ steps.security-images-final-gate.outputs.misconfiguration_count }}
          final_secret_count: ${{ steps.security-images-final-gate.outputs.secret_count }}
          retry_enabled: ${{ inputs.security_rebuild_retry_enabled }}
          initial_refs: ${{ steps.security-images-initial.outputs.refs }}
          remediated_refs: ${{ steps.security-images-remediated.outputs.refs }}

      - name: Require effective security remediation
        if: inputs.security_require_image_scan
        shell: bash
        env:
          RETRY_PASSED: ${{ steps.security-final.outputs.passed }}
          COMPATIBILITY_ALLOWED: ${{ steps.security-final.outputs.compatibility_allowed }}
          SECURITY_CLASSIFICATION: ${{ steps.security-final.outputs.final_result }}
          FIXABLE_COUNT: ${{ steps.security-final.outputs.fixable_vulnerability_count }}
          UNFIXED_COUNT: ${{ steps.security-final.outputs.unfixed_vulnerability_count }}
          MISCONFIGURATION_COUNT: ${{ steps.security-final.outputs.misconfiguration_count }}
          SECRET_COUNT: ${{ steps.security-final.outputs.secret_count }}
          INITIAL_FAILURE_REASON: ${{ steps.security-images-initial-gate.outputs.failure_reason }}
          FINAL_FAILURE_REASON: ${{ steps.security-images-final-gate.outputs.failure_reason }}
          REBUILD_FAILURE_REASON: ${{ steps.security-rebuild.outputs.failure_reason }}
          REBUILD_RESULT: ${{ steps.security-final.outputs.rebuild_result }}
          IGNORE_UNFIXED: ${{ inputs.security_ignore_unfixed }}
        run: |
          set -euo pipefail
          if [ "$RETRY_PASSED" = true ]; then
            echo "Security remediation check passed."
          elif [ "$IGNORE_UNFIXED" = true ] && [ "$COMPATIBILITY_ALLOWED" = true ]; then
            echo "::warning title=Unremediated Base Image::Proceeding under the narrow ignore_unfixed compatibility policy for classification=$SECURITY_CLASSIFICATION rebuild=$REBUILD_RESULT."
          else
            failure_reason="${FINAL_FAILURE_REASON:-${INITIAL_FAILURE_REASON:-${REBUILD_FAILURE_REASON:-none}}}"
            echo "::error::Image security gate blocked deployment: classification=${SECURITY_CLASSIFICATION} failure_reason=${failure_reason} rebuild=${REBUILD_RESULT} fixable=${FIXABLE_COUNT} unfixed=${UNFIXED_COUNT} misconfigurations=${MISCONFIGURATION_COUNT} secrets=${SECRET_COUNT}" >&2
            exit 1
          fi

      - name: Pre-deploy validation (nginx -t)
        if: inputs.pre_deploy_validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          sudo docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint '' nginx nginx -t

      - name: Roll out and verify primary container
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set +e
          sudo docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
          compose_status=$?
          set -e
          if [ "$compose_status" -ne 0 ]; then
            sudo docker compose -f "$COMPOSE_FILE" ps -a >&2 || true
            mapfile -t exited_services < <(
              sudo docker compose -f "$COMPOSE_FILE" ps -a --status exited --services 2>/dev/null
            )
            for service in "${exited_services[@]}"; do
              container_id="$(sudo docker compose -f "$COMPOSE_FILE" ps -a -q "$service" 2>/dev/null || true)"
              [ -n "$container_id" ] || continue
              service_exit="$(sudo docker inspect -f '{{.State.ExitCode}}' "$container_id" 2>/dev/null || echo unknown)"
              [ "$service_exit" != 0 ] || continue
              sudo docker compose -f "$COMPOSE_FILE" logs --no-color --tail=200 "$service" >&2 || true
            done
            exit "$compose_status"
          fi

          elapsed=0
          while [ "$elapsed" -lt "$HEALTH_TIMEOUT" ]; do
            status="$(sudo docker inspect -f '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo 'not found')"
            if [ "$status" = healthy ]; then
              echo "$CONTAINER_NAME is healthy"
              exit 0
            fi
            if [ "$status" = 'not found' ] || [ -z "$status" ]; then
              sudo docker compose -f "$COMPOSE_FILE" logs --tail=50 >&2 || true
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          sudo docker compose -f "$COMPOSE_FILE" logs --tail=50 >&2 || true
          exit 1

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-gate-${{ inputs.service_name }}-${{ github.run_id }}
          path: artifacts/security-gate
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup runner and Docker leftovers
        if: always() && inputs.run_prune
        uses: optimizr-tech/optimizr-actions/.github/actions/docker-prune-safe@v1
        with:
          image_age_threshold: ${{ inputs.image_age_threshold }}

      - name: Clean runner workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          workspace="${workspace%/}"
          if [ -z "$workspace" ] || [ "$workspace" = "/" ]; then
            echo "::error::Refusing to clean an empty or root workspace" >&2
            exit 1
          fi
          case "$workspace" in
            /*) ;;
            *)
              echo "::error::Refusing to clean a non-absolute workspace: $workspace" >&2
              exit 1
              ;;
          esac
          if [ ! -d "$workspace" ]; then
            echo "::warning::Workspace does not exist; skipping cleanup: $workspace"
            exit 0
          fi
          if ! workspace_real="$(realpath -e -- "$workspace")"; then
            echo "::error::Unable to resolve workspace safely: $workspace" >&2
            exit 1
          fi
          if [ "$workspace_real" = "/" ] || [ "$workspace_real" != "$workspace" ]; then
            echo "::error::Refusing to clean a root or symlinked workspace: $workspace" >&2
            exit 1
          fi
          path_depth="$(awk -F/ '{print NF - 1}' <<< "$workspace_real")"
          if [ "$path_depth" -lt 4 ]; then
            echo "::error::Refusing to clean an unexpectedly shallow workspace: $workspace" >&2
            exit 1
          fi
          if ! find -- "$workspace_real" -mindepth 1 -delete; then
            echo "::warning::Workspace cleanup needs elevated permissions; retrying non-interactively"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              if ! sudo -n find -- "$workspace_real" -mindepth 1 -delete; then
                echo "::warning::Non-interactive workspace cleanup could not remove protected files"
              fi
            else
              echo "::warning::Non-interactive sudo is unavailable; protected workspace files may remain"
            fi
          fi

      - name: Checkout coherent deploy-manifest recorder
        if: always() && inputs.deploy_manifest_enabled
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-manifest
          persist-credentials: false

      - name: Record sanitized deployment manifest
        if: always() && inputs.deploy_manifest_enabled
        uses: ./.optimizr-actions-manifest/.github/actions/record-deploy-manifest
        with:
          deploy_path: ${{ env.DEPLOY_PATH }}
          compose_file: ${{ inputs.compose_file }}
          container_name: ${{ inputs.container_name }}
          docker_mode: ${{ inputs.docker_mode }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          migration_result: ${{ inputs.deploy_manifest_migration_result }}
          optional_build_result: not-reported
          security_initial_result: ${{ steps.security-final.outputs.initial_result || 'not-run' }}
          security_rebuild_attempted: ${{ steps.security-final.outputs.rebuild_attempted || 'false' }}
          security_rebuild_result: ${{ steps.security-final.outputs.rebuild_result || 'skipped' }}
          security_final_result: ${{ steps.security-final.outputs.final_result || 'not-run' }}
          retention: ${{ inputs.deploy_manifest_retention }}
