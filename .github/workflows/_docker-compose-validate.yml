# Reusable: valida sintaxe de docker-compose + bash de scripts.
# Consome via: uses: optimizr-tech/optimizr-actions/.github/workflows/_docker-compose-validate.yml@<ref>
# Caller permission contract: the job containing `uses:` must declare
# `contents: read` and `actions: write`. GitHub validates the caller's
# permission ceiling before creating this job; the called workflow cannot
# elevate a scope that the caller did not grant. Registry credentials are
# opt-in, isolated under RUNNER_TEMP, and accepted only on trusted main runs.

name: _docker-compose-validate

# Concurrency: caller workflow only (CI_STANDARDS §8.1). Top-level group here
# collides with ci-${{ github.ref }} when github.workflow is "ci".

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels; use ubuntu-latest or a governed self-hosted label set
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, or ephemeral-pr
        required: false
        type: string
        default: none
      docker_mode:
        description: Docker access mode; auto probes direct access before non-interactive sudo
        required: false
        type: string
        default: auto
      compose_files:
        description: "Compose files a validar standalone (espaço-separado, um -f cada)"
        required: false
        type: string
        default: "docker-compose.yml"
      compose_stacks:
        description: >-
          Stacks mergeados a validar. Grupos separados por espaço; dentro de cada
          grupo, arquivos separados por vírgula (ex. docker-compose.yml,docker-compose.dev.yml).
        required: false
        type: string
        default: ""
      script_globs:
        description: "Globs de scripts shell pra checar sintaxe (espaço-separado)"
        required: false
        type: string
        default: "scripts/**/*.sh"
      build_image:
        description: "Build da imagem Docker como sanity check final"
        required: false
        type: boolean
        default: false
      registry:
        description: OCI registry hostname used by explicit private-base authentication
        required: false
        type: string
        default: ghcr.io
      registry_auth_mode:
        description: anonymous or explicit; explicit is restricted to trusted-main
        required: false
        type: string
        default: anonymous
      skip:
        description: Explicit optional caller skip; never derive this from a billing marker
        required: false
        type: boolean
        default: false
    secrets:
      registry_username:
        description: Read-only registry username for explicit private-base authentication
        required: false
      registry_password:
        description: Read-only registry token for explicit private-base authentication
        required: false

jobs:
  validate:
    if: ${{ !inputs.skip }}
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: ${{ inputs.build_image && 15 || 10 }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          ALLOW_TRUSTED_MAIN: "true"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(not isinstance(v, str) or not v for v in labels):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if os.environ["ALLOW_TRUSTED_MAIN"] != "true":
                  raise SystemExit("trusted-main is not allowed for this workflow")
              if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
                  raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          elif mode == "ephemeral-pr":
              if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
                  raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          else:
              raise SystemExit("self-hosted validation requires mode trusted-main or ephemeral-pr")
          PY

      - name: Prepare isolated Docker registry authentication
        if: inputs.build_image
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_AUTH_MODE: ${{ inputs.registry_auth_mode }}
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DOCKER_CONFIG_DIR: ${{ runner.temp }}/optimizr-compose-docker-config
        run: |
          set -euo pipefail
          case "$REGISTRY_AUTH_MODE" in
            anonymous) ;;
            explicit)
              python3 - <<'PY'
          import json
          import os
          import re

          labels = json.loads(os.environ["RUNNER_JSON"])
          if "self-hosted" not in labels or "Linux" not in labels:
              raise SystemExit("registry authentication requires a self-hosted Linux runner")
          if os.environ["SELF_HOSTED_MODE"] != "trusted-main":
              raise SystemExit("registry authentication requires trusted-main")
          if (
              os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"}
              or os.environ["EVENT_REF"] != "refs/heads/main"
          ):
              raise SystemExit("registry authentication requires push or workflow_dispatch on main")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]*(?::[0-9]{1,5})?", os.environ["REGISTRY"]):
              raise SystemExit("registry must be a hostname with an optional port")
          if not os.environ["REGISTRY_USERNAME"] or not os.environ["REGISTRY_PASSWORD"]:
              raise SystemExit("explicit registry authentication requires both credentials")
          PY
              ;;
            *)
              echo "::error::registry_auth_mode must be anonymous or explicit" >&2
              exit 2
              ;;
          esac

          rm -rf -- "$DOCKER_CONFIG_DIR"
          install -d -m 700 -- "$DOCKER_CONFIG_DIR"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"
          if [ "$REGISTRY_AUTH_MODE" = explicit ]; then
            printf '%s' "$REGISTRY_PASSWORD" \
              | DOCKER_CONFIG="$DOCKER_CONFIG_DIR" docker login "$REGISTRY" \
                  --username "$REGISTRY_USERNAME" --password-stdin >/dev/null
          else
            echo "Using isolated anonymous Docker registry configuration"
          fi

      - name: Resolve Docker access mode
        id: docker
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.docker_mode }}
          BUILD_IMAGE: ${{ inputs.build_image }}
        run: |
          set -euo pipefail

          direct_available() {
            docker info >/dev/null 2>&1
          }

          sudo_available() {
            command -v sudo >/dev/null 2>&1 &&
              sudo -n docker info >/dev/null 2>&1
          }

          case "$REQUESTED_MODE" in
            auto)
              if direct_available; then
                resolved=direct
              elif sudo_available; then
                resolved=sudo
              else
                echo "::error::Docker is unavailable through direct access and sudo -n" >&2
                exit 1
              fi
              ;;
            direct)
              direct_available || {
                echo "::error::docker_mode=direct requires direct Docker daemon access" >&2
                exit 1
              }
              resolved=direct
              ;;
            sudo)
              sudo_available || {
                echo "::error::docker_mode=sudo requires non-interactive sudo Docker access" >&2
                exit 1
              }
              resolved=sudo
              ;;
            *)
              echo "::error::docker_mode must be auto, direct, or sudo" >&2
              exit 2
              ;;
          esac

          if [ "$BUILD_IMAGE" = true ] && [ "$resolved" != direct ]; then
            echo "::error::build_image requires direct Docker access for Buildx actions" >&2
            exit 1
          fi

          echo "mode=${resolved}" >> "$GITHUB_OUTPUT"
          echo "Docker access mode: ${resolved}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Verify checkout integrity
        uses: optimizr-tech/optimizr-actions/.github/actions/checkout-integrity@v1
        with:
          expected_sha: ${{ github.sha }}

      - name: Set up Docker Buildx
        if: inputs.build_image
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Validate docker-compose files
        env:
          DOCKER_MODE: ${{ steps.docker.outputs.mode }}
        run: |
          set -euo pipefail

          docker_compose() {
            if [ "$DOCKER_MODE" = sudo ]; then
              sudo -n docker compose "$@"
            else
              docker compose "$@"
            fi
          }

          for f in ${{ inputs.compose_files }}; do
            if [ -f "$f" ]; then
              echo "📋 Validating $f..."
              docker_compose -f "$f" config --quiet
              echo "✅ $f is valid"
            else
              echo "⚠️  $f not found, skipping"
            fi
          done

      - name: Validate docker-compose merge stacks
        if: inputs.compose_stacks != ''
        env:
          DOCKER_MODE: ${{ steps.docker.outputs.mode }}
        run: |
          set -euo pipefail

          docker_compose() {
            if [ "$DOCKER_MODE" = sudo ]; then
              sudo -n docker compose "$@"
            else
              docker compose "$@"
            fi
          }

          for stack in ${{ inputs.compose_stacks }}; do
            [ -n "$stack" ] || continue
            IFS=',' read -ra files <<< "$stack"
            args=()
            label=""
            for f in "${files[@]}"; do
              f="${f#"${f%%[![:space:]]*}"}"
              f="${f%"${f##*[![:space:]]}"}"
              [ -n "$f" ] || continue
              if [ ! -f "$f" ]; then
                echo "::error::Compose stack file not found: $f (stack: $stack)" >&2
                exit 1
              fi
              args+=(-f "$f")
              label="${label:+$label + }$f"
            done
            if [ "${#args[@]}" -eq 0 ]; then
              echo "::warning::Empty compose stack after parse: $stack"
              continue
            fi
            echo "📋 Validating merge stack: $label"
            docker_compose "${args[@]}" config --quiet
            echo "✅ Merge stack valid: $label"
          done

      - name: Test container script syntax
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for glob in ${{ inputs.script_globs }}; do
            for script in $glob; do
              if [ -f "$script" ]; then
                echo "Checking $script..."
                bash -n "$script"
              fi
            done
          done
          echo "✅ All scripts have valid syntax"

      - name: Build Docker image (sanity check)
        if: inputs.build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ci-build-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean temporary Docker registry authentication
        if: always() && inputs.build_image
        shell: bash
        env:
          DOCKER_CONFIG_DIR: ${{ runner.temp }}/optimizr-compose-docker-config
        run: |
          set -euo pipefail
          rm -rf -- "$DOCKER_CONFIG_DIR"
