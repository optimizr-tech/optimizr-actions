name: _dependency-policy
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, ephemeral-pr, or trusted-pr
        required: false
        type: string
        default: none
      working_directory:
        description: Repository-relative project directory containing the package manifest and lockfile
        required: false
        type: string
        default: "."
      policy_file:
        description: Optional repository-relative policy JSON
        required: false
        type: string
        default: ""
      trivy_version:
        description: Controlled Trivy release
        required: false
        type: string
        default: v0.70.0
      node_version:
        description: Controlled Node.js version used for Node lock validation
        required: false
        type: string
        default: "24"
      npm_version:
        description: Controlled npm version used for package-lock validation
        required: false
        type: string
        default: "12.0.2"
      artifact_name:
        description: Evidence artifact name
        required: false
        type: string
        default: dependency-policy-evidence
      retention_days:
        description: Evidence retention period
        required: false
        type: number
        default: 30
permissions:
  contents: read
jobs:
  dependency-policy:
    name: Dependency and license policy
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 30
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(
              not isinstance(value, str) or not value for value in labels
          ):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit(
                      'hosted validation must use ["ubuntu-latest"] with mode=none'
                  )
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if (
                  os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"}
                  or os.environ["EVENT_REF"] != "refs/heads/main"
              ):
                  raise SystemExit(
                      "trusted-main requires push/workflow_dispatch on refs/heads/main"
                  )
          elif mode == "trusted-pr":
              if os.environ["EVENT_NAME"] != "pull_request":
                  raise SystemExit(
                      "trusted-pr requires pull_request on an authorized persistent runner"
                  )
          elif mode == "ephemeral-pr":
              if (
                  os.environ["EVENT_NAME"] != "pull_request"
                  or "ephemeral" not in labels
              ):
                  raise SystemExit(
                      "ephemeral-pr requires pull_request and an ephemeral runner label"
                  )
          else:
              raise SystemExit(
                  "self-hosted validation requires mode trusted-main, ephemeral-pr, or trusted-pr"
              )
          PY

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Derive tracked dependency paths
        id: checkout_paths
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          working_directory = os.environ["WORKING_DIRECTORY"] or "."
          root = PurePosixPath(working_directory)
          if (
              not working_directory
              or "\\" in working_directory
              or root.is_absolute()
              or ".." in root.parts
          ):
              raise SystemExit("working_directory must be repository relative")

          manifest_names = {
              "package.json",
              "package-lock.json",
              "pnpm-lock.yaml",
              "poetry.lock",
              "pyproject.toml",
              "uv.lock",
              "yarn.lock",
          }
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], cwd=os.environ["WORKSPACE"]
          ).decode("utf-8").split("\0")
          required = sorted(
              path
              for path in tracked
              if path
              and PurePosixPath(path).parent == root
              and PurePosixPath(path).name in manifest_names
          )
          if not any(
              PurePosixPath(path).name in {"package.json", "pyproject.toml"}
              for path in required
          ):
              raise SystemExit(
                  "working_directory has no tracked supported dependency manifest"
              )
          if len(required) > 256:
              raise SystemExit(
                  "dependency checkout path set exceeds the bounded limit of 256"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  "required_paths_json="
                  + json.dumps(required, separators=(",", ":"))
                  + "\n"
              )
          PY
      - name: Verify checkout integrity
        uses: optimizr-tech/optimizr-actions/.github/actions/checkout-integrity@v1
        with:
          expected_sha: ${{ github.sha }}
          required_paths_json: ${{ steps.checkout_paths.outputs.required_paths_json }}
      - name: Enforce dependency policy
        uses: optimizr-tech/optimizr-actions/.github/actions/dependency-policy@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          policy_file: ${{ inputs.policy_file }}
          trivy_version: ${{ inputs.trivy_version }}
          node_version: ${{ inputs.node_version }}
          npm_version: ${{ inputs.npm_version }}
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/dependency-policy
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
