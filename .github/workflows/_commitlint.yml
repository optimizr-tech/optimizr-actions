# Reusable: commitlint on pull_request commit range.
# Consume: optimizr-tech/optimizr-actions/.github/workflows/_commitlint.yml@v1
# Explicit SHAs override the caller pull_request event for non-PR dispatches.

name: _commitlint

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels; self-hosted PR validation must be ephemeral
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none or ephemeral-pr
        required: false
        type: string
        default: none
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      install_command:
        description: "Install command (npm ci / npm install / skip)"
        required: false
        type: string
        default: "npm ci"
      config_path:
        description: "Path to commitlint config relative to repo root"
        required: false
        type: string
        default: "commitlint.config.cjs"
      base_sha:
        description: "PR base SHA (caller: github.event.pull_request.base.sha)"
        required: false
        type: string
        default: ""
      head_sha:
        description: "PR head SHA (caller: github.event.pull_request.head.sha)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 5
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          ALLOW_TRUSTED_MAIN: "false"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(not isinstance(v, str) or not v for v in labels):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if os.environ["ALLOW_TRUSTED_MAIN"] != "true":
                  raise SystemExit("trusted-main is not allowed for this workflow")
              if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
                  raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          elif mode == "ephemeral-pr":
              if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
                  raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          else:
              raise SystemExit("self-hosted validation requires mode ephemeral-pr")
          PY

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        if: inputs.install_command != 'skip'
        run: ${{ inputs.install_command }}

      - name: Run commitlint on PR commits
        env:
          COMMITLINT_CONFIG: ${{ inputs.config_path }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="${INPUT_BASE_SHA:-$EVENT_BASE_SHA}"
          HEAD_SHA="${INPUT_HEAD_SHA:-$EVENT_HEAD_SHA}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Unable to resolve pull request base/head SHAs"
            exit 1
          fi
          if [ ! -f "${COMMITLINT_CONFIG}" ] && [ ! -f ".commitlintrc.cjs" ]; then
            echo "No commitlint config — copy templates/commitlint.config.cjs from optimizr-actions"
            exit 1
          fi
          npx --no-install commitlint --from="$BASE_SHA" --to="$HEAD_SHA" \
            || npx -y -p @commitlint/cli@21 -p @commitlint/config-conventional@21 commitlint --from="$BASE_SHA" --to="$HEAD_SHA"
