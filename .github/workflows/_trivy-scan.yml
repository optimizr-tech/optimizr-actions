# Reusable: trivy fs/image scan + table report como artifact.
name: _trivy-scan
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels; use ubuntu-latest or a governed self-hosted label set
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, or ephemeral-pr
        required: false
        type: string
        default: none
      trivy_cache_scope:
        description: repository keeps isolated caches; shared reuses the versioned vulnerability DB on a persistent runner
        required: false
        type: string
        default: shared
      scan_type:
        description: "Tipo: fs (filesystem) ou image"
        required: false
        type: string
        default: fs
      scan_ref:
        description: "Path/imagem alvo (. para fs, repo:tag para image)"
        required: false
        type: string
        default: "."
      severity:
        description: "Severidades a reportar"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      exit_code:
        description: "Exit code do trivy (1 falha CI quando achar; 0 só relata)"
        required: false
        type: string
        default: "0"
      upload_artifact:
        description: "Subir trivy-results.txt como artifact"
        required: false
        type: boolean
        default: true
      skip:
        description: Explicit optional caller skip; never derive this from a billing marker
        required: false
        type: boolean
        default: false
    outputs:
      result:
        description: passed only when the scan succeeds and its report is present
        value: ${{ inputs.skip && 'skipped' || jobs.scan.outputs.result }}
      conclusion:
        description: Trivy execution conclusion; skipped when the caller opts out
        value: ${{ inputs.skip && 'skipped' || jobs.scan.outputs.conclusion }}
      repository:
        description: Caller repository bound into the evidence manifest
        value: ${{ jobs.scan.outputs.repository }}
      run_id:
        description: GitHub Actions run ID bound into the evidence manifest
        value: ${{ jobs.scan.outputs.run_id }}
      run_attempt:
        description: GitHub Actions run attempt bound into the evidence manifest
        value: ${{ jobs.scan.outputs.run_attempt }}
      producer:
        description: Reusable workflow path and immutable producer SHA
        value: ${{ jobs.scan.outputs.producer }}
      producer_ref:
        description: Workflow source ref resolved for this reusable run
        value: ${{ jobs.scan.outputs.producer_ref }}
      producer_sha:
        description: Immutable SHA of the reusable workflow source
        value: ${{ jobs.scan.outputs.producer_sha }}
      source_sha:
        description: Exact caller checkout SHA verified before scanning
        value: ${{ jobs.scan.outputs.source_sha }}
      evidence_path:
        description: Raw Trivy report path inside the artifact
        value: ${{ jobs.scan.outputs.evidence_path }}
      evidence_sha256:
        description: SHA-256 of the raw Trivy report bytes
        value: ${{ jobs.scan.outputs.evidence_sha256 }}
      evidence_manifest_path:
        description: Evidence identity sidecar path inside the artifact
        value: ${{ jobs.scan.outputs.evidence_manifest_path }}
      evidence_artifact_name:
        description: Uploaded artifact name
        value: ${{ jobs.scan.outputs.evidence_artifact_name }}
      evidence_artifact_id:
        description: GitHub Actions artifact ID, empty when upload is disabled or fails
        value: ${{ jobs.scan.outputs.evidence_artifact_id }}
      evidence_artifact_digest:
        description: SHA-256 digest of the uploaded artifact archive
        value: ${{ jobs.scan.outputs.evidence_artifact_digest }}
permissions:
  contents: read
  actions: write
jobs:
  scan:
    if: ${{ !inputs.skip }}
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 15
    outputs:
      result: ${{ steps.evidence.outputs.result }}
      conclusion: ${{ steps.evidence.outputs.conclusion }}
      repository: ${{ steps.evidence.outputs.repository }}
      run_id: ${{ steps.evidence.outputs.run_id }}
      run_attempt: ${{ steps.evidence.outputs.run_attempt }}
      producer: ${{ steps.evidence.outputs.producer }}
      producer_ref: ${{ steps.evidence.outputs.producer_ref }}
      producer_sha: ${{ steps.evidence.outputs.producer_sha }}
      source_sha: ${{ steps.evidence.outputs.source_sha }}
      evidence_path: ${{ steps.evidence.outputs.evidence_path }}
      evidence_sha256: ${{ steps.evidence.outputs.evidence_sha256 }}
      evidence_manifest_path: ${{ steps.evidence.outputs.evidence_manifest_path }}
      evidence_artifact_name: ${{ steps.evidence.outputs.evidence_artifact_name }}
      evidence_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          ALLOW_TRUSTED_MAIN: "true"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(not isinstance(v, str) or not v for v in labels):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
                  raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          elif mode == "ephemeral-pr":
              if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
                  raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          else:
              raise SystemExit("self-hosted validation requires mode trusted-main or ephemeral-pr")
          PY
      - name: Checkout
        id: checkout_caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout reusable evidence helper
        id: checkout_evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-source
          persist-credentials: false
      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: optimizr-tech/optimizr-actions/.github/actions/trivy-scan@v1
        with:
          scan_type: ${{ inputs.scan_type }}
          scan_ref: ${{ inputs.scan_ref }}
          severity: ${{ inputs.severity }}
          exit_code: ${{ inputs.exit_code }}
          trivy_version: v0.74.0
          cache_scope: ${{ inputs.self_hosted_mode == 'ephemeral-pr' && 'repository' || inputs.trivy_cache_scope }}
      - name: Bind raw report to caller and producer identities
        id: evidence
        if: ${{ always() && steps.checkout_caller.outcome == 'success' && steps.checkout_evidence.outcome == 'success' }}
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          PRODUCER_REF: ${{ job.workflow_ref }}
          PRODUCER_SHA: ${{ job.workflow_sha }}
          PRODUCER_FILE: ${{ job.workflow_file_path }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
          SCAN_TYPE: ${{ inputs.scan_type }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          producer_source_sha="$(git -C .optimizr-actions-source rev-parse HEAD)"
          test "$producer_source_sha" = "$PRODUCER_SHA"
          test -f ".optimizr-actions-source/$PRODUCER_FILE"
          python3 .optimizr-actions-source/scripts/security_evidence.py trivy \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --producer-repository "$PRODUCER_REPOSITORY" \
            --producer-ref "$PRODUCER_REF" \
            --producer-sha "$PRODUCER_SHA" \
            --producer-file "$PRODUCER_FILE" \
            --source-sha "$source_sha" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --artifact-name trivy-security-results \
            --evidence-path trivy-results.txt \
            --manifest-path artifacts/trivy-evidence/manifest.json \
            --github-output "$GITHUB_OUTPUT" \
            --report-path trivy-results.txt \
            --scan-type "$SCAN_TYPE" \
            --scan-outcome "$SCAN_OUTCOME"
      - name: Upload Trivy scan results as artifact
        id: upload
        if: ${{ always() && inputs.upload_artifact && steps.evidence.outputs.evidence_manifest_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-security-results
          path: |
            trivy-results.txt
            artifacts/trivy-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30
