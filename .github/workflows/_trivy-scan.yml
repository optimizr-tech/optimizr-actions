# Reusable: trivy fs/image scan + table report como artifact.
name: _trivy-scan
on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels; use ubuntu-latest or a governed self-hosted label set
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, or ephemeral-pr
        required: false
        type: string
        default: none
      scan_type:
        description: "Tipo: fs (filesystem) ou image"
        required: false
        type: string
        default: fs
      scan_ref:
        description: "Path/imagem alvo (. para fs, repo:tag para image)"
        required: false
        type: string
        default: "."
      severity:
        description: "Severidades a reportar"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      exit_code:
        description: "Exit code do trivy (1 falha CI quando achar; 0 só relata)"
        required: false
        type: string
        default: "0"
      upload_artifact:
        description: "Subir trivy-results.txt como artifact"
        required: false
        type: boolean
        default: true
      skip:
        description: Explicit optional caller skip; never derive this from a billing marker
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  scan:
    if: ${{ !inputs.skip }}
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 15
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          ALLOW_TRUSTED_MAIN: "true"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(not isinstance(v, str) or not v for v in labels):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
                  raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          elif mode == "ephemeral-pr":
              if os.environ["EVENT_NAME"] != "pull_request" or "ephemeral" not in labels:
                  raise SystemExit("ephemeral-pr requires pull_request and an ephemeral runner label")
          else:
              raise SystemExit("self-hosted validation requires mode trusted-main or ephemeral-pr")
          PY
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Run Trivy vulnerability scanner
        uses: optimizr-tech/optimizr-actions/.github/actions/trivy-scan@v1
        with:
          scan_type: ${{ inputs.scan_type }}
          scan_ref: ${{ inputs.scan_ref }}
          severity: ${{ inputs.severity }}
          exit_code: ${{ inputs.exit_code }}
          trivy_version: v0.70.0
      - name: Upload Trivy scan results as artifact
        if: always() && inputs.upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-security-results
          path: trivy-results.txt
          retention-days: 30
