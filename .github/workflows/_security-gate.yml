name: _security-gate

on:
  workflow_call:
    inputs:
      runner_json:
        description: "JSON runner labels, e.g. [\"ubuntu-latest\"] or [\"self-hosted\",\"Linux\",\"security\"]"
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none, trusted-main, ephemeral-pr, or trusted-pr
        required: false
        type: string
        default: none
      scan_type:
        description: "Scan type: fs or image"
        required: false
        type: string
        default: fs
      scan_ref:
        description: "Filesystem target or fallback image reference"
        required: false
        type: string
        default: "."
      image_refs:
        description: "Whitespace/newline separated image references or IDs"
        required: false
        type: string
        default: ""
      docker_mode:
        description: "Local image access mode: auto, direct, or sudo"
        required: false
        type: string
        default: auto
      severity:
        description: "Blocking severities"
        required: false
        type: string
        default: "HIGH,CRITICAL"
      ignore_unfixed:
        description: "Explicitly ignore vulnerabilities without fixes"
        required: false
        type: boolean
        default: false
      exceptions_file:
        description: "Optional Optimizr JSON exception policy"
        required: false
        type: string
        default: ""
      trivy_version:
        description: "Controlled Trivy release"
        required: false
        type: string
        default: "v0.70.0"
      db_max_age_hours:
        description: "Maximum vulnerability DB download age"
        required: false
        type: number
        default: 30
      evidence_dir:
        description: "Evidence directory"
        required: false
        type: string
        default: artifacts/security-gate
      remediation_window_enabled:
        description: "Enable governed remediation-window evaluation"
        required: false
        type: boolean
        default: false
      remediation_window_policy_file:
        description: "Repository-relative remediation-window policy JSON"
        required: false
        type: string
        default: ""
      remediation_window_service_scope:
        description: "Declared service scope for remediation-window evaluation"
        required: false
        type: string
        default: ""
      remediation_window_exposure_criticality:
        description: "Declared exposure/criticality for remediation-window evaluation"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Uploaded evidence artifact name"
        required: false
        type: string
        default: security-gate-evidence
      retention_days:
        description: "Evidence retention period"
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  security-gate:
    name: Blocking security gate
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 30
    outputs:
      remediation_window_allowed: ${{ steps.security-gate.outputs.remediation_window_allowed }}
      remediation_window_uncovered: ${{ steps.security-gate.outputs.remediation_window_uncovered }}
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_JSON"])
          if not isinstance(labels, list) or not labels or any(
              not isinstance(value, str) or not value for value in labels
          ):
              raise SystemExit("runner_json must be a non-empty JSON string array")
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit(
                      'hosted validation must use ["ubuntu-latest"] with mode=none'
                  )
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode == "trusted-main":
              if (
                  os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"}
                  or os.environ["EVENT_REF"] != "refs/heads/main"
              ):
                  raise SystemExit(
                      "trusted-main requires push/workflow_dispatch on refs/heads/main"
                  )
          elif mode == "trusted-pr":
              if os.environ["EVENT_NAME"] != "pull_request":
                  raise SystemExit(
                      "trusted-pr requires pull_request on an authorized persistent runner"
                  )
          elif mode == "ephemeral-pr":
              if (
                  os.environ["EVENT_NAME"] != "pull_request"
                  or "ephemeral" not in labels
              ):
                  raise SystemExit(
                      "ephemeral-pr requires pull_request and an ephemeral runner label"
                  )
          else:
              raise SystemExit(
                  "self-hosted validation requires mode trusted-main, ephemeral-pr, or trusted-pr"
              )
          PY

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run portable security gate
        id: security-gate
        continue-on-error: true
        uses: optimizr-tech/optimizr-actions/.github/actions/security-gate@v1
        with:
          scan_type: ${{ inputs.scan_type }}
          scan_ref: ${{ inputs.scan_ref }}
          image_refs: ${{ inputs.image_refs }}
          docker_mode: ${{ inputs.docker_mode }}
          severity: ${{ inputs.severity }}
          ignore_unfixed: ${{ inputs.ignore_unfixed }}
          exceptions_file: ${{ inputs.exceptions_file }}
          trivy_version: ${{ inputs.trivy_version }}
          db_max_age_hours: ${{ inputs.db_max_age_hours }}
          evidence_dir: ${{ inputs.evidence_dir }}
          remediation_window_enabled: ${{ inputs.remediation_window_enabled }}
          remediation_window_policy_file: ${{ inputs.remediation_window_policy_file }}
          remediation_window_service_scope: ${{ inputs.remediation_window_service_scope }}
          remediation_window_exposure_criticality: ${{ inputs.remediation_window_exposure_criticality }}

      - name: Enforce governed security decision
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.security-gate.outcome }}
          CLASSIFICATION: ${{ steps.security-gate.outputs.classification }}
          WINDOW_ALLOWED: ${{ steps.security-gate.outputs.remediation_window_allowed }}
          WINDOW_UNCOVERED: ${{ steps.security-gate.outputs.remediation_window_uncovered }}
          MISCONFIGURATIONS: ${{ steps.security-gate.outputs.misconfiguration_count }}
          SECRETS: ${{ steps.security-gate.outputs.secret_count }}
          FAILURE_REASON: ${{ steps.security-gate.outputs.failure_reason }}
          WINDOW_FAILURE_REASON: ${{ steps.security-gate.outputs.remediation_window_failure_reason }}
        run: |
          set -euo pipefail
          if [ "$GATE_OUTCOME" = success ]; then
            exit 0
          fi
          if [ "$CLASSIFICATION" = actionable_vulnerability ] && \
             [ "$WINDOW_ALLOWED" = true ] && [ "${WINDOW_UNCOVERED:-1}" = 0 ] && \
             [ "${MISCONFIGURATIONS:-0}" = 0 ] && [ "${SECRETS:-0}" = 0 ]; then
            echo "::warning title=Governed remediation window::Security findings remain actionable but every blocking finding is covered by an active reviewed window."
            exit 0
          fi
          reason="${WINDOW_FAILURE_REASON:-${FAILURE_REASON:-none}}"
          echo "::error::Security gate blocked: classification=${CLASSIFICATION:-gate_error} failure_reason=$reason" >&2
          exit 1

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.evidence_dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
