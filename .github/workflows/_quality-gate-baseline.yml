name: _quality-gate-baseline

# Emit quality-gate-baseline artifact on main after producer jobs succeed.

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      self_hosted_mode:
        description: none or trusted-main
        required: false
        type: string
        default: none
      preset:
        description: "Artifact layout preset: python-backend | monorepo-serve"
        required: true
        type: string
      infra_ops_ref:
        description: Deprecated compatibility input; quality-gate code is owned by optimizr-actions
        required: false
        type: string
        default: v1
      baseline_retention_days:
        description: Retention for quality-gate-baseline artifact
        required: false
        type: number
        default: 90
    secrets:
      OPTIMIZR_INFRA_OPS_READ_TOKEN:
        description: Deprecated compatibility secret; no longer read
        required: false

permissions:
  contents: read
  actions: read

jobs:
  quality-gate-baseline:
    name: Quality gate baseline (main)
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: 10
    steps:
      - name: Validate runner trust contract
        shell: bash
        env:
          RUNNER_JSON: ${{ inputs.runner_json }}
          SELF_HOSTED_MODE: ${{ inputs.self_hosted_mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          labels = json.loads(os.environ["RUNNER_JSON"])
          mode = os.environ["SELF_HOSTED_MODE"]
          if "self-hosted" not in labels:
              if labels != ["ubuntu-latest"] or mode != "none":
                  raise SystemExit('hosted validation must use ["ubuntu-latest"] with mode=none')
              raise SystemExit(0)
          if "Linux" not in labels:
              raise SystemExit("self-hosted validation requires the Linux label")
          if mode != "trusted-main":
              raise SystemExit("self-hosted quality baseline requires trusted-main")
          if os.environ["EVENT_NAME"] not in {"push", "workflow_dispatch"} or os.environ["EVENT_REF"] != "refs/heads/main":
              raise SystemExit("trusted-main requires push/workflow_dispatch on refs/heads/main")
          PY
      - name: Checkout caller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Checkout exact quality-gate implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .optimizr-actions-source
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          # docker/build-push-action publishes a .dockerbuild record artifact
          # for the build summary. It is not a quality-gate input and the
          # artifact action cannot reliably extract it with the metric set.
          pattern: "!*.dockerbuild"

      - name: Build baseline JSON
        env:
          PYTHONPATH: ${{ github.workspace }}/.optimizr-actions-source
        run: |
          set -euo pipefail
          case "${{ inputs.preset }}" in
            python-backend|monorepo-serve) ;;
            *) echo "unsupported quality-gate preset" >&2; exit 2 ;;
          esac
          python -m scripts.quality_gate.run \
            --artifacts-dir artifacts \
            --head-sha "${GITHUB_SHA}" \
            emit-baseline > quality-gate-baseline.json
          python -m json.tool quality-gate-baseline.json > /dev/null

      - name: Upload baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-gate-baseline
          path: quality-gate-baseline.json
          retention-days: ${{ inputs.baseline_retention_days }}
          if-no-files-found: error
