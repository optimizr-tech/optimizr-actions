name: Optimizr SAST gate
description: Run immutable Semgrep with allowlisted local rules and expiring exact baselines
inputs:
  profile:
    description: python, typescript, or all
    required: false
    default: all
  baseline_file:
    description: Optional repository-relative baseline JSON
    required: false
    default: ""
  evidence_dir:
    description: Sanitized evidence directory
    required: false
    default: artifacts/sast-gate
outputs:
  evidence_dir:
    description: Evidence directory
    value: ${{ inputs.evidence_dir }}
runs:
  using: composite
  steps:
    - name: Resolve uv version
      id: uv-version
      shell: bash
      env:
        # Organization default; consumers override it with tool.uv.required-version
        # (pyproject.toml) or required-version (uv.toml). An exact version lets
        # setup-uv hit the self-hosted tool cache instead of fetching the
        # "latest" manifest over the network on every job.
        DEFAULT_UV_VERSION: "0.13.7"
      run: |
        set -euo pipefail
        root="${GITHUB_WORKSPACE}"
        declared=false
        if [ -f "$root/uv.toml" ] && grep -Eq '^[[:space:]]*required-version[[:space:]]*=' "$root/uv.toml"; then
          declared=true
        elif [ -f "$root/pyproject.toml" ] && awk '/^\[tool\.uv\][[:space:]]*$/{f=1;next} /^\[/{f=0} f && /^[[:space:]]*required-version[[:space:]]*=/{found=1} END{exit !found}' "$root/pyproject.toml"; then
          declared=true
        fi
        if [ "$declared" = true ]; then
          echo "version=" >> "$GITHUB_OUTPUT"
        else
          echo "version=$DEFAULT_UV_VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        version: ${{ steps.uv-version.outputs.version }}
        python-version: "3.12"

    - name: Install controlled Semgrep
      shell: bash
      run: |
        set -euo pipefail
        export HOME="${HOME:-$(cd ~ 2>/dev/null && pwd || echo /home/${USER:-runner})}"
        # --force: the persistent self-hosted runner reuses HOME, so the tool
        # may already exist; without --force uv exits 2 (Executables already exist).
        uv tool install --force 'semgrep==1.170.0'
        export PATH="$HOME/.local/bin:$PATH"
        test "$(semgrep --version | head -n 1)" = "1.170.0"
    - name: Run controlled local SAST profile
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        BASELINE_FILE: ${{ inputs.baseline_file }}
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        SEMGREP_METRICS: --metrics=off
      run: |
        set -euo pipefail
        export HOME="${HOME:-$(cd ~ 2>/dev/null && pwd || echo /home/${USER:-runner})}"
        export PATH="$HOME/.local/bin:$PATH"
        action_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        baseline=""
        if [ -n "$BASELINE_FILE" ]; then
          if [[ "$BASELINE_FILE" = /* || "$BASELINE_FILE" = *".."* ]]; then
            echo "::error::baseline_file must be repository relative"; exit 2
          fi
          baseline="$(realpath -e "$GITHUB_WORKSPACE/$BASELINE_FILE")"
          case "$baseline" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "::error::baseline_file resolves outside the repository"; exit 2 ;;
          esac
        fi
        python3 "$action_root/scripts/sast_gate/runner.py" \
          --root "$GITHUB_WORKSPACE" \
          --rules-dir "$action_root/rules/sast" \
          --profile "$PROFILE" \
          --baseline "$baseline" \
          --evidence-dir "$EVIDENCE_DIR" \
          --semgrep semgrep \
          --semgrep-version 1.170.0 \
          --repository "$GITHUB_REPOSITORY" \
          --head-sha "$GITHUB_SHA"
