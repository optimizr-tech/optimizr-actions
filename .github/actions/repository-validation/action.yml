name: Optimizr repository validation
description: Execute a repository-owned executable with argv-safe, commit-bound evidence
inputs:
  script_path:
    description: Relative executable path inside the checked-out repository
    required: true
  args_json:
    description: JSON array of literal command arguments
    required: false
    default: "[]"
  evidence_path:
    description: Sanitized evidence JSON path
    required: false
    default: artifacts/repository-validation/evidence.json
  repository:
    description: Optional repository identity override recorded in evidence
    required: false
    default: ""
  head_sha:
    description: Optional exact candidate commit SHA override
    required: false
    default: ""
  base_sha:
    description: Optional base commit SHA
    required: false
    default: ""
  image_refs_json:
    description: Optional JSON array of local image references whose immutable IDs are recorded
    required: false
    default: "[]"
  timeout_seconds:
    description: Validation timeout from 1 to 3600 seconds
    required: false
    default: "900"
  retry_attempts:
    description: Maximum attempts for an explicitly declared transient dependency failure (1-3)
    required: false
    default: "1"
  retry_backoff_seconds:
    description: Linear backoff base in seconds for transient dependency retries (0-60)
    required: false
    default: "5"
  require_trusted_ref:
    description: Require candidate to be reachable from trusted_ref
    required: false
    default: "true"
  trusted_ref:
    description: Full branch ref trusted by persistent runners
    required: false
    default: refs/heads/main
outputs:
  evidence_path:
    description: Evidence JSON produced by the command runner
    value: ${{ steps.run.outputs.evidence_path }}
  result:
    description: passed or failed
    value: ${{ steps.run.outputs.result }}
  failure_kind:
    description: Sanitized final failure classification from the validation evidence
    value: ${{ steps.run.outputs.failure_kind }}
  attempt_count:
    description: Number of validation attempts recorded in the evidence
    value: ${{ steps.run.outputs.attempt_count }}
runs:
  using: composite
  steps:
    - name: Validate candidate trust boundary
      if: inputs.require_trusted_ref == 'true'
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        HEAD_SHA: ${{ inputs.head_sha }}
        TRUSTED_REF: ${{ inputs.trusted_ref }}
        VALIDATION_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        candidate_sha="${HEAD_SHA:-$GITHUB_SHA}"
        python3 "$GITHUB_ACTION_PATH/../../../scripts/repository_validation/runner.py" check-trust \
          --workspace "$WORKSPACE" \
          --candidate-sha "$candidate_sha" \
          --trusted-ref "$TRUSTED_REF"
    - name: Execute repository validation
      id: run
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        SCRIPT_PATH: ${{ inputs.script_path }}
        ARGS_JSON: ${{ inputs.args_json }}
        EVIDENCE_PATH: ${{ inputs.evidence_path }}
        REPOSITORY_INPUT: ${{ inputs.repository }}
        HEAD_SHA_INPUT: ${{ inputs.head_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        IMAGE_REFS_JSON: ${{ inputs.image_refs_json }}
        RETRY_ATTEMPTS: ${{ inputs.retry_attempts }}
        RETRY_BACKOFF_SECONDS: ${{ inputs.retry_backoff_seconds }}
      run: |
        repository="${REPOSITORY_INPUT:-$GITHUB_REPOSITORY}"
        head_sha="${HEAD_SHA_INPUT:-$GITHUB_SHA}"
        set +e
        python3 "$GITHUB_ACTION_PATH/../../../scripts/repository_validation/runner.py" run \
          --workspace "$WORKSPACE" \
          --script-path "$SCRIPT_PATH" \
          --args-json "$ARGS_JSON" \
          --evidence "$EVIDENCE_PATH" \
          --repository "$repository" \
          --head-sha "$head_sha" \
          --base-sha "$BASE_SHA" \
          --timeout-seconds "$TIMEOUT_SECONDS" \
          --retry-attempts "$RETRY_ATTEMPTS" \
          --retry-backoff-seconds "$RETRY_BACKOFF_SECONDS" \
          --image-refs-json "$IMAGE_REFS_JSON"
        status=$?
        set -e
        echo "evidence_path=$EVIDENCE_PATH" >> "$GITHUB_OUTPUT"
        failure_kind="validation_contract_error"
        attempt_count=0
        if [ -s "$EVIDENCE_PATH" ]; then
          metadata="$(python3 -c 'import json,sys; result=json.load(open(sys.argv[1], encoding="utf-8"))["result"]; print("%s\\t%s" % (result.get("failure_kind", "validation_contract_error"), result.get("attempt_count", 0)))' "$EVIDENCE_PATH" 2>/dev/null || printf '%s\\t%s\\n' validation_contract_error 0)"
          if [ -n "$metadata" ]; then
            IFS=$'\t' read -r failure_kind attempt_count <<< "$metadata"
          fi
        fi
        echo "failure_kind=$failure_kind" >> "$GITHUB_OUTPUT"
        echo "attempt_count=$attempt_count" >> "$GITHUB_OUTPUT"
        if [ "$status" -eq 0 ]; then
          echo "result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "result=failed" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
