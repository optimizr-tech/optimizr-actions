name: Quality gate scripts
description: Materialize the quality_gate package shipped by this exact optimizr-actions revision

inputs:
  infra_ops_ref:
    description: Deprecated compatibility input; ignored
    required: false
    default: v1
  infra_ops_read_token:
    description: Deprecated compatibility input; ignored
    required: false
    default: ''
  python_version:
    description: Python version for setup-python
    required: false
    default: "3.12"

outputs:
  scripts_path:
    description: Absolute path containing scripts/quality_gate
    value: ${{ steps.source.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Materialize exact quality-gate package
      id: source
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        from pathlib import Path
        import shutil

        action_path = Path(os.environ["ACTION_PATH"]).resolve(strict=True)
        repository_root = action_path.parents[2]
        source = (repository_root / "scripts" / "quality_gate").resolve(strict=True)
        source.relative_to(repository_root)
        if not source.is_dir() or not (source / "run.py").is_file():
            raise SystemExit("quality-gate package is missing from this Actions revision")

        destination_root = (Path(os.environ["GITHUB_WORKSPACE"]) / "_qg").resolve()
        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
        destination_root.relative_to(workspace)
        if destination_root.exists():
            shutil.rmtree(destination_root)
        destination = destination_root / "scripts" / "quality_gate"
        destination.parent.mkdir(parents=True, exist_ok=True)
        shutil.copytree(source, destination, symlinks=False)

        output = Path(os.environ["GITHUB_OUTPUT"])
        with output.open("a", encoding="utf-8") as handle:
            handle.write(f"path={destination_root}\n")
        PY
