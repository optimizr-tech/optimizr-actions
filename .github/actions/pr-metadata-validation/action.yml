name: PR metadata validation
description: Validate PR title, body and commit subjects without checking out candidate code
inputs:
  token:
    description: Read-only GitHub token used to fetch PR metadata
    required: true
  repository:
    description: Repository in owner/name form
    required: true
  pr_number:
    description: Pull request number
    required: true
  pr_title:
    description: Pull request title
    required: true
  pr_body:
    description: Pull request body
    required: true
  base_sha:
    description: Expected pull request base SHA
    required: true
  head_sha:
    description: Expected pull request head SHA
    required: true
outputs:
  result:
    description: passed when all metadata checks succeed
    value: ${{ steps.validate.outputs.result }}
  commit_count:
    description: Number of PR commits inspected
    value: ${{ steps.validate.outputs.commit_count }}
runs:
  using: composite
  steps:
    - name: Validate trusted PR metadata
      id: validate
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_PR_TITLE: ${{ inputs.pr_title }}
        INPUT_PR_BODY: ${{ inputs.pr_body }}
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
        INPUT_HEAD_SHA: ${{ inputs.head_sha }}
      run: python3 "$GITHUB_ACTION_PATH/validate.py"
