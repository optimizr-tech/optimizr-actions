# Composite action: prune Docker safe (containers/images/builder; nunca volumes/networks).
# Uso: uses: optimizr-tech/optimizr-actions/.github/actions/docker-prune-safe@f042163c0d83712736bbc9cc168c4f9f98c488cf

name: docker-prune-safe
description: Prune containers/images/builder + workspace temp; nunca toca volumes ou networks

inputs:
  image_age_threshold:
    description: "Idade mínima pra image prune untagged (formato Docker filter, ex 24h)"
    required: false
    default: "24h"
  docker_mode:
    description: "Local Docker access mode: direct, sudo, or auto"
    required: false
    default: "sudo"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE_AGE: ${{ inputs.image_age_threshold }}
        DOCKER_MODE: ${{ inputs.docker_mode }}
      run: |
        set -euo pipefail
        case "$DOCKER_MODE" in
          direct|sudo|auto) ;;
          *)
            echo "Unsupported docker_mode: $DOCKER_MODE" >&2
            exit 2
            ;;
        esac
        docker_cmd() {
          case "$DOCKER_MODE" in
            direct) command docker "$@" ;;
            sudo|auto) command sudo docker "$@" ;;
          esac
        }
        echo "::group::Disk before cleanup"
        df -h / || true
        docker_cmd system df || true
        echo "::endgroup::"

        # All repository runners share one Docker daemon on the VPS. Serialize
        # cleanup across those runners so one job cannot prune while another
        # cleanup is inspecting the same daemon. If flock is unavailable or
        # the host lock cannot be acquired, skip cleanup rather than guessing.
        if ! command -v flock >/dev/null 2>&1; then
          echo "::warning::flock is unavailable; skipping Docker cleanup"
          exit 0
        fi
        umask 077
        lock_file="${DOCKER_PRUNE_LOCK_FILE:-/tmp/optimizr-docker-prune-safe.lock}"
        if ! exec 9>>"$lock_file"; then
          echo "::warning::cannot open Docker cleanup lock; skipping cleanup"
          exit 0
        fi
        if ! flock -w 60 9; then
          echo "::warning::Docker cleanup lock is busy; skipping cleanup"
          exit 0
        fi

        docker_cmd container prune -f
        docker_cmd image prune -f
        docker_cmd image prune -af --filter "until=${IMAGE_AGE}"
        docker_cmd builder prune -af --filter "until=${IMAGE_AGE}"

        if [ -n "${RUNNER_WORKSPACE:-}" ]; then
          runner_root="$(dirname "$RUNNER_WORKSPACE")"
          if [ "$DOCKER_MODE" = direct ]; then
            find "$runner_root/_temp" -mindepth 1 -maxdepth 1 -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          else
            sudo find "$runner_root/_temp" -mindepth 1 -maxdepth 1 -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          fi
        fi

        echo "::group::Disk after cleanup"
        df -h / || true
        docker_cmd system df || true
        echo "::endgroup::"
