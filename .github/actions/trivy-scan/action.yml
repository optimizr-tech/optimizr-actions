name: Optimizr Trivy scan
description: Run a compatibility Trivy scan with a governed Trivy cache

inputs:
  scan_type:
    description: "Trivy scan type: fs or image"
    required: false
    default: fs
  scan_ref:
    description: "Filesystem path or image reference"
    required: false
    default: "."
  severity:
    description: "Severities to report"
    required: false
    default: "CRITICAL,HIGH"
  exit_code:
    description: "Trivy exit code when findings match the selected severities"
    required: false
    default: "0"
  trivy_version:
    description: Controlled Trivy release
    required: false
    default: v0.74.0
  cache_scope:
    description: "repository preserves isolated caches; shared reuses the versioned vulnerability DB on the same persistent cache home while keeping scan caches isolated"
    required: false
    default: repository

runs:
  using: composite
  steps:
    - name: Install controlled Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: ${{ inputs.trivy_version }}
        cache: "false"
        path: ${{ runner.temp }}/optimizr-trivy/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    - name: Run compatibility scan with governed cache
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan_type }}
        SCAN_REF: ${{ inputs.scan_ref }}
        SEVERITY: ${{ inputs.severity }}
        EXIT_CODE: ${{ inputs.exit_code }}
        TRIVY_VERSION: ${{ inputs.trivy_version }}
        CACHE_SCOPE: ${{ inputs.cache_scope }}
      run: |
        set -euo pipefail
        action_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        source "$action_root/scripts/security_gate/trivy-cache.sh"
        trivy_cache_setup "$action_root" "$GITHUB_REPOSITORY" "$TRIVY_VERSION" "$CACHE_SCOPE" 30 14
        cache_dir="$OPTIMIZR_TRIVY_CACHE_DIR"
        case "$SCAN_TYPE" in
          fs) command_name=filesystem ;;
          image) command_name=image ;;
          *) echo "::error::scan_type must be fs or image" >&2; exit 2 ;;
        esac
        trivy --cache-dir "$cache_dir" "$command_name" "${OPTIMIZR_TRIVY_DB_ARGS[@]}" "$SCAN_REF" \
          --format table \
          --output "$GITHUB_WORKSPACE/trivy-results.txt" \
          --severity "$SEVERITY" \
          --exit-code "$EXIT_CODE"
