# Composite: shared uv sync + lint + pytest steps for _python-uv-test.yml.
# Not intended for direct consumer use — call the reusable workflow instead.

name: python-uv-test-steps
description: uv sync, ruff, optional mypy/extra steps, pytest with coverage gate

inputs:
  python_version:
    description: Python version for setup-uv
    required: false
    default: "3.12"
  working_directory:
    description: Relative repository path containing the Python project
    required: false
    default: "."
  sync_all_extras:
    description: Run uv sync --all-extras instead of uv sync
    required: false
    default: "false"
  extras:
    description: Space-separated extras for uv sync (--extra X)
    required: false
    default: ""
  ruff_check:
    description: Run ruff check
    required: false
    default: "true"
  ruff_paths:
    description: Paths passed to ruff check
    required: false
    default: "."
  mypy_enabled:
    description: Run mypy after ruff
    required: false
    default: "false"
  mypy_target:
    description: Target path for mypy
    required: false
    default: "app/"
  extra_steps:
    description: Multiline shell script run after lint, before pytest
    required: false
    default: ""
  coverage_min:
    description: Minimum coverage percentage (--cov-fail-under)
    required: false
    default: "80"
  coverage_gate_enabled:
    description: Enforce the coverage threshold in this job; sharded callers gate after merge
    required: false
    default: "true"
  cov_package:
    description: Package for --cov= (empty uses bare --cov)
    required: false
    default: ""
  coverage_branch:
    description: Enable --cov-branch
    required: false
    default: "false"
  coverage_xml_path:
    description: Path for Cobertura XML report (empty uses default xml report)
    required: false
    default: ""
  coverage_json_path:
    description: Path for JSON coverage report (empty skips json report)
    required: false
    default: ""
  pytest_args:
    description: Extra arguments appended to pytest
    required: false
    default: ""
  pytest_env:
    description: Multiline KEY=VAL exported before pytest
    required: false
    default: ""
  upload_artifact_name:
    description: Artifact name for coverage upload (empty skips upload)
    required: false
    default: ""
  upload_artifact_paths:
    description: Multiline paths for coverage artifact
    required: false
    default: ""
  shard_count:
    description: Total number of pytest shards; 1 preserves the legacy command
    required: false
    default: "1"
  shard_index:
    description: One-based stable pytest shard index
    required: false
    default: "1"
  shard_distribution:
    description: count for equal fallback distribution or duration for a committed durations file
    required: false
    default: "count"
  shard_durations_path:
    description: Repository path containing pytest-split duration data when distribution is duration
    required: false
    default: ".test_durations"
  pytest_split_version:
    description: Exact pytest-split version used only when sharding is enabled
    required: false
    default: "0.11.0"

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: ${{ inputs.python_version }}
        enable-cache: true

    - name: Validate working directory
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        if [ -z "$WORKING_DIRECTORY" ] || [[ "$WORKING_DIRECTORY" = /* ]] || [[ "$WORKING_DIRECTORY" == *..* ]]; then
          echo "working_directory must be a non-empty repository-relative path without traversal" >&2
          exit 1
        fi
        if [ ! -d "$WORKING_DIRECTORY" ]; then
          echo "working_directory does not exist: $WORKING_DIRECTORY" >&2
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      env:
        SYNC_ALL_EXTRAS: ${{ inputs.sync_all_extras }}
        EXTRAS: ${{ inputs.extras }}
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        if [ "$SYNC_ALL_EXTRAS" = "true" ]; then
          uv sync --all-extras
        elif [ -n "$EXTRAS" ]; then
          EXTRA_ARGS=()
          for e in $EXTRAS; do
            EXTRA_ARGS+=(--extra "$e")
          done
          uv sync "${EXTRA_ARGS[@]}"
        else
          uv sync
        fi

    - name: Ruff check
      if: inputs.ruff_check == 'true'
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      working-directory: ${{ inputs.working_directory }}
      run: uv run ruff check ${{ inputs.ruff_paths }}

    - name: Type check (mypy)
      if: inputs.mypy_enabled == 'true'
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      working-directory: ${{ inputs.working_directory }}
      run: uv run mypy ${{ inputs.mypy_target }}

    - name: Extra steps
      if: inputs.extra_steps != ''
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        ${{ inputs.extra_steps }}

    - name: Pytest with coverage
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        COVERAGE_MIN: ${{ inputs.coverage_min }}
        COVERAGE_GATE_ENABLED: ${{ inputs.coverage_gate_enabled }}
        COV_PACKAGE: ${{ inputs.cov_package }}
        COVERAGE_BRANCH: ${{ inputs.coverage_branch }}
        COVERAGE_XML_PATH: ${{ inputs.coverage_xml_path }}
        COVERAGE_JSON_PATH: ${{ inputs.coverage_json_path }}
        PYTEST_ARGS: ${{ inputs.pytest_args }}
        PYTEST_ENV: ${{ inputs.pytest_env }}
        SHARD_COUNT: ${{ inputs.shard_count }}
        SHARD_INDEX: ${{ inputs.shard_index }}
        SHARD_DISTRIBUTION: ${{ inputs.shard_distribution }}
        SHARD_DURATIONS_PATH: ${{ inputs.shard_durations_path }}
        PYTEST_SPLIT_VERSION: ${{ inputs.pytest_split_version }}
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        if [ -n "$PYTEST_ENV" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            export "$line"
          done <<< "$PYTEST_ENV"
        fi

        case "$SHARD_COUNT" in
          ''|*[!0-9]*)
            echo "shard_count must be a positive integer" >&2
            exit 1
            ;;
        esac
        if [ "$SHARD_COUNT" -lt 1 ]; then
          echo "shard_count must be >= 1" >&2
          exit 1
        fi

        PYTEST_COMMAND=(uv run pytest)
        PYTEST_SHARD_ARGS=()
        if [ "$SHARD_COUNT" -gt 1 ]; then
          case "$SHARD_INDEX" in
            ''|*[!0-9]*)
              echo "shard_index must be a positive integer" >&2
              exit 1
              ;;
          esac
          if [ "$SHARD_INDEX" -lt 1 ] || [ "$SHARD_INDEX" -gt "$SHARD_COUNT" ]; then
            echo "shard_index must be between 1 and shard_count" >&2
            exit 1
          fi
          if [ -z "$PYTEST_SPLIT_VERSION" ]; then
            echo "pytest_split_version is required when sharding is enabled" >&2
            exit 1
          fi

          PYTEST_COMMAND=(uv run --with "pytest-split==$PYTEST_SPLIT_VERSION" pytest)
          case "$SHARD_DISTRIBUTION" in
            count)
              EMPTY_DURATIONS_PATH="$RUNNER_TEMP/optimizr-empty-test-durations.json"
              printf '{}\n' > "$EMPTY_DURATIONS_PATH"
              PYTEST_SHARD_ARGS+=(
                --splits "$SHARD_COUNT"
                --group "$SHARD_INDEX"
                --splitting-algorithm least_duration
                --durations-path "$EMPTY_DURATIONS_PATH"
              )
              ;;
            duration)
              if [ ! -f "$SHARD_DURATIONS_PATH" ]; then
                echo "duration sharding requires an existing $SHARD_DURATIONS_PATH" >&2
                exit 1
              fi
              PYTEST_SHARD_ARGS+=(
                --splits "$SHARD_COUNT"
                --group "$SHARD_INDEX"
                --splitting-algorithm least_duration
                --durations-path "$SHARD_DURATIONS_PATH"
              )
              ;;
            *)
              echo "shard_distribution must be count or duration" >&2
              exit 1
              ;;
          esac
          # Each shard emits an independent coverage.py data file. The aggregate
          # job merges these files before applying the caller's threshold.
          export COVERAGE_FILE=".coverage.shard-$SHARD_INDEX"
        fi

        COV_FLAG="--cov"
        if [ -n "$COV_PACKAGE" ]; then
          COV_FLAG="--cov=$COV_PACKAGE"
        fi

        REPORT_ARGS="--cov-report=term-missing"
        if [ -n "$COVERAGE_XML_PATH" ]; then
          REPORT_ARGS="$REPORT_ARGS --cov-report=xml:$COVERAGE_XML_PATH"
        else
          REPORT_ARGS="$REPORT_ARGS --cov-report=xml"
        fi
        if [ -n "$COVERAGE_JSON_PATH" ]; then
          REPORT_ARGS="$REPORT_ARGS --cov-report=json:$COVERAGE_JSON_PATH"
        fi

        BRANCH_FLAG=""
        if [ "$COVERAGE_BRANCH" = "true" ]; then
          BRANCH_FLAG="--cov-branch"
        fi

        COVERAGE_GATE_FLAG=""
        if [ "$COVERAGE_GATE_ENABLED" = "true" ]; then
          COVERAGE_GATE_FLAG="--cov-fail-under=$COVERAGE_MIN"
        fi

        # shellcheck disable=SC2086
        "${PYTEST_COMMAND[@]}" \
          $COV_FLAG \
          $BRANCH_FLAG \
          $REPORT_ARGS \
          $COVERAGE_GATE_FLAG \
          "${PYTEST_SHARD_ARGS[@]}" \
          $PYTEST_ARGS

    - name: Upload coverage artifact
      if: inputs.upload_artifact_name != '' && always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.upload_artifact_name }}
        path: ${{ inputs.upload_artifact_paths }}
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: warn
