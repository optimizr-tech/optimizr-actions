name: Optimizr security gate
description: Report all Trivy findings and block only actionable security failures

inputs:
  scan_type:
    description: "Scan type: fs or image"
    required: false
    default: "fs"
  scan_ref:
    description: "Filesystem target or fallback image reference"
    required: false
    default: "."
  image_refs:
    description: "Whitespace or newline separated image references/IDs for image scans"
    required: false
    default: ""
  docker_mode:
    description: "Local image access mode: auto, direct, or sudo"
    required: false
    default: "auto"
  severity:
    description: "Blocking severities"
    required: false
    default: "HIGH,CRITICAL"
  ignore_unfixed:
    description: "Deprecated compatibility input; vulnerabilities without fixes are always signal-only"
    required: false
    default: "true"
  exceptions_file:
    description: "Optional Optimizr JSON exception policy"
    required: false
    default: ""
  baseline_file:
    description: "Optional reviewed, expiring vulnerability baseline for immutable image IDs"
    required: false
    default: ""
  trivy_version:
    description: "Controlled Trivy release"
    required: false
    default: "v0.70.0"
  db_max_age_hours:
    description: "Maximum accepted age of the downloaded vulnerability database"
    required: false
    default: "30"
  evidence_dir:
    description: "Directory for reports and sanitized evidence"
    required: false
    default: "artifacts/security-gate"
  remediation_window_enabled:
    description: "Enable governed remediation-window evaluation"
    required: false
    default: "false"
  remediation_window_policy_file:
    description: "Repository-relative remediation-window policy JSON"
    required: false
    default: ""
  remediation_window_service_scope:
    description: "Declared service scope for remediation-window evaluation"
    required: false
    default: ""
  remediation_window_exposure_criticality:
    description: "Declared exposure/criticality for remediation-window evaluation"
    required: false
    default: ""

outputs:
  evidence_dir:
    description: "Directory containing reports and evidence"
    value: ${{ steps.scan.outputs.evidence_dir }}
  result:
    description: "Legacy result: passed or failed"
    value: ${{ steps.scan.outputs.result }}
  classification:
    description: "clean, actionable_vulnerability, unfixed_warning, misconfiguration_detected, secret_detected, or scanner_error"
    value: ${{ steps.scan.outputs.classification }}
  failure_reason:
    description: "Sanitized operational reason when the gate cannot run"
    value: ${{ steps.scan.outputs.failure_reason }}
  fixable_vulnerability_count:
    description: "Number of effective vulnerabilities with an available fixed version"
    value: ${{ steps.scan.outputs.fixable_vulnerability_count }}
  unfixed_vulnerability_count:
    description: "Number of effective vulnerabilities without an available fixed version"
    value: ${{ steps.scan.outputs.unfixed_vulnerability_count }}
  misconfiguration_count:
    description: "Number of blocking misconfigurations"
    value: ${{ steps.scan.outputs.misconfiguration_count }}
  secret_count:
    description: "Number of detected secrets"
    value: ${{ steps.scan.outputs.secret_count }}
  remediation_window_allowed:
    description: "Whether every blocking image finding is covered by an active governed window"
    value: ${{ steps.scan.outputs.remediation_window_allowed }}
  remediation_state:
    description: "Aggregate remediation-window state"
    value: ${{ steps.scan.outputs.remediation_state }}
  remediation_window_decision:
    description: "not_applicable, blocked, or allowed_window"
    value: ${{ steps.scan.outputs.remediation_window_decision }}
  remediation_window_classification:
    description: "Classification attached to the aggregate decision"
    value: ${{ steps.scan.outputs.remediation_window_classification }}
  remediation_window_count:
    description: "Number of exact matching policy entries"
    value: ${{ steps.scan.outputs.remediation_window_count }}
  remediation_window_blocking_total:
    description: "Total unique blocking findings evaluated"
    value: ${{ steps.scan.outputs.remediation_window_blocking_total }}
  remediation_window_covered:
    description: "Blocking findings covered by active windows"
    value: ${{ steps.scan.outputs.remediation_window_covered }}
  remediation_window_uncovered:
    description: "Blocking findings not covered by active windows"
    value: ${{ steps.scan.outputs.remediation_window_uncovered }}
  remediation_window_rejected_count:
    description: "Findings rejected by risk or validation policy"
    value: ${{ steps.scan.outputs.remediation_window_rejected_count }}
  remediation_window_overdue_count:
    description: "Findings with overdue policy entries"
    value: ${{ steps.scan.outputs.remediation_window_overdue_count }}
  remediation_window_unmatched_count:
    description: "Findings without exact policy entries"
    value: ${{ steps.scan.outputs.remediation_window_unmatched_count }}
  remediation_window_reintroduced_count:
    description: "Observed findings whose reviewed lifecycle is resolved or reintroduced"
    value: ${{ steps.scan.outputs.remediation_window_reintroduced_count }}
  remediation_window_due_soon_count:
    description: "Covered findings due within 72 hours"
    value: ${{ steps.scan.outputs.remediation_window_due_soon_count }}
  nearest_deadline:
    description: "Nearest reviewed remediation deadline"
    value: ${{ steps.scan.outputs.nearest_deadline }}
  policy_digest:
    description: "SHA256 digest of the evaluated remediation policy"
    value: ${{ steps.scan.outputs.policy_digest }}
  evaluator_version:
    description: "Remediation-window evaluator version"
    value: ${{ steps.scan.outputs.evaluator_version }}
  remediation_window_failure_reason:
    description: "Sanitized remediation-window failure reason"
    value: ${{ steps.scan.outputs.remediation_window_failure_reason }}

runs:
  using: composite
  steps:
    - name: Install controlled Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: ${{ inputs.trivy_version }}
        cache: "true"
        path: ${{ runner.temp }}/optimizr-trivy/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    - name: Run blocking security gate
      id: scan
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy_version }}
        INPUT_SCAN_TYPE: ${{ inputs.scan_type }}
        INPUT_SCAN_REF: ${{ inputs.scan_ref }}
        INPUT_IMAGE_REFS: ${{ inputs.image_refs }}
        INPUT_DOCKER_MODE: ${{ inputs.docker_mode }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
        INPUT_EXCEPTIONS_FILE: ${{ inputs.exceptions_file }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline_file }}
        INPUT_DB_MAX_AGE_HOURS: ${{ inputs.db_max_age_hours }}
        INPUT_EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        INPUT_REMEDIATION_WINDOW_ENABLED: ${{ inputs.remediation_window_enabled }}
        INPUT_REMEDIATION_WINDOW_POLICY_FILE: ${{ inputs.remediation_window_policy_file }}
        INPUT_REMEDIATION_WINDOW_SERVICE_SCOPE: ${{ inputs.remediation_window_service_scope }}
        INPUT_REMEDIATION_WINDOW_EXPOSURE_CRITICALITY: ${{ inputs.remediation_window_exposure_criticality }}
      run: |
        set -euo pipefail

        action_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        evidence_tool="$action_root/scripts/security_gate/evidence.py"
        report_tool="$action_root/scripts/security_gate/report.py"
        aggregate_tool="$action_root/scripts/security_gate/aggregate.py"
        baseline_tool="$action_root/scripts/security_gate/baseline.py"
        remediation_window_tool="$action_root/scripts/security_gate/remediation_window.py"
        transport_tool="$action_root/scripts/security_gate/image_transport.py"
        repository="${GITHUB_REPOSITORY:-local/unknown}"
        cache_root="$(python3 "$action_root/scripts/security_gate/cache.py" root --repository "$repository")"
        cache_dir="$(python3 "$action_root/scripts/security_gate/cache.py" path --repository "$repository" --trivy-version "$TRIVY_VERSION")"
        evidence_dir="$INPUT_EVIDENCE_DIR"

        {
          echo "evidence_dir=$evidence_dir"
          echo "result=failed"
          echo "classification=scanner_error"
          echo "failure_reason="
          echo "fixable_vulnerability_count=0"
          echo "unfixed_vulnerability_count=0"
          echo "misconfiguration_count=0"
          echo "secret_count=0"
          echo "remediation_window_allowed=false"
          echo "remediation_state=not_applicable"
          echo "remediation_window_decision=not_applicable"
          echo "remediation_window_classification="
          echo "remediation_window_count=0"
          echo "remediation_window_blocking_total=0"
          echo "remediation_window_covered=0"
          echo "remediation_window_uncovered=0"
          echo "remediation_window_rejected_count=0"
          echo "remediation_window_overdue_count=0"
          echo "remediation_window_unmatched_count=0"
          echo "remediation_window_reintroduced_count=0"
          echo "remediation_window_due_soon_count=0"
          echo "nearest_deadline="
          echo "policy_digest="
          echo "evaluator_version=2"
          echo "remediation_window_failure_reason="
        } >> "$GITHUB_OUTPUT"

        for path in "$cache_root" "$cache_dir"; do
          if [ -L "$path" ]; then
            echo "::error::security cache path must not be a symbolic link: $path" >&2
            exit 2
          fi
        done
        mkdir -p "$cache_root" "$evidence_dir"
        if [ "$(stat -c '%u' "$cache_root")" != "$(id -u)" ]; then
          echo "::error::security cache is not owned by the runner user: $cache_root" >&2
          exit 2
        fi
        if ! command -v flock >/dev/null 2>&1; then
          echo "failure_reason=missing_flock" >> "$GITHUB_OUTPUT"
          echo "::error title=Missing security-gate runner dependency::flock is required to protect the shared Trivy cache. Install util-linux on the self-hosted runner or use a runner image that provides flock; do not bypass the lock." >&2
          exit 2
        fi
        exec 9>"$cache_root/gate.lock"
        flock -x 9
        python3 "$action_root/scripts/security_gate/cache.py" prepare \
          --repository "$repository" \
          --trivy-version "$TRIVY_VERSION" \
          --retention-days 14
        chmod 700 "$cache_root" "$cache_dir"

        case "$INPUT_SCAN_TYPE" in
          fs) scanners="vuln,misconfig,secret" ;;
          image) scanners="vuln,secret" ;;
          *)
            echo "::error::scan_type must be fs or image" >&2
            exit 2
            ;;
        esac
        case "$INPUT_DOCKER_MODE" in
          auto|direct|sudo) ;;
          *)
            echo "::error::docker_mode must be auto, direct, or sudo" >&2
            echo "failure_reason=docker_mode_invalid" >> "$GITHUB_OUTPUT"
            exit 2
            ;;
        esac
        case "$INPUT_IGNORE_UNFIXED" in
          true|false) ;;
          *)
            echo "::error::ignore_unfixed must be true or false" >&2
            exit 2
            ;;
        esac
        case "$INPUT_REMEDIATION_WINDOW_ENABLED" in
          true|false) ;;
          *)
            echo "::error::remediation_window_enabled must be true or false" >&2
            exit 2
            ;;
        esac
        if [ "$INPUT_IGNORE_UNFIXED" = false ]; then
          echo "::notice title=Security policy updated::ignore_unfixed=false is deprecated; vulnerabilities without an available fix remain visible but do not block deployment."
        fi
        if [ -n "$INPUT_BASELINE_FILE" ] && [ "$INPUT_SCAN_TYPE" != image ]; then
          echo "::error::baseline_file is supported only for immutable image scans" >&2
          exit 2
        fi
        if ! [[ "$INPUT_DB_MAX_AGE_HOURS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
          echo "::error::db_max_age_hours must be numeric" >&2
          exit 2
        fi

        echo "::group::Refresh Trivy vulnerability database"
        trivy --cache-dir "$cache_dir" image --download-db-only
        python3 "$evidence_tool" validate-db \
          --metadata "$cache_dir/db/metadata.json" \
          --max-age-hours "$INPUT_DB_MAX_AGE_HOURS" \
          --output "$evidence_dir/trivy-db.json"
        echo "::endgroup::"

        targets=()
        if [ "$INPUT_SCAN_TYPE" = fs ]; then
          targets+=("$INPUT_SCAN_REF")
        elif [ -n "$INPUT_IMAGE_REFS" ]; then
          while IFS= read -r target; do
            [ -n "$target" ] && targets+=("$target")
          done < <(printf '%s\n' "$INPUT_IMAGE_REFS" | tr '[:space:]' '\n' | sed '/^$/d')
        else
          targets+=("$INPUT_SCAN_REF")
        fi
        if [ "${#targets[@]}" -eq 0 ]; then
          echo "::error::security gate has no targets" >&2
          exit 2
        fi

        trivy_version="$(trivy --version | head -n 1)"
        head_sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"
        aggregate_status=0
        scanner_error=0
        summary_paths=()
        remediation_observation_paths=()
        remediation_summary="$evidence_dir/remediation-window-summary.json"
        temporary_image=""
        transport_metadata=""
        cleanup_transport_artifacts() {
          if [ -n "${temporary_image:-}" ]; then
            rm -f -- "$temporary_image" 2>/dev/null || true
          fi
          if [ -n "${transport_metadata:-}" ]; then
            rm -f -- "$transport_metadata" 2>/dev/null || true
          fi
        }
        trap cleanup_transport_artifacts EXIT

        for target in "${targets[@]}"; do
          slug="$(printf '%s' "$target" | sha256sum | cut -c1-16)"
          prefix="$evidence_dir/${INPUT_SCAN_TYPE}-${slug}"
          exception_policy_file="${prefix}-exceptions-policy.json"
          exception_summary="${prefix}-exceptions.json"
          baseline_summary="${prefix}-baseline.json"
          table_report="${prefix}.txt"
          json_report="${prefix}.json"
          complete_summary="${prefix}-complete-summary.json"
          blocking_json_report="${prefix}-blocking.json"
          enforced_json_report="${prefix}-enforced.json"
          sarif_report="${prefix}.sarif"
          finding_summary="${prefix}-summary.json"
          evidence_report="${prefix}-evidence.json"
          temporary_image=""
          archive_token="$(printf '%s' "${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-${GITHUB_JOB:-security}-${slug}" | sha256sum | cut -c1-24)"
          transport_metadata="${RUNNER_TEMP:-/tmp}/trivy-${archive_token}-transport.json"

          command_name=filesystem
          target_args=("$target")
          identity=""
          lineage_args=()
          if [ "$INPUT_SCAN_TYPE" = image ]; then
            command_name=image
            temporary_image="${RUNNER_TEMP:-/tmp}/trivy-${archive_token}.tar"
            if ! python3 "$transport_tool" \
              --target "$target" \
              --mode "$INPUT_DOCKER_MODE" \
              --archive "$temporary_image" \
              --output "$transport_metadata" \
              --uid "$(id -u)" \
              --gid "$(id -g)"; then
              failure_reason="$(python3 - "$transport_metadata" 2>/dev/null <<'PY' || true
        import json
        import sys

        try:
            with open(sys.argv[1], encoding="utf-8") as stream:
                payload = json.load(stream)
        except (OSError, json.JSONDecodeError, IndexError):
            payload = {}
        print(payload.get("failure_reason") or "docker_transport_failed")
        PY
              )"
              echo "failure_reason=${failure_reason}" >> "$GITHUB_OUTPUT"
              echo "::error::image scan transport failed: ${failure_reason}" >&2
              rm -f "$transport_metadata" "$temporary_image"
              exit 2
            fi
            transport="$(python3 - "$transport_metadata" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as stream:
            print(json.load(stream).get("transport", ""))
        PY
            )"
            identity="$(python3 - "$transport_metadata" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as stream:
            print(json.load(stream).get("identity", ""))
        PY
            )"
            while IFS= read -r lineage_digest; do
              [ -n "$lineage_digest" ] && lineage_args+=(--lineage-digest "$lineage_digest")
            done < <(python3 - "$transport_metadata" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as stream:
            payload = json.load(stream)
        for digest in payload.get("lineage_digests", []) or []:
            print(digest)
        PY
            )
            if [ "$transport" = archive ]; then
              target_args=(--input "$temporary_image")
            elif [ "$transport" = direct ]; then
              target_args=("$target")
            else
              echo "failure_reason=docker_transport_invalid" >> "$GITHUB_OUTPUT"
              echo "::error::image scan transport returned an invalid mode" >&2
              rm -f "$transport_metadata" "$temporary_image"
              exit 2
            fi
          fi

          exception_args=(
            render-exceptions
            --target "$target"
            --output "$exception_policy_file"
            --summary-output "$exception_summary"
            "${lineage_args[@]}"
          )
          if [ -n "$INPUT_EXCEPTIONS_FILE" ]; then
            exception_args+=(--source "$INPUT_EXCEPTIONS_FILE")
          fi
          python3 "$evidence_tool" "${exception_args[@]}"

          report_args=(
            --cache-dir "$cache_dir"
            --severity "$INPUT_SEVERITY"
            --show-suppressed
            --scanners "$scanners"
          )
          blocking_args=("${report_args[@]}" --ignore-unfixed)

          echo "::group::Trivy $INPUT_SCAN_TYPE scan: $target"
          trivy --cache-dir "$cache_dir" "$command_name" "${report_args[@]}" \
            --format table --exit-code 0 --output "$table_report" \
            "${target_args[@]}"
          if ! python3 - "$table_report" <<'PY'
        import errno
        import os
        import sys
        import time

        report_path = sys.argv[1]
        retryable = {errno.EAGAIN, errno.EWOULDBLOCK}
        deadline = time.monotonic() + 60

        with open(report_path, "rb", buffering=0) as report:
            while chunk := report.read(64 * 1024):
                pending = memoryview(chunk)
                while pending:
                    try:
                        written = os.write(sys.stdout.fileno(), pending)
                    except OSError as exc:
                        if exc.errno not in retryable or time.monotonic() >= deadline:
                            sys.exit(1)
                        time.sleep(0.1)
                        continue
                    if written == 0:
                        sys.exit(1)
                    pending = pending[written:]
        PY
          then
            echo "::warning::Unable to stream complete Trivy table report; full report remains in the security-gate artifact." >&2 || true
          fi
          trivy --cache-dir "$cache_dir" "$command_name" "${report_args[@]}" \
            --format sarif --exit-code 0 --output "$sarif_report" \
            "${target_args[@]}"
          trivy --cache-dir "$cache_dir" "$command_name" "${report_args[@]}" \
            --format json --exit-code 0 --output "$json_report" \
            "${target_args[@]}"

          complete_summary_args=(
            --report "$json_report"
            --output "$complete_summary"
          )
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            complete_summary_args+=(--github-summary "$GITHUB_STEP_SUMMARY")
          fi
          python3 "$report_tool" "${complete_summary_args[@]}"

          set +e
          trivy --cache-dir "$cache_dir" "$command_name" "${blocking_args[@]}" \
            --format json --exit-code 1 --output "$blocking_json_report" \
            "${target_args[@]}"
          scan_status=$?
          set -e

          filtered_blocking_json_report="${prefix}-filtered.json"
          python3 "$evidence_tool" filter-report \
            --report "$blocking_json_report" \
            --policy "$exception_policy_file" \
            --output "$filtered_blocking_json_report"
          filtered_summary="${prefix}-filtered-summary.json"
          python3 "$report_tool" \
            --report "$filtered_blocking_json_report" \
            --output "$filtered_summary"
          if python3 - "$filtered_summary" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as stream:
            summary = json.load(stream)
        blocked = (
            summary["vulnerabilities"]["fixable"]
            or summary["misconfigurations"]
            or summary["secrets"]
        )
        raise SystemExit(1 if blocked else 0)
        PY
          then
            scan_status=0
          else
            scan_status=1
          fi

          if [ -n "$INPUT_BASELINE_FILE" ]; then
            set +e
            python3 "$baseline_tool" \
              --report "$filtered_blocking_json_report" \
              --baseline "$INPUT_BASELINE_FILE" \
              --scope "$target" \
              --output "$enforced_json_report" \
              --summary-output "$baseline_summary"
            scan_status=$?
            set -e
          else
            cp "$filtered_blocking_json_report" "$enforced_json_report"
            python3 - "$baseline_summary" <<'PY'
        import json
        import pathlib
        import sys

        pathlib.Path(sys.argv[1]).write_text(
            json.dumps({"schema_version": 1, "status": "not-configured"}, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY
          fi

          python3 "$report_tool" \
            --report "$enforced_json_report" \
            --output "$finding_summary"
          summary_paths+=("$finding_summary")
          echo "::endgroup::"

          window_observation="${prefix}-remediation-window-observations.json"
          printf '%s\n' '{"schema_version":1,"observations":[]}' > "$window_observation"
          if [ "$INPUT_REMEDIATION_WINDOW_ENABLED" = true ] && [ "$INPUT_SCAN_TYPE" = image ] && [ "$scan_status" -eq 1 ]; then
            if [ -z "$INPUT_REMEDIATION_WINDOW_SERVICE_SCOPE" ] || [ -z "$INPUT_REMEDIATION_WINDOW_EXPOSURE_CRITICALITY" ]; then
              echo "::error::remediation window service scope and exposure/criticality are required" >&2
              echo "remediation_window_failure_reason=window_context_missing" >> "$GITHUB_OUTPUT"
              scan_status=2
              scanner_error=1
            elif ! python3 "$remediation_window_tool" collect \
              --report "$enforced_json_report" \
              --transport-metadata "$transport_metadata" \
              --output "$window_observation" \
              --service-scope "$INPUT_REMEDIATION_WINDOW_SERVICE_SCOPE" \
              --exposure-criticality "$INPUT_REMEDIATION_WINDOW_EXPOSURE_CRITICALITY" \
              --source-sha "$head_sha" \
              --image-identity "$identity"; then
              echo "::error::failed to collect remediation-window observations" >&2
              echo "remediation_window_failure_reason=window_observation_failed" >> "$GITHUB_OUTPUT"
              scan_status=2
              scanner_error=1
            fi
          fi
          remediation_observation_paths+=("$window_observation")

          if [ "$scan_status" -gt 1 ]; then
            scanner_error=1
          fi

          if [ "$INPUT_SCAN_TYPE" = image ] && [ -z "$identity" ]; then
            echo "::error::image scan did not resolve an immutable identity" >&2
            echo "failure_reason=docker_identity_missing" >> "$GITHUB_OUTPUT"
            scan_status=2
            scanner_error=1
          fi

          result=passed
          if [ "$scan_status" -ne 0 ]; then
            result=failed
            aggregate_status=1
          fi
          evidence_args=(
            write-evidence
            --output "$evidence_report"
            --repository "$repository"
            --head-sha "$head_sha"
            --scan-type "$INPUT_SCAN_TYPE"
            --target "$target"
            --identity "$identity"
            --severity "$INPUT_SEVERITY"
            --trivy-version "$trivy_version"
            --database "$evidence_dir/trivy-db.json"
            --exception-summary "$exception_summary"
            --report "table=$table_report"
            --report "json=$json_report"
            --report "complete_summary=$complete_summary"
            --report "blocking_json=$blocking_json_report"
            --report "filtered_blocking_json=$filtered_blocking_json_report"
            --report "enforced_json=$enforced_json_report"
            --report "baseline=$baseline_summary"
            --report "sarif=$sarif_report"
            --report "summary=$finding_summary"
            --report "remediation_observations=$window_observation"
            --result "$result"
            --ignore-unfixed
          )
          python3 "$evidence_tool" "${evidence_args[@]}"
          rm -f "$temporary_image" "$transport_metadata"
        done

        remediation_eval_args=(
          evaluate
          --workspace "${GITHUB_WORKSPACE:-$PWD}"
          --output "$remediation_summary"
          --github-output "$GITHUB_OUTPUT"
          --enabled "$INPUT_REMEDIATION_WINDOW_ENABLED"
        )
        if [ "$INPUT_REMEDIATION_WINDOW_ENABLED" = true ]; then
          if [ "$INPUT_SCAN_TYPE" != image ] || [ -z "$INPUT_REMEDIATION_WINDOW_POLICY_FILE" ]; then
            echo "::error::enabled remediation windows require an image scan and repository policy" >&2
            echo "remediation_window_failure_reason=window_policy_unavailable" >> "$GITHUB_OUTPUT"
            scanner_error=1
            aggregate_status=1
          else
            remediation_eval_args+=(--policy "$INPUT_REMEDIATION_WINDOW_POLICY_FILE")
            for observation_path in "${remediation_observation_paths[@]}"; do
              remediation_eval_args+=(--observations "$observation_path")
            done
          fi
        fi
        if [ "$scanner_error" -eq 0 ] || [ "$INPUT_REMEDIATION_WINDOW_ENABLED" = false ]; then
          if ! python3 "$remediation_window_tool" "${remediation_eval_args[@]}"; then
            echo "::error::remediation-window evaluation failed closed" >&2
            echo "remediation_window_failure_reason=window_evaluation_failed" >> "$GITHUB_OUTPUT"
            scanner_error=1
            aggregate_status=1
          fi
        fi

        aggregate_args=()
        for summary_path in "${summary_paths[@]}"; do
          aggregate_args+=(--summary "$summary_path")
        done
        if [ "$scanner_error" -ne 0 ]; then
          aggregate_args+=(--gate-error)
        fi
        python3 "$aggregate_tool" \
          "${aggregate_args[@]}" \
          --github-output "$GITHUB_OUTPUT"

        if [ "$aggregate_status" -eq 0 ]; then
          echo "result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "result=failed" >> "$GITHUB_OUTPUT"
        fi
        exit "$aggregate_status"
