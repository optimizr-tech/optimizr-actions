name: Optimizr dependency policy
description: Validate Python/Node lockfiles and enforce Trivy vulnerability and license policy
inputs:
  working_directory:
    description: Repository-relative project directory containing the package manifest and lockfile
    required: false
    default: "."
  policy_file:
    description: Optional repository-relative dependency policy JSON
    required: false
    default: ""
  trivy_version:
    description: Controlled Trivy version
    required: false
    default: v0.70.0
  node_version:
    description: Controlled Node.js version used for Node lock validation
    required: false
    default: "24"
  npm_version:
    description: Controlled npm version used for package-lock validation
    required: false
    default: "11"
  evidence_dir:
    description: Sanitized repository-relative evidence directory
    required: false
    default: artifacts/dependency-policy
outputs:
  evidence_dir:
    description: Evidence directory
    value: ${{ inputs.evidence_dir }}
runs:
  using: composite
  steps:
    - name: Resolve confined dependency root
      id: root
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        case "$WORKING_DIRECTORY" in
          ""|/*|*".."*) echo "::error::working_directory must be repository relative"; exit 2 ;;
        esac
        candidate="$GITHUB_WORKSPACE/$WORKING_DIRECTORY"
        root="$(realpath -e "$candidate")"
        case "$root" in
          "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
          *) echo "::error::working_directory resolves outside the repository"; exit 2 ;;
        esac
        if [ ! -d "$root" ] || [ -L "$candidate" ]; then
          echo "::error::working_directory must be a non-symlink directory"; exit 2
        fi
        echo "root=$root" >> "$GITHUB_OUTPUT"

    - name: Detect dependency ecosystems
      id: ecosystems
      shell: bash
      env:
        DEPENDENCY_ROOT: ${{ steps.root.outputs.root }}
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        REQUESTED_NODE_VERSION: ${{ inputs.node_version }}
        REQUESTED_NPM_VERSION: ${{ inputs.npm_version }}
      run: |
        set -euo pipefail
        action_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        policy_tool="$action_root/scripts/dependency_policy/policy.py"
        ecosystems_file="$RUNNER_TEMP/optimizr-dependency-ecosystems-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.txt"
        python3 "$policy_tool" detect --root "$DEPENDENCY_ROOT" > "$ecosystems_file"

        node_required=false
        npm_required=false
        while IFS= read -r ecosystem; do
          case "$ecosystem" in
            node-npm)
              node_required=true
              npm_required=true
              ;;
            node-pnpm|node-yarn)
              node_required=true
              ;;
          esac
        done < "$ecosystems_file"

        {
          echo "ecosystems_file=$ecosystems_file"
          echo "node_required=$node_required"
          echo "npm_required=$npm_required"
        } >> "$GITHUB_OUTPUT"

        mkdir -p "$GITHUB_WORKSPACE/$EVIDENCE_DIR"
        ECOSYSTEMS_FILE="$ecosystems_file" \
        TOOLCHAIN_PATH="$GITHUB_WORKSPACE/$EVIDENCE_DIR/toolchain.json" \
        python3 - <<'PY'
        import json
        import os
        import platform
        from pathlib import Path

        ecosystems = [
            line.strip()
            for line in Path(os.environ["ECOSYSTEMS_FILE"]).read_text(encoding="utf-8").splitlines()
            if line.strip()
        ]
        payload = {
            "schema_version": 1,
            "ecosystems": ecosystems,
            "requested": {
                "node": os.environ["REQUESTED_NODE_VERSION"],
                "npm": os.environ["REQUESTED_NPM_VERSION"],
            },
            "resolved": {
                "python": platform.python_version(),
                "node": None,
                "npm": None,
            },
        }
        Path(os.environ["TOOLCHAIN_PATH"]).write_text(
            json.dumps(payload, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

    - name: Setup controlled Node.js
      if: steps.ecosystems.outputs.node_required == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node_version }}

    - name: Setup controlled npm
      if: steps.ecosystems.outputs.npm_required == 'true'
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm_version }}
      run: |
        set -euo pipefail
        case "$NPM_VERSION" in
          ""|*[!0-9A-Za-z._+-]*)
            echo "::error::npm_version contains unsupported characters"
            exit 2
            ;;
        esac
        npm install --global --no-audit --no-fund "npm@${NPM_VERSION}"
        node --version
        npm --version

    - name: Record resolved dependency toolchain
      shell: bash
      env:
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        NODE_REQUIRED: ${{ steps.ecosystems.outputs.node_required }}
        NPM_REQUIRED: ${{ steps.ecosystems.outputs.npm_required }}
      run: |
        set -euo pipefail
        TOOLCHAIN_PATH="$GITHUB_WORKSPACE/$EVIDENCE_DIR/toolchain.json" \
        python3 - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path

        path = Path(os.environ["TOOLCHAIN_PATH"])
        payload = json.loads(path.read_text(encoding="utf-8"))

        def resolve(command: list[str]) -> str:
            return subprocess.check_output(command, text=True).strip()

        if os.environ["NODE_REQUIRED"] == "true":
            payload["resolved"]["node"] = resolve(["node", "--version"])
        if os.environ["NPM_REQUIRED"] == "true":
            payload["resolved"]["npm"] = resolve(["npm", "--version"])

        path.write_text(
            json.dumps(payload, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY

    - name: Install controlled Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: ${{ inputs.trivy_version }}
        cache: "true"
        path: ${{ runner.temp }}/optimizr-trivy/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    - name: Validate lockfile synchronization
      shell: bash
      env:
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        DEPENDENCY_ROOT: ${{ steps.root.outputs.root }}
        ECOSYSTEMS_FILE: ${{ steps.ecosystems.outputs.ecosystems_file }}
      run: |
        set -euo pipefail
        action_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        policy_tool="$action_root/scripts/dependency_policy/policy.py"
        mapfile -t ecosystems < "$ECOSYSTEMS_FILE"
        cd "$DEPENDENCY_ROOT"
        for ecosystem in "${ecosystems[@]}"; do
          case "$ecosystem" in
            python-uv)
              python3 -m pip install --disable-pip-version-check --user 'uv==0.8.3'
              export PATH="$HOME/.local/bin:$PATH"
              python_version="$(python3 - <<'PY'
        from pathlib import Path
        import re
        import tomllib

        project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8")).get("project", {})
        requirement = project.get("requires-python") or ""
        match = re.search(r"(?:^|,)\s*>=\s*([0-9]+(?:\.[0-9]+){0,2})", requirement)
        if requirement and match is None:
            raise SystemExit("requires-python must declare a minimum Python version")
        print(match.group(1) if match else "")
        PY
        )"
              if [ -n "$python_version" ]; then
                uv python install "$python_version"
              else
                uv python install
              fi
              uv lock --check
              ;;
            python-poetry)
              python3 -m pip install --disable-pip-version-check --user 'poetry==2.1.4'
              export PATH="$HOME/.local/bin:$PATH"
              poetry check --lock
              ;;
            node-pnpm)
              corepack enable
              corepack prepare 'pnpm@10.13.1' --activate
              pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
              git diff --exit-code -- pnpm-lock.yaml
              ;;
            node-npm)
              python3 "$policy_tool" validate-npm-lock --root "$DEPENDENCY_ROOT"
              npm ci --ignore-scripts --no-audit --no-fund
              git diff --exit-code -- package-lock.json
              ;;
            node-yarn)
              corepack enable
              corepack prepare 'yarn@4.9.2' --activate
              yarn install --immutable --mode=skip-builds
              git diff --exit-code -- yarn.lock
              ;;
            *) echo "::error::unsupported ecosystem: $ecosystem"; exit 2 ;;
          esac
        done

    - name: Generate dependency vulnerability and license report
      shell: bash
      env:
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        DEPENDENCY_ROOT: ${{ steps.root.outputs.root }}
      run: |
        set -euo pipefail
        trivy filesystem \
          --scanners vuln,license \
          --license-full \
          --format json \
          --exit-code 0 \
          --output "$GITHUB_WORKSPACE/$EVIDENCE_DIR/trivy-dependencies.json" \
          "$DEPENDENCY_ROOT"

    - name: Enforce reviewed dependency policy
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.policy_file }}
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        DEPENDENCY_ROOT: ${{ steps.root.outputs.root }}
      run: |
        set -euo pipefail
        action_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        policy="$POLICY_FILE"
        if [ -z "$policy" ]; then
          policy="$action_root/policies/dependency-policy.default.json"
        elif [[ "$policy" = /* || "$policy" = *".."* ]]; then
          echo "::error::policy_file must be repository relative"; exit 2
        else
          policy="$(realpath -e "$GITHUB_WORKSPACE/$policy")"
          case "$policy" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "::error::policy_file resolves outside the repository"; exit 2 ;;
          esac
        fi
        python3 "$action_root/scripts/dependency_policy/policy.py" evaluate \
          --root "$DEPENDENCY_ROOT" \
          --report "$GITHUB_WORKSPACE/$EVIDENCE_DIR/trivy-dependencies.json" \
          --policy "$policy" \
          --output "$GITHUB_WORKSPACE/$EVIDENCE_DIR/evidence.json" \
          --repository "$GITHUB_REPOSITORY" \
          --head-sha "$GITHUB_SHA"
